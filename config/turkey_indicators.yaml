# Turkey Macroeconomic Indicator Manifest (Data-First v4)
# Sources: Eurostat (TurkStat harmonized series), TCMB XML/EVDS, IMF SDMX / DataMapper / DBnomics, BIS / OECD via FRED, Bruegel REER
name: "Turkey"
name_zh: "土耳其"
code: "TR"
iso2: "TR"
subtitle_en: "A data-first macro page for Turkey built from official TurkStat harmonized series transmitted to Eurostat, TCMB XML, IMF SDMX / DataMapper, and Bruegel REER."
subtitle_zh: "基于土耳其统计局向欧盟统计局报送的调和序列、土耳其央行(TCMB)官方汇率、IMF与Bruegel实际有效汇率构建的土耳其数据优先宏观页面。"
min_chart_count: 30

sections:
  growth_accounts:
    title_en: "GDP & National Accounts"
    title_zh: "GDP与国民账户"
    report_logic_en: "Eurostat quarterly national accounts anchor Turkey's growth story: real GDP sequential QoQ SA and annual YoY growth, household consumption, gross fixed capital formation, government consumption, and trade volumes."
    report_logic_zh: "欧盟统计局(Eurostat)季度国民账户构成土耳其增长叙事基准：实际GDP季调环比与同比增速、居民消费、固定资本形成总额、政府消费及进出口贸易量。"
  production_cycle:
    title_en: "Production & Business Cycle"
    title_zh: "生产与商业周期"
    report_logic_en: "Eurostat monthly short-term business statistics (STS) track industrial and manufacturing production, retail trade volume, and construction output. DG ECFIN business and consumer surveys supply capacity utilisation and the headline Economic Sentiment Indicator (ESI)."
    report_logic_zh: "欧盟统计局月度短期商业统计(STS)追踪工业与制造业生产、零售销售量与建筑业产出。商业与消费者调查提供产能利用率与综合经济景气指数(ESI)。"
  labour_wages:
    title_en: "Labour Market & Wages"
    title_zh: "劳动力市场与工资"
    report_logic_en: "Harmonised unemployment and youth unemployment rates track labour slack and employment conditions conforming to ILO standards."
    report_logic_zh: "调和失业率与青年失业率衡量符合国际劳工组织(ILO)标准的劳动力闲置与就业状况。"
  prices_costs:
    title_en: "Prices & Costs"
    title_zh: "价格与成本"
    report_logic_en: "Eurostat monthly HICP provides headline, core (excluding energy and food), services, energy, and food annual inflation. Industrial producer prices (PPI) capture pipeline production pressures, with independent IMF CPI cross-check."
    report_logic_zh: "欧盟统计局月度调和消费者物价指数(HICP)提供总体、核心（剔除能源与食品）、服务、能源与食品通胀年率。工业生产者出厂价格(PPI)捕捉生产端管道压力，配合IMF总体CPI交叉核对。"
  housing_property:
    title_en: "Housing & Property"
    title_zh: "住房与房地产"
    report_logic_en: "Eurostat quarterly residential property price index (HPI) tracks residential property valuations across Turkey, cross-checked with the BIS long-term index."
    report_logic_zh: "欧盟统计局季度住宅价格指数(HPI)跟踪土耳其全国住宅房地产估值，配合国际清算银行(BIS)长期指数核对。"
  external_fx:
    title_en: "External Balance & FX"
    title_zh: "外部平衡与汇率"
    report_logic_en: "BPM6 balance of payments current account, goods balance, and tourism service revenues capture external dynamics, alongside daily TCMB USD/TRY fixing and Bruegel 120-trading-partner REER/NEER."
    report_logic_zh: "BPM6国际收支经常账户、货物贸易差额及旅游业外汇收入刻画外部动态，配合土耳其央行官方USD/TRY汇率及Bruegel对120个贸易伙伴的实际有效汇率(REER)。"
  fiscal_sovereign:
    title_en: "Fiscal & Sovereign Debt"
    title_zh: "财政与主权债务"
    report_logic_en: "IMF World Economic Outlook and Fiscal Monitor supply general government gross debt, net lending/borrowing, and primary balance ratios."
    report_logic_zh: "IMF《世界经济展望》与《财政监测报告》提供广义政府总债务、净借贷（赤字率）及初级财政收支占GDP比重。"
  monetary_financial:
    title_en: "Monetary Policy & Financial Conditions"
    title_zh: "货币政策与金融条件"
    report_logic_en: "Overnight interbank market rates and BIS credit-to-GDP aggregates (total private, household, bank credit) measure financial conditions."
    report_logic_zh: "隔夜银行间拆借利率与国际清算银行(BIS)信贷占GDP比率（私营部门总信贷、住户信贷、银行信贷）衡量金融环境。"
  stability_structural:
    title_en: "Financial Stability & Structure"
    title_zh: "金融稳定与结构"
    report_logic_en: "IMF Financial Soundness Indicators (FSI) via DBnomics track banking sector regulatory capital adequacy (CAR) and non-performing loans (NPL)."
    report_logic_zh: "国际货币基金组织金融稳健性指标(FSI)追踪土耳其银行体系监管资本充足率(CAR)与不良贷款率(NPL)。"

indicators:
  # ==========================================
  # 1. Growth & Demand
  # ==========================================
  - id: real_gdp_growth
    section: growth_accounts
    label_en: Real GDP Growth, QoQ SA
    label_zh: 实际GDP季调环比
    unit: "% q/q"
    fetcher: eurostat
    dataset: namq_10_gdp
    filters:
      geo: TR
      na_item: B1GQ
      s_adj: SCA
      unit: CLV_PCH_PRE
    source_name: Eurostat / TurkStat
    source_url: https://ec.europa.eu/eurostat/databrowser/view/namq_10_gdp/default/table?lang=en
    frequency: quarterly
    start_date: 2005-01-01
    caveat_en: Chain-linked volumes, seasonally and calendar adjusted quarter-on-quarter growth reported by TurkStat to Eurostat.
    caveat_zh: 土耳其统计局向欧盟统计局报送的季调与工作日调整后实际GDP环比增速。

  - id: real_gdp_yoy
    section: growth_accounts
    label_en: Real GDP Growth, YoY
    label_zh: 实际GDP同比
    unit: "% y/y"
    fetcher: eurostat
    dataset: namq_10_gdp
    filters:
      geo: TR
      na_item: B1GQ
      s_adj: SCA
      unit: CLV_PCH_SM
    source_name: Eurostat / TurkStat
    source_url: https://ec.europa.eu/eurostat/databrowser/view/namq_10_gdp/default/table?lang=en
    frequency: quarterly
    start_date: 2005-01-01
    caveat_en: Year-on-year growth rate from the same quarter in the previous year.
    caveat_zh: 较上年同季的同比增速。

  - id: household_consumption
    section: growth_accounts
    label_en: Household Consumption Expenditure YoY
    label_zh: 居民消费支出同比
    unit: "% y/y"
    fetcher: eurostat
    dataset: namq_10_gdp
    filters:
      geo: TR
      na_item: P31_S14_S15
      s_adj: SCA
      unit: CLV_PCH_SM
    source_name: Eurostat / TurkStat
    source_url: https://ec.europa.eu/eurostat/databrowser/view/namq_10_gdp/default/table?lang=en
    frequency: quarterly
    start_date: 2005-01-01
    caveat_en: Final consumption expenditure of households and NPISH, real year-on-year change.
    caveat_zh: 住户部门及为住户服务的非营利机构最终消费支出同比实际增速。

  - id: gross_fixed_capital_formation
    section: growth_accounts
    label_en: Gross Fixed Capital Formation YoY
    label_zh: 固定资本形成总额同比
    unit: "% y/y"
    fetcher: eurostat
    dataset: namq_10_gdp
    filters:
      geo: TR
      na_item: P51G
      s_adj: SCA
      unit: CLV_PCH_SM
    source_name: Eurostat / TurkStat
    source_url: https://ec.europa.eu/eurostat/databrowser/view/namq_10_gdp/default/table?lang=en
    frequency: quarterly
    start_date: 2005-01-01
    caveat_en: Real year-on-year investment growth in infrastructure, equipment, and construction.
    caveat_zh: 基础设施、设备和建筑的同比实际投资增速。

  - id: government_consumption
    section: growth_accounts
    label_en: Government Final Consumption YoY
    label_zh: 政府消费支出同比
    unit: "% y/y"
    fetcher: eurostat
    dataset: namq_10_gdp
    filters:
      geo: TR
      na_item: P3_S13
      s_adj: SCA
      unit: CLV_PCH_SM
    source_name: Eurostat / TurkStat
    source_url: https://ec.europa.eu/eurostat/databrowser/view/namq_10_gdp/default/table?lang=en
    frequency: quarterly
    start_date: 2005-01-01
    caveat_en: Real general government final consumption expenditure year-on-year change.
    caveat_zh: 广义政府最终消费支出的实际同比增速。

  - id: exports_goods_services
    section: growth_accounts
    label_en: Exports of Goods & Services YoY
    label_zh: 货物与服务出口同比
    unit: "% y/y"
    fetcher: eurostat
    dataset: namq_10_gdp
    filters:
      geo: TR
      na_item: P6
      s_adj: SCA
      unit: CLV_PCH_SM
    source_name: Eurostat / TurkStat
    source_url: https://ec.europa.eu/eurostat/databrowser/view/namq_10_gdp/default/table?lang=en
    frequency: quarterly
    start_date: 2005-01-01
    caveat_en: Real exports volume year-on-year change.
    caveat_zh: 货物与服务出口实际物量同比增速。

  - id: imports_goods_services
    section: growth_accounts
    label_en: Imports of Goods & Services YoY
    label_zh: 货物与服务进口同比
    unit: "% y/y"
    fetcher: eurostat
    dataset: namq_10_gdp
    filters:
      geo: TR
      na_item: P7
      s_adj: SCA
      unit: CLV_PCH_SM
    source_name: Eurostat / TurkStat
    source_url: https://ec.europa.eu/eurostat/databrowser/view/namq_10_gdp/default/table?lang=en
    frequency: quarterly
    start_date: 2005-01-01
    caveat_en: Real imports volume year-on-year change.
    caveat_zh: 货物与服务进口实际物量同比增速。

  # ==========================================
  # 2. Production & Cycle
  # ==========================================
  - id: industrial_production_growth
    section: production_cycle
    label_en: Industrial Production YoY
    label_zh: 工业产出同比
    unit: "% y/y"
    fetcher: eurostat
    dataset: sts_inpr_m
    filters:
      geo: TR
      nace_r2: B-D
      s_adj: CA
      unit: PCH_SM
    source_name: Eurostat / TurkStat
    source_url: https://ec.europa.eu/eurostat/databrowser/view/sts_inpr_m/default/table?lang=en
    frequency: monthly
    start_date: 2005-01-01
    caveat_en: Working-day adjusted industrial production index (mining, manufacturing, utilities) year-on-year change.
    caveat_zh: 工作日调整后的工业生产指数（采矿业、制造业、公用事业）同比增速。

  - id: manufacturing_production_growth
    section: production_cycle
    label_en: Manufacturing Output YoY
    label_zh: 制造业产出同比
    unit: "% y/y"
    fetcher: eurostat
    dataset: sts_inpr_m
    filters:
      geo: TR
      nace_r2: C
      s_adj: CA
      unit: PCH_SM
    source_name: Eurostat / TurkStat
    source_url: https://ec.europa.eu/eurostat/databrowser/view/sts_inpr_m/default/table?lang=en
    frequency: monthly
    start_date: 2005-01-01
    caveat_en: Working-day adjusted manufacturing production index year-on-year change.
    caveat_zh: 工作日调整后的制造业产出指数同比增速。

  - id: retail_sales_growth
    section: production_cycle
    label_en: Retail Sales Volume YoY
    label_zh: 零售销售量同比
    unit: "% y/y"
    fetcher: eurostat
    dataset: sts_trtu_m
    filters:
      geo: TR
      nace_r2: G47
      s_adj: CA
      unit: PCH_SM
    source_name: Eurostat / TurkStat
    source_url: https://ec.europa.eu/eurostat/databrowser/view/sts_trtu_m/default/table?lang=en
    frequency: monthly
    start_date: 2010-01-01
    caveat_en: Deflated retail trade turnover (excluding motor vehicles) year-on-year change.
    caveat_zh: 剔除机动车的实际零售销售额同比增速。

  - id: construction_production_growth
    section: production_cycle
    label_en: Construction Production YoY
    label_zh: 建筑业产出同比
    unit: "% y/y"
    fetcher: eurostat
    dataset: sts_copr_m
    filters:
      geo: TR
      nace_r2: F
      s_adj: CA
      unit: PCH_SM
    source_name: Eurostat / TurkStat
    source_url: https://ec.europa.eu/eurostat/databrowser/view/sts_copr_m/default/table?lang=en
    frequency: monthly
    start_date: 2015-01-01
    caveat_en: Calendar-adjusted volume index of production in construction year-on-year change.
    caveat_zh: 工作日调整后的建筑业生产指数同比增速。

  - id: economic_sentiment_indicator
    section: production_cycle
    label_en: Economic Sentiment Indicator (ESI)
    label_zh: 经济景气指数 (ESI)
    unit: "Index (100 = Neutral)"
    fetcher: eurostat
    dataset: ei_bssi_m_r2
    filters:
      geo: TR
      indic: BS-ESI-I
      s_adj: SA
    source_name: Eurostat / DG ECFIN
    source_url: https://ec.europa.eu/eurostat/databrowser/view/ei_bssi_m_r2/default/table?lang=en
    frequency: monthly
    start_date: 2007-01-01
    caveat_en: Composite sentiment indicator tracking business and consumer confidence across the Turkish economy.
    caveat_zh: 追踪土耳其企业与消费者综合景气度的综合指标，基准100为长期均值。

  - id: capacity_utilization
    section: production_cycle
    label_en: Manufacturing Capacity Utilization
    label_zh: 制造业产能利用率
    unit: "%"
    fetcher: eurostat
    dataset: ei_bsin_q_r2
    filters:
      geo: TR
      indic: BS-ICU-PC
      s_adj: SA
    source_name: Eurostat / CBRT
    source_url: https://ec.europa.eu/eurostat/databrowser/view/ei_bsin_q_r2/default/table?lang=en
    frequency: quarterly
    start_date: 2007-01-01
    caveat_en: Seasonally adjusted manufacturing sector capacity utilization rate.
    caveat_zh: 季调后制造业产能利用率。

  - id: composite_leading_indicator
    section: production_cycle
    label_en: OECD Composite Leading Indicator (Amplitude Adjusted)
    label_zh: OECD综合领先指标 (振幅调整)
    unit: "Index (Long-term trend = 100)"
    fetcher: fred
    series: TURLOLITOAASTSAM
    source_name: FRED / OECD
    source_url: https://fred.stlouisfed.org/series/TURLOLITOAASTSAM
    frequency: monthly
    start_date: 2005-01-01
    caveat_en: OECD amplitude-adjusted Composite Leading Indicator (CLI) for Turkey.
    caveat_zh: OECD编制的土耳其振幅调整综合领先指标（CLI）。

  # ==========================================
  # 3. Labour & Wages
  # ==========================================
  - id: unemployment_rate
    section: labour_wages
    label_en: Harmonised Unemployment Rate SA
    label_zh: 季调失业率
    unit: "% of labour force"
    fetcher: eurostat
    dataset: une_rt_m
    filters:
      geo: TR
      s_adj: SA
      age: TOTAL
      sex: T
      unit: PC_ACT
    source_name: Eurostat / TurkStat
    source_url: https://ec.europa.eu/eurostat/databrowser/view/une_rt_m/default/table?lang=en
    frequency: monthly
    start_date: 2005-01-01
    caveat_en: Seasonally adjusted unemployment rate conforming to ILO standards.
    caveat_zh: 符合国际劳工组织（ILO）标准的季调失业率。

  - id: youth_unemployment_rate
    section: labour_wages
    label_en: Youth Unemployment Rate (<25) SA
    label_zh: 青年失业率 (25岁以下)
    unit: "% of labour force"
    fetcher: eurostat
    dataset: une_rt_m
    filters:
      geo: TR
      s_adj: SA
      age: Y_LT25
      sex: T
      unit: PC_ACT
    source_name: Eurostat / TurkStat
    source_url: https://ec.europa.eu/eurostat/databrowser/view/une_rt_m/default/table?lang=en
    frequency: monthly
    start_date: 2005-01-01
    caveat_en: Unemployment rate for persons aged 15-24.
    caveat_zh: 15至24岁青年劳动力的季调失业率。

  # ==========================================
  # 4. Prices & Costs
  # ==========================================
  - id: cpi_inflation
    section: prices_costs
    label_en: Headline CPI Inflation YoY
    label_zh: 总体CPI通胀率同比
    unit: "% y/y"
    fetcher: imf_sdmx
    dataflow: CPI
    series: TUR.CPI._T.YOY_PCH_PA_PT.M
    source_name: IMF SDMX / TurkStat
    source_url: https://api.imf.org/external/sdmx/2.1/data/CPI/TUR.CPI._T.YOY_PCH_PA_PT.M
    frequency: monthly
    start_date: 2005-01-01
    caveat_en: Official monthly Consumer Price Index annual rate of change reported by TurkStat via IMF CPI.
    caveat_zh: 土耳其统计局发布的官方月度消费者价格指数（CPI）同比变动率。

  - id: cpi_inflation_mom
    section: prices_costs
    label_en: Headline CPI Inflation MoM
    label_zh: 总体CPI通胀率环比
    unit: "% m/m"
    fetcher: imf_sdmx
    dataflow: CPI
    series: TUR.CPI._T.POP_PCH_PA_PT.M
    source_name: IMF SDMX / TurkStat
    source_url: https://api.imf.org/external/sdmx/2.1/data/CPI/TUR.CPI._T.POP_PCH_PA_PT.M
    frequency: monthly
    start_date: 2005-01-01
    caveat_en: Monthly sequential percentage change in headline CPI (key disinflation momentum gauge).
    caveat_zh: 总体CPI月度环比变动率（衡量通胀动能的月频核心指标）。

  - id: food_cpi_inflation
    section: prices_costs
    label_en: Food & Non-Alcoholic Beverages CPI YoY
    label_zh: 食品与非酒精饮料CPI同比
    unit: "% y/y"
    fetcher: imf_sdmx
    dataflow: CPI
    series: TUR.CPI.CP01.YOY_PCH_PA_PT.M
    source_name: IMF SDMX / TurkStat
    source_url: https://api.imf.org/external/sdmx/2.1/data/CPI/TUR.CPI.CP01.YOY_PCH_PA_PT.M
    frequency: monthly
    start_date: 2005-01-01
    caveat_en: COICOP 01 Food and non-alcoholic beverages CPI annual rate of change.
    caveat_zh: COICOP 01食品及非酒精饮料CPI同比变动率。

  - id: core_hicp_inflation
    section: prices_costs
    label_en: Core HICP Inflation (ex-Energy & Food) YoY
    label_zh: 核心HICP通胀率 (剔除能源与食品)
    unit: "% y/y"
    fetcher: eurostat
    dataset: prc_hicp_manr
    filters:
      geo: TR
      coicop: TOT_X_NRG_FOOD
    source_name: Eurostat / TurkStat
    source_url: https://ec.europa.eu/eurostat/databrowser/view/prc_hicp_manr/default/table?lang=en
    frequency: monthly
    start_date: 2005-01-01
    caveat_en: HICP excluding energy, food, alcohol and tobacco.
    caveat_zh: 剔除能源、食品、烟酒的核心HICP同比变动率。

  - id: services_hicp_inflation
    section: prices_costs
    label_en: Services HICP Inflation YoY
    label_zh: 服务业HICP通胀率同比
    unit: "% y/y"
    fetcher: eurostat
    dataset: prc_hicp_manr
    filters:
      geo: TR
      coicop: SERV
    source_name: Eurostat / TurkStat
    source_url: https://ec.europa.eu/eurostat/databrowser/view/prc_hicp_manr/default/table?lang=en
    frequency: monthly
    start_date: 2005-01-01
    caveat_en: Services component of the Harmonised Index of Consumer Prices.
    caveat_zh: 调和消费者价格指数中的服务业分项同比变动率。

  - id: food_hicp_inflation
    section: prices_costs
    label_en: Food HICP Inflation YoY
    label_zh: 食品HICP通胀率同比
    unit: "% y/y"
    fetcher: eurostat
    dataset: prc_hicp_manr
    filters:
      geo: TR
      coicop: FOOD
    source_name: Eurostat / TurkStat
    source_url: https://ec.europa.eu/eurostat/databrowser/view/prc_hicp_manr/default/table?lang=en
    frequency: monthly
    start_date: 2005-01-01
    caveat_en: Food component of the Harmonised Index of Consumer Prices.
    caveat_zh: 调和消费者价格指数中的食品分项同比变动率。

  - id: energy_hicp_inflation
    section: prices_costs
    label_en: Energy HICP Inflation YoY
    label_zh: 能源HICP通胀率同比
    unit: "% y/y"
    fetcher: eurostat
    dataset: prc_hicp_manr
    filters:
      geo: TR
      coicop: NRG
    source_name: Eurostat / TurkStat
    source_url: https://ec.europa.eu/eurostat/databrowser/view/prc_hicp_manr/default/table?lang=en
    frequency: monthly
    start_date: 2005-01-01
    caveat_en: Energy component of the Harmonised Index of Consumer Prices.
    caveat_zh: 调和消费者价格指数中的能源分项同比变动率。

  - id: ppi_inflation
    section: prices_costs
    label_en: Domestic Producer Price Index (PPI) YoY
    label_zh: 工业生产者出厂价格 (PPI) 同比
    unit: "% y/y"
    fetcher: eurostat
    dataset: sts_inppd_m
    filters:
      geo: TR
      nace_r2: B-E36
      unit: PCH_SM
    source_name: Eurostat / TurkStat
    source_url: https://ec.europa.eu/eurostat/databrowser/view/sts_inppd_m/default/table?lang=en
    frequency: monthly
    start_date: 2005-01-01
    caveat_en: Domestic industrial producer price index annual rate of change.
    caveat_zh: 工业生产者出厂价格指数同比变动率。

