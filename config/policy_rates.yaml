    series_id: NBP:REFERENCE_RATE
    source_url: https://nbp.pl/en/monetary-policy/mpc-decisions/
    quality_status: verified
    quality_note: Official NBP policy-rate definition is the reference rate. NBP's public page blocks automated access in this environment, so latest level is cross-checked against public reporting of the 5-6 May 2026 MPC decision and should be rechecked manually after each MPC meeting.
    observations:
      - {date: '2023-10-05', value: 5.75}
      - {date: '2025-05-08', value: 5.25}
      - {date: '2025-07-03', value: 5.00}
