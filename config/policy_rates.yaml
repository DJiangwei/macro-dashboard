policy_rates:
  HU:
    rate_name: MNB central bank base rate
    source: Magyar Nemzeti Bank
    series_id: MNB:BASE_RATE
    source_url: https://www.mnb.hu/en/monetary-policy/the-monetary-council/press-releases/2026/press-release-on-the-monetary-council-meeting-of-28-april-2026
    quality_status: verified
    quality_note: Official MNB policy-rate definition. The base rate was cut to 6.25% effective 25 February 2026 and kept unchanged in the 24 March and 28 April 2026 Monetary Council releases.
