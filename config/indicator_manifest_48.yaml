  unit: EUR/month
  source: Eurostat
  frequency: annual
  chart: line
  peers: false
  quality_status: watch
  quality_note: Minimum wage is statutory and may have multiple intra-year changes; annual chart is a simplified policy marker.
- section_id: prices_wages
  indicator_id: inflation_expectations
  label: Consumer Inflation Expectations
  unit: Balance / %
  source: ECB consumer survey / proxy pending
  frequency: monthly
  chart: line
  peers: false
  quality_status: low_confidence
  quality_note: Consumer inflation expectations require a stable survey feed; proxy fill is used until ECB/national survey adapters are wired.
- section_id: prices_wages
  indicator_id: breakeven_5y5y
  label: 5y5y Inflation Swap Rate
  unit: '%'
  source: Bloomberg/Refinitiv required
  frequency: daily
  chart: line
  peers: false
  quality_status: low_confidence
  quality_note: 5y5y inflation swaps are vendor market data; proxy fill is only a framework placeholder.
- section_id: external
  indicator_id: current_account_pct_gdp
