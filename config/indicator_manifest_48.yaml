version: 1
expected_count: 114
indicators:
- section_id: real_activity
  indicator_id: real_gdp_yoy
  label: Real GDP Growth, YoY
  unit: '% YoY'
  source: Eurostat / national accounts
  frequency: quarterly
  chart: peer_overlay
  peers: true
  quality_status: verified
  quality_note: Primary national accounts where available; revisions are common.
- section_id: real_activity
  indicator_id: real_gdp_qoq
  label: Real GDP Growth, QoQ SA
  unit: '% QoQ'
  source: Eurostat / national accounts
  frequency: monthly
  chart: line
  peers: false
  quality_status: watch
  quality_note: Seasonal adjustment differs by source.
- section_id: real_activity
  indicator_id: gdp_components
  label: GDP Demand Composite
  unit: '% YoY'
  source: Derived from Eurostat national accounts
  frequency: quarterly
  chart: line
  peers: false
  quality_status: watch
  quality_note: Unweighted average of final consumption and gross fixed capital formation volume growth; compact domestic-demand proxy until full contribution charts are wired.
- section_id: real_activity
  indicator_id: gdp_per_capita
  label: GDP per Capita
  unit: EUR per head
  source: Eurostat / World Bank
  frequency: annual
  chart: line
  peers: false
  quality_status: watch
  quality_note: PPS/EUR definitions vary by source; read as structural income-level context rather than a cyclical signal.
- section_id: real_activity
  indicator_id: industrial_production_yoy
  label: Industrial Production, YoY
  unit: '% YoY'
  source: Eurostat STS
  frequency: monthly
  chart: line
  peers: false
  quality_status: verified
  quality_note: Industrial-production series may be rebased.
- section_id: real_activity
  indicator_id: retail_sales_yoy
  label: Retail Sales Volume, YoY
  unit: '% YoY'
  source: Eurostat STS
  frequency: monthly
  chart: line
  peers: false
  quality_status: watch
  quality_note: Retail volume excludes some services consumption.
- section_id: real_activity
  indicator_id: unemployment_rate
  label: Unemployment Rate
  unit: '%'
  source: Eurostat LFS / IMF WEO
  frequency: annual
  chart: peer_overlay
  peers: true
  quality_status: verified
  quality_note: IMF WEO annual unemployment is used in the canonical frame; Eurostat remains preferred for higher-frequency timing.
- section_id: real_activity
  indicator_id: economic_sentiment
  label: Economic Sentiment Indicator
  unit: Index
  source: Eurostat / European Commission ESI
  frequency: monthly
  chart: peer_overlay
  peers: true
  quality_status: verified
  quality_note: Eurostat European Commission ESI, seasonally adjusted; survey data is best used as a turning-point signal.
- section_id: real_activity
  indicator_id: manufacturing_pmi
  label: Industry Confidence Indicator
  unit: Balance
  source: Eurostat / European Commission BCS
  frequency: monthly
  chart: line
  peers: false
  quality_status: watch
  quality_note: European Commission industry confidence indicator from harmonised business surveys replaces the vendor PMI placeholder with a public domestic industrial survey signal; it is not an S&P Global PMI diffusion index.
- section_id: real_activity
  indicator_id: capacity_utilization
  label: Manufacturing Capacity Utilization
  unit: '%'
  source: Eurostat business survey
  frequency: quarterly
  chart: line
  peers: false
  quality_status: watch
  quality_note: Survey-based capacity-utilisation measure; definitions and seasonal adjustment should be checked by country.
- section_id: real_activity
  indicator_id: consumer_confidence
  label: Consumer Confidence Indicator
  unit: Balance
  source: Eurostat / European Commission survey
  frequency: monthly
  chart: line
  peers: false
  quality_status: watch
  quality_note: Survey balance; best used for direction and turning points, not precise level comparisons.
- section_id: real_activity
  indicator_id: employment_growth
  label: Employment Growth, YoY
  unit: '% YoY'
  source: Eurostat national accounts / World Bank fallback
  frequency: quarterly
  chart: line
  peers: false
  quality_status: watch
  quality_note: Employment-growth series may fall back to lower-frequency labour-market proxies where quarterly national accounts are unavailable.
- section_id: real_activity
  indicator_id: participation_rate
  label: Labour Force Participation Rate
  unit: '%'
  source: Eurostat LFS / World Bank fallback
  frequency: quarterly
  chart: line
  peers: false
  quality_status: watch
  quality_note: Participation definitions differ across Eurostat LFS and World Bank annual series; compare levels cautiously.
- section_id: real_activity
  indicator_id: vacancy_rate
  label: Job Vacancy Rate
  unit: '%'
  source: Eurostat job vacancy statistics
  frequency: quarterly
  chart: line
  peers: false
  quality_status: watch
  quality_note: Job vacancy coverage varies by firm size and sector; read as a labour-market tightness proxy.
- section_id: real_activity
  indicator_id: gross_fixed_capital
  label: Gross Fixed Capital Formation
  unit: '% GDP'
  source: World Bank WDI / Eurostat
  frequency: annual
  chart: line
  peers: false
  quality_status: watch
  quality_note: Investment share of GDP is annual in the current public adapter; pair with quarterly GFCF growth when timing matters.
- section_id: real_activity
  indicator_id: construction_production
  label: Construction Production, YoY
  unit: '% YoY'
  source: Eurostat STS
  frequency: monthly
  chart: line
  peers: false
  quality_status: watch
  quality_note: Eurostat construction production, calendar and seasonally adjusted; country coverage and rebasing should be checked.
- section_id: real_activity
  indicator_id: fdi_inflows
  label: FDI Inflows, % GDP
  unit: '% GDP'
  source: World Bank WDI / ECB BoP
  frequency: annual
  chart: line
  peers: false
  quality_status: watch
  quality_note: Annual FDI inflows can be volatile and revised; use as structural financing context rather than high-frequency flow timing.
- section_id: real_activity
  indicator_id: oecd_cli
  label: Employment Expectations Indicator
  unit: Index
  source: Eurostat / European Commission BCS
  frequency: monthly
  chart: line
  peers: false
  quality_status: watch
  quality_note: European Commission Employment Expectations Indicator from harmonised business surveys is used as a transparent domestic leading-labour-demand survey signal; it replaces the unavailable OECD CLI slot and is not an OECD composite leading indicator.
- section_id: real_activity
  indicator_id: ifo_expectations
  label: German Industry Confidence Spillover
  unit: Balance
  source: Eurostat Germany industry confidence
  frequency: monthly
  chart: line
  peers: false
  quality_status: watch
  quality_note: Germany industrial confidence from the harmonised European Commission business survey is used as an external-demand spillover signal for CEE exporters; it is not a domestic country survey and should be read alongside each country's own ESI.
- section_id: real_activity
  indicator_id: truck_km_index
  label: Road Freight Activity
  unit: million tonne-km
  source: Eurostat road freight transport
  frequency: quarterly
  chart: line
  peers: false
  quality_status: watch
  quality_note: Eurostat quarterly road freight transport performance by reporting country, total transport and operation, measured in million tonne-kilometres. This replaces the toll-road truck-km alternative-data placeholder and is not a high-frequency traffic-count series.
- section_id: prices_wages
  indicator_id: cpi_yoy
  label: Headline CPI/HICP, YoY
  unit: '% YoY'
  source: Eurostat HICP / national CPI
  frequency: monthly
  chart: peer_overlay
  peers: true
  quality_status: verified
  quality_note: Classification changes can affect component inflation.
- section_id: prices_wages
  indicator_id: core_cpi_yoy
  label: Core CPI, YoY
  unit: '% YoY'
  source: Eurostat / national CPI
  frequency: monthly
  chart: line
  peers: false
  quality_status: verified
  quality_note: Core definition should be checked against source metadata.
- section_id: prices_wages
  indicator_id: services_cpi_yoy
  label: Services CPI, YoY
  unit: '% YoY'
  source: Eurostat HICP
  frequency: monthly
  chart: line
  peers: false
  quality_status: watch
  quality_note: Services basket definitions vary across releases.
- section_id: prices_wages
  indicator_id: goods_cpi_yoy
  label: Goods HICP, YoY
  unit: '% YoY'
  source: Eurostat HICP
  frequency: monthly
  chart: line
  peers: false
  quality_status: watch
  quality_note: Non-energy industrial goods aggregate; Eurostat COICOP mapping should be checked before precise attribution.
- section_id: prices_wages
  indicator_id: energy_cpi_yoy
  label: Energy HICP, YoY
  unit: '% YoY'
  source: Eurostat HICP
  frequency: monthly
  chart: line
  peers: false
  quality_status: watch
  quality_note: Energy HICP is volatile and policy-sensitive; base effects can dominate near-term moves.
- section_id: prices_wages
  indicator_id: food_cpi_yoy
  label: Food HICP, YoY
  unit: '% YoY'
  source: Eurostat HICP
  frequency: monthly
  chart: line
  peers: false
  quality_status: watch
  quality_note: Food aggregate can differ depending on processed/unprocessed classification; use as a broad food-price pressure gauge.
- section_id: prices_wages
  indicator_id: ppi_yoy
  label: Producer Prices, YoY
  unit: '% YoY'
  source: Eurostat STS
  frequency: monthly
  chart: line
  peers: false
  quality_status: verified
  quality_note: Energy weights can dominate PPI prints.
- section_id: prices_wages
  indicator_id: import_prices_yoy
  label: Import Price Index, YoY
  unit: '% YoY'
  source: Eurostat / CZSO / KSH / GUS DBW overrides
  frequency: monthly
  chart: line
  peers: false
  quality_status: watch
  quality_note: Import-price coverage is source-sensitive; Czechia, Hungary, and Poland use national-statistics import-price YoY series while remaining non-euro CEE gaps stay explicit until national sources are wired.
- section_id: prices_wages
  indicator_id: avg_wage_yoy
  label: Average Gross Wage, YoY
  unit: '% YoY'
  source: Eurostat / national labour data
  frequency: quarterly
  chart: line
  peers: false
  quality_status: watch
  quality_note: Enterprise-survey coverage differs across countries.
- section_id: prices_wages
  indicator_id: real_wage_yoy
  label: Real Wage, YoY
  unit: '% YoY'
  source: Derived from Eurostat wages and HICP
  frequency: quarterly
  chart: line
  peers: false
  quality_status: watch
  quality_note: Ex-post derived indicator; nominal wage/labour-cost growth minus headline HICP, so deflator choice matters.
- section_id: prices_wages
  indicator_id: unit_labour_cost
  label: Unit Labour Cost, YoY
  unit: '% YoY'
  source: Eurostat national accounts
  frequency: quarterly
  chart: line
  peers: false
  quality_status: watch
  quality_note: Eurostat nominal unit labour cost based on hours worked, unadjusted YoY; productivity and compensation revisions can alter history.
- section_id: prices_wages
  indicator_id: minimum_wage
  label: Statutory Minimum Wage
  unit: EUR/month
  source: Eurostat
  frequency: annual
  chart: line
  peers: false
  quality_status: watch
  quality_note: Minimum wage is statutory and may have multiple intra-year changes; annual chart is a simplified policy marker.
- section_id: prices_wages
  indicator_id: inflation_expectations
  label: Consumer Inflation Expectations
  unit: Balance
  source: Eurostat / European Commission consumer survey
  frequency: monthly
  chart: line
  peers: false
  quality_status: watch
  quality_note: Consumer price-trend expectations balance for the next 12 months; survey measure, not a market-implied inflation forecast.
- section_id: prices_wages
  indicator_id: breakeven_5y5y
  label: 5y5y Inflation Swap Rate
  unit: '%'
  source: Bloomberg/Refinitiv required
  frequency: daily
  chart: line
  peers: false
  quality_status: low_confidence
  quality_note: 5y5y inflation swaps are vendor market data; proxy fill is only a framework placeholder.
- section_id: prices_wages
  indicator_id: house_price_index
  label: House Price Index, YoY
  unit: '% YoY'
  source: Eurostat HPI
  frequency: quarterly
  chart: line
  peers: false
  quality_status: watch
  quality_note: Eurostat all-dwellings house-price index, annual rate of change; quarterly and revision-prone.
- section_id: prices_wages
  indicator_id: administered_prices
  label: Administered Prices Share
  unit: '% CPI basket'
  source: Eurostat HICP item weights
  frequency: annual
  chart: line
  peers: false
  quality_status: watch
  quality_note: Eurostat HICP item weight for the administered-prices aggregate, converted from per-mille HICP weight to share of the CPI basket; HICP-AP composition and weights can change annually.
- section_id: external
  indicator_id: current_account_pct_gdp
  label: Current Account, % GDP
  unit: '% GDP'
  source: IMF WEO / Eurostat BoP
  frequency: annual
  chart: peer_overlay
  peers: true
  quality_status: verified
  quality_note: BoP revisions are common.
- section_id: external
  indicator_id: trade_balance
  label: Trade Balance
  unit: USD bn
  source: World Bank WDI
  frequency: annual
  chart: bar
  peers: false
  quality_status: watch
  quality_note: Annual exports of goods and services minus imports of goods and services; use directionally versus monthly trade releases.
- section_id: external
  indicator_id: services_balance
  label: Services Balance
  unit: USD bn
  source: World Bank WDI
  frequency: annual
  chart: bar
  peers: false
  quality_status: watch
  quality_note: Annual services exports minus imports; use directionally until a quarterly BoP adapter is wired.
- section_id: external
  indicator_id: income_balance
  label: Primary Income Balance
  unit: USD bn
  source: World Bank WDI
  frequency: annual
  chart: bar
  peers: false
  quality_status: watch
  quality_note: World Bank net primary income is annual and lagged; proposal combines primary and secondary income, so use as a partial proxy.
- section_id: external
  indicator_id: fx_reserves
  label: FX Reserves
  unit: USD bn
  source: World Bank / central bank
  frequency: monthly
  chart: line
  peers: false
  quality_status: verified
  quality_note: USD valuation effects matter.
- section_id: external
  indicator_id: ara_metric
  label: IMF ARA Reserve Adequacy
  unit: '%'
  source: IMF Assessing Reserve Adequacy
  frequency: annual
  chart: line
  peers: false
  quality_status: watch
  quality_note: IMF reserves-to-ARA metric ratio, converted to percent; 100-150% is a common adequacy range but country judgment still matters.
- section_id: external
  indicator_id: reer
  label: Real Effective Exchange Rate
  unit: Index
  source: World Bank GEM
  frequency: annual
  chart: peer_overlay
  peers: true
  quality_status: verified
  quality_note: World Bank Global Economic Monitor REER index; normalize base years when comparing with BIS/ECB releases.
- section_id: external
  indicator_id: neer
  label: Nominal Effective Exchange Rate
  unit: Index
  source: World Bank GEM
  frequency: annual
  chart: line
  peers: false
  quality_status: watch
  quality_note: World Bank Global Economic Monitor NEER index; annual and not a high-frequency trading series.
- section_id: external
  indicator_id: short_term_ext_debt
  label: Short-Term External Debt / Reserves
  unit: '%'
  source: IMF ARA / CNB override
  frequency: annual
  chart: line
  peers: false
  quality_status: watch
  quality_note: Uses IMF ARA ratio where available; Czechia uses a quarterly CNB short-term external debt position over matched CNB quarter-end international reserves. Read as a structural external-liquidity gauge.
- section_id: external
  indicator_id: fx_implied_vol
  label: 30D Realised FX Volatility
  unit: '%'
  source: Derived from ECB FX reference rates
  frequency: daily
  chart: line
  peers: false
  quality_status: watch
  quality_note: Public realised-volatility substitute computed from ECB daily EUR/local-currency reference-rate returns; this is not an options-implied volatility quote and should not be read as 3M market-implied vol.
- section_id: external
  indicator_id: iip_position
  label: Net International Investment Position
  unit: '% GDP'
  source: Eurostat NIIP
  frequency: quarterly
  chart: line
  peers: false
  quality_status: watch
  quality_note: Eurostat quarterly net international investment position versus rest of world, expressed as % of GDP; BoP/IIP positions are revision-prone.
- section_id: external
  indicator_id: gross_ext_debt
  label: Gross External Debt
  unit: '% GDP'
  source: ECB BPS / Eurostat GDP
  frequency: quarterly
  chart: line
  peers: false
  quality_status: watch
  quality_note: Component-based external-debt liability estimate from ECB balance-of-payments positions, scaled by Eurostat rolling four-quarter nominal GDP; direct-investment intercompany debt may need national-release cross-checks.
- section_id: external
  indicator_id: bis_cross_border
  label: BIS Cross-Border Bank Claims
  unit: USD bn
  source: BIS locational banking statistics via DB.nomics
  frequency: quarterly
  chart: line
  peers: false
  quality_status: watch
  quality_note: BIS LBS cross-border total claims on residents, all currencies, all reporting countries and all sectors; DB.nomics mirror is used for narrow API access instead of the full BIS bulk file.
- section_id: external
  indicator_id: energy_import_dependency
  label: Energy Import Dependency
  unit: '%'
  source: Eurostat energy balances
  frequency: annual
  chart: line
  peers: false
  quality_status: watch
  quality_note: Eurostat total energy import dependency; annual and affected by stock changes, domestic production, and methodology revisions.
- section_id: external
  indicator_id: gas_storage_level
  label: Natural Gas Storage Fill Level
  unit: '%'
  source: GIE AGSI+ / credentialed adapter
  frequency: monthly
  chart: line
  peers: false
  quality_status: low_confidence
  quality_note: GIE AGSI+ country-level storage fill data is used when GIE_AGSI_API_KEY is configured; no-key builds retain a transparent proxy placeholder.
- section_id: fiscal_sovereign
  indicator_id: fiscal_balance_pct_gdp
  label: General Government Balance, % GDP
  unit: '% GDP'
  source: IMF Fiscal Monitor
  frequency: annual
  chart: peer_overlay
  peers: true
  quality_status: verified
  quality_note: IMF Fiscal Monitor net lending/borrowing; latest years may include IMF forecasts and EDP revisions can alter history.
- section_id: fiscal_sovereign
  indicator_id: structural_balance
  label: Structural Fiscal Balance
  unit: '% potential GDP'
  source: IMF Fiscal Monitor
  frequency: annual
  chart: line
  peers: false
  quality_status: watch
  quality_note: Uses IMF cyclically adjusted balance as a structural-balance estimate; output-gap assumptions matter.
- section_id: fiscal_sovereign
  indicator_id: primary_balance
  label: Primary Balance, % GDP
  unit: '% GDP'
  source: IMF Fiscal Monitor
  frequency: annual
  chart: line
  peers: false
  quality_status: watch
  quality_note: IMF primary net lending/borrowing; check interest-expenditure classification and forecast vintages.
- section_id: fiscal_sovereign
  indicator_id: gov_debt_pct_gdp
  label: General Government Debt, % GDP
  unit: '% GDP'
  source: IMF Fiscal Monitor
  frequency: annual
  chart: peer_overlay
  peers: true
  quality_status: verified
  quality_note: IMF gross debt position; nominal GDP revisions and forecast vintages affect the ratio.
- section_id: fiscal_sovereign
  indicator_id: gov_revenue_pct_gdp
  label: General Government Revenue, % GDP
  unit: '% GDP'
  source: World Bank / IMF fallback
  frequency: annual
  chart: line
  peers: false
  quality_status: watch
  quality_note: Revenue definitions can differ across IMF, Eurostat, and World Bank; use alongside expenditure and balance.
- section_id: fiscal_sovereign
  indicator_id: gov_expenditure_pct_gdp
  label: General Government Expenditure, % GDP
  unit: '% GDP'
  source: World Bank / IMF fallback
  frequency: annual
  chart: line
  peers: false
  quality_status: watch
  quality_note: Expenditure series can be revised with national accounts and fiscal notifications; compare with deficit path.
- section_id: fiscal_sovereign
  indicator_id: interest_bill_pct_gdp
  label: Interest Bill, % GDP
  unit: '% GDP'
  source: IMF Public Finances in Modern History
  frequency: annual
  chart: line
  peers: false
  quality_status: watch
  quality_note: Interest paid on public debt as a share of GDP; annual/lagged, so combine with current curve data.
- section_id: fiscal_sovereign
  indicator_id: debt_fx_share
  label: FX-Denominated Government Debt Share
  unit: '%'
  source: Eurostat government debt currency structure
  frequency: annual
  chart: line
  peers: false
  quality_status: watch
  quality_note: Derived as foreign-currency Maastricht debt divided by foreign- plus national-currency debt; compare with national debt-office publications before trading.
- section_id: fiscal_sovereign
  indicator_id: avg_debt_maturity
  label: Average Debt Maturity
  unit: years
  source: Eurostat government debt remaining maturity
  frequency: annual
  chart: line
  peers: false
  quality_status: watch
  quality_note: Eurostat remaining-maturity survey where available; Hungary uses manually maintained official AKK Average Time to Maturity snapshots where Eurostat coverage is missing.
- section_id: fiscal_sovereign
  indicator_id: sov_yield_10y
  label: 10Y Government Bond Yield
  unit: '%'
  source: Eurostat / market data
  frequency: monthly
  chart: peer_overlay
  peers: true
  quality_status: verified
  quality_note: Confirm market data against terminal for trading.
- section_id: fiscal_sovereign
  indicator_id: sov_yield_2y
  label: 2Y Government Bond Yield
  unit: '%'
  source: Eurostat short-rate proxy
  frequency: monthly
  chart: line
  peers: false
  quality_status: low_confidence
  quality_note: Public short-rate proxy is used until a true 2Y sovereign yield feed is wired; not suitable for precise curve trades.
- section_id: fiscal_sovereign
  indicator_id: cds_5y
  label: Sovereign Credit Spread Substitute
  unit: bp
  source: Derived from Eurostat sovereign yields
  frequency: monthly
  chart: line
  peers: false
  quality_status: watch
  quality_note: |
    Public substitute for vendor 5Y sovereign CDS: 10Y local government bond yield minus Germany 10Y Bund yield from Eurostat, in basis points. This is not a CDS quote and should not be used as executable credit protection pricing.
- section_id: fiscal_sovereign
  indicator_id: yield_curve_slope
  label: 10Y-2Y Yield Curve Slope
  unit: bp
  source: Derived from public rate proxies
  frequency: monthly
  chart: line
  peers: false
  quality_status: low_confidence
  quality_note: Current public implementation uses 10Y minus short-term rate until a true 2Y yield feed is wired.
- section_id: fiscal_sovereign
  indicator_id: sovereign_rating
  label: Sovereign Credit Rating
  unit: notch score
  source: Curated rating-agency tracker
  frequency: annual
  chart: line
  peers: false
  quality_status: watch
  quality_note: Manual average of major-agency long-term foreign-currency sovereign ratings on a 21-notch scale; update after rating actions.
- section_id: fiscal_sovereign
  indicator_id: eu_funds_absorption
  label: EU Funds Absorption Rate
  unit: '% allocation'
  source: European Commission Cohesion Open Data
  frequency: annual
  chart: line
  peers: false
  quality_status: watch
  quality_note: Cumulative 2021-2027 EU payments divided by latest adopted EU planned amount for selected shared-management funds; this payment ratio is narrower than contracting or claims-submission measures of absorption.
- section_id: fiscal_sovereign
  indicator_id: edp_status
  label: Excessive Deficit Procedure Status
  unit: policy-risk score
  source: European Commission / Council EDP tracker
  frequency: annual
  chart: line
  peers: false
  quality_status: watch
  quality_note: "Manual EDP status score: 0 no open EDP, 1 open EDP, 2 open EDP with non-effective-action or revised heightened-risk path."
- section_id: fiscal_sovereign
  indicator_id: contingent_liabilities
  label: Contingent Liabilities
  unit: '% GDP'
  source: Eurostat government guarantees
  frequency: annual
  chart: line
  peers: false
  quality_status: watch
  quality_note: Eurostat total stock of general-government guarantees as a share of GDP; narrower than a full public-sector contingent-liability inventory.
- section_id: monetary_financial
  indicator_id: policy_rate
  label: Central Bank Policy Rate
  unit: '%'
  source: Central bank policy-rate tracker
  frequency: event
  chart: peer_overlay
  peers: true
  quality_status: verified
  quality_note: Official central-bank policy-rate definition for each country; verify manually after policy meetings.
- section_id: monetary_financial
  indicator_id: real_policy_rate
  label: Real Policy-Stance Rate
  unit: '%'
  source: Derived from official policy rate and HICP
  frequency: event
  chart: line
  peers: false
  quality_status: watch
  quality_note: Ex-post official policy rate minus headline HICP; not an ex-ante real policy rate.
- section_id: monetary_financial
  indicator_id: m3_yoy
  label: Broad Money M3, YoY
  unit: '% YoY'
  source: World Bank WDI
  frequency: annual
  chart: line
  peers: false
  quality_status: watch
  quality_note: Uses World Bank broad money growth; annual and lagged versus local central-bank releases.
- section_id: monetary_financial
  indicator_id: private_credit_yoy
  label: Private Credit, YoY
  unit: '% YoY'
  source: World Bank WDI
  frequency: annual
  chart: line
  peers: false
  quality_status: watch
  quality_note: Uses claims on private sector growth as a broad private-credit proxy; sector perimeter differs by source.
- section_id: monetary_financial
  indicator_id: credit_to_gdp_gap
  label: Credit-to-GDP Gap
  unit: pp
  source: BIS / World Bank fallback
  frequency: quarterly
  chart: line
  peers: false
  quality_status: watch
  quality_note: BIS private non-financial credit gap preferred; World Bank annual credit/GDP trailing-trend fallback used only where BIS coverage is unavailable.
- section_id: monetary_financial
