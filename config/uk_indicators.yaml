    start_date: "1997-01-01"
    caveat_en: "LFS total actual weekly hours worked, seasonally adjusted; captures labour input beyond headcount."
    caveat_zh: "LFS实际总周工时，季调；可捕捉就业人数之外的劳动投入。"
  - id: awe_total_pay_growth
