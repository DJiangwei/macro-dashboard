sections:
  national_accounts:
    title_en: "National Accounts & GDP Tracking"
    title_zh: "国民账户与GDP跟踪"
    report_logic_en: "The GS UK guide stresses that early GDP releases are heavily revised. Use official GDP, demand components, and real-time trackers together rather than treating first GDP as the final word."
    report_logic_zh: "GS英国统计指南强调，早期GDP发布会经历较大修订。应把官方GDP、需求分项与实时跟踪指标结合使用，而不是把初值视为最终答案。"
  monthly_output:
    title_en: "Monthly Output & Survey-Like Signals"
    title_zh: "月度产出与类调查信号"
    report_logic_en: "Monthly production, retail activity, confidence, and leading indicators help bridge the gap before quarterly national accounts are revised and balanced."
    report_logic_zh: "月度生产、零售、信心与领先指标可在季度国民账户修订和平衡前提供更及时的活动线索。"
  housing_construction:
    title_en: "Housing & Construction"
    title_zh: "住房与建筑"
    report_logic_en: "The UK housing channel matters through construction activity, collateral values, household balance sheets, and mortgage-credit transmission."
    report_logic_zh: "英国住房渠道通过建筑活动、抵押品价值、居民资产负债表与按揭信贷传导影响宏观周期。"
  external:
    title_en: "Trade, Sterling & External Balance"
    title_zh: "贸易、英镑与外部平衡"
    report_logic_en: "Trade volumes and sterling's real exchange-rate impulse matter for GDP arithmetic, inflation pass-through, and the external funding narrative."
    report_logic_zh: "贸易量与英镑实际汇率脉冲会影响GDP核算、通胀传导与外部融资叙事。"
  labour_market:
    title_en: "Labour Market"
    title_zh: "劳动力市场"
    report_logic_en: "The labour-market release is central for UK rates because unemployment, employment, hours, vacancies, and wages shape domestic inflation pressure."
    report_logic_zh: "劳动力市场发布对英国利率非常关键，因为失业、就业、工时、职位空缺与工资共同塑造国内通胀压力。"
  prices:
    title_en: "Prices & Inflation"
    title_zh: "价格与通胀"
    report_logic_en: "CPI is the MPC target measure, while core CPI and producer-price pressure help separate energy/import effects from domestic persistence."
    report_logic_zh: "CPI是MPC目标指标；核心CPI与生产者价格压力有助于区分能源/进口冲击和国内通胀粘性。"
  monetary_financial:
    title_en: "Monetary & Financial Conditions"
    title_zh: "货币与金融条件"
    report_logic_en: "The GS FCI frame combines short rates, long rates, sterling, and equities; money, credit, and reserves add banking-system context."
    report_logic_zh: "GS FCI框架结合短端利率、长端利率、英镑与股票；货币、信贷与储备则补充银行体系背景。"
  fiscal_policy:
    title_en: "Fiscal Policy & Sovereign Balance Sheet"
    title_zh: "财政政策与主权资产负债表"
    report_logic_en: "The guide prioritises public-sector borrowing and debt measures, while warning that cash/accrual concepts, sector boundaries, and interventions can distort comparisons."
    report_logic_zh: "指南重视公共部门借款与债务指标，同时提醒现金制/权责发生制、部门边界和金融干预会影响比较。"

indicators:
  - id: real_gdp_qoq
    section: national_accounts
    label_en: "Real GDP Growth"
    label_zh: "实际GDP环比增速"
    unit: "%"
    fetcher: fred
    series: "NAEXKP01GBQ657S"
    source_name: "FRED / OECD"
    source_url: "https://fred.stlouisfed.org/series/NAEXKP01GBQ657S"
    frequency: "quarterly"
    start_date: "1997-01-01"
    caveat_en: "Quarter-on-quarter growth from OECD via FRED; early UK GDP is subject to material later revisions."
    caveat_zh: "OECD经FRED提供的实际GDP环比；英国GDP初值后续修订可能较大。"
  - id: nominal_gdp_gbp
    section: national_accounts
    label_en: "Nominal GDP"
    label_zh: "名义GDP"
    unit: "GBP mn"
    fetcher: fred
    series: "UKNGDP"
    source_name: "FRED / OECD"
    source_url: "https://fred.stlouisfed.org/series/UKNGDP"
    frequency: "quarterly"
    start_date: "1997-01-01"
    caveat_en: "Nominal level is useful for scale and debt ratios, but not for real activity momentum."
    caveat_zh: "名义水平适合观察规模和债务比率，但不适合直接判断实际活动动能。"
  - id: private_consumption_qoq
    section: national_accounts
    label_en: "Real Private Consumption"
    label_zh: "实际私人消费环比"
    unit: "%"
    fetcher: fred
    series: "NAEXKP02GBQ657S"
    source_name: "FRED / OECD"
    source_url: "https://fred.stlouisfed.org/series/NAEXKP02GBQ657S"
    frequency: "quarterly"
    start_date: "1997-01-01"
    caveat_en: "Demand-side national-accounts component; revised alongside GDP balancing."
    caveat_zh: "需求端国民账户分项；会随GDP平衡过程修订。"
  - id: gfcf_qoq
    section: national_accounts
    label_en: "Real Gross Fixed Capital Formation"
    label_zh: "实际固定资本形成环比"
    unit: "%"
    fetcher: fred
    series: "NAEXKP04GBQ657S"
    source_name: "FRED / OECD"
    source_url: "https://fred.stlouisfed.org/series/NAEXKP04GBQ657S"
    frequency: "quarterly"
    start_date: "1997-01-01"
    caveat_en: "Investment is volatile and revision-prone; treat quarterly swings cautiously."
    caveat_zh: "投资波动较大且容易修订；季度波动需谨慎解读。"
  - id: monthly_gdp_index
    section: national_accounts
    label_en: "Monthly GDP Index"
    label_zh: "月度GDP指数"
    unit: "index"
    fetcher: ons_timeseries
    series: "YBEZ"
    dataset: "PN2"
    ons_path: "/economy/grossdomesticproductgdp/timeseries/ybez/pn2/data"
    source_name: "ONS"
    source_url: "https://www.ons.gov.uk/economy/grossdomesticproductgdp/timeseries/ybez/pn2"
    frequency: "monthly"
    start_date: "1997-01-01"
    caveat_en: "ONS monthly GDP index gives release-day activity tracking, but still feeds into later quarterly GDP revisions."
    caveat_zh: "ONS月度GDP指数更适合发布日跟踪活动，但仍会进入后续季度GDP修订。"
  - id: industrial_production
    section: monthly_output
    label_en: "Industrial Production"
    label_zh: "工业生产指数"
    unit: "index"
    fetcher: ons_timeseries
    series: "K222"
    dataset: "DIOP"
    ons_path: "/economy/economicoutputandproductivity/output/timeseries/k222/diop/data"
    source_name: "ONS"
    source_url: "https://www.ons.gov.uk/economy/economicoutputandproductivity/output/timeseries/k222/diop"
    frequency: "monthly"
    start_date: "1997-01-01"
    caveat_en: "ONS Index of Production, B-E production CVMSA; preferred over the lagged FRED/OECD mirror for UK release work."
    caveat_zh: "ONS生产指数B-E生产CVMSA；相较滞后的FRED/OECD镜像，更适合英国发布日研究。"
  - id: retail_sales_yoy
    section: monthly_output
    label_en: "Retail Sales Volume Index"
    label_zh: "零售销售量指数"
    unit: "index"
    fetcher: ons_timeseries
    series: "J5EK"
    dataset: "DRSI"
    ons_path: "/businessindustryandtrade/retailindustry/timeseries/j5ek/drsi/data"
    source_name: "ONS"
    source_url: "https://www.ons.gov.uk/businessindustryandtrade/retailindustry/timeseries/j5ek/drsi"
    frequency: "monthly"
    start_date: "1997-01-01"
    caveat_en: "ONS retail sales volume index, all retailers including fuel, seasonally adjusted; this replaces the slower quarterly OECD/FRED retail mirror."
    caveat_zh: "ONS零售销售量指数，含燃料、季调；替代较慢的OECD/FRED季度零售镜像。"
  - id: consumer_confidence
    section: monthly_output
    label_en: "Consumer Confidence"
    label_zh: "消费者信心"
    unit: "index"
    fetcher: fred
    series: "CSCICP02GBM460S"
    source_name: "FRED / OECD"
    source_url: "https://fred.stlouisfed.org/series/CSCICP02GBM460S"
    frequency: "monthly"
    start_date: "1997-01-01"
    caveat_en: "Survey-like signal; helpful because UK hard activity data can be revised substantially."
    caveat_zh: "类调查信号；由于英国硬数据修订较大，该指标对实时判断有帮助。"
  - id: composite_leading_indicator
    section: monthly_output
    label_en: "Composite Leading Indicator"
    label_zh: "综合领先指标"
    unit: "index"
    fetcher: fred
    series: "GBRLOLITOAASTSAM"
    source_name: "FRED / OECD"
    source_url: "https://fred.stlouisfed.org/series/GBRLOLITOAASTSAM"
    frequency: "monthly"
    start_date: "1997-01-01"
    caveat_en: "OECD CLI is not a GS CAI substitute, but it is a reproducible public leading-cycle proxy."
    caveat_zh: "OECD CLI不能替代GS CAI，但它是可复跑的公开领先周期指标。"
  - id: real_house_prices
    section: housing_construction
    label_en: "Real Residential Property Prices"
    label_zh: "实际住宅价格"
    unit: "index"
    fetcher: fred
    series: "QGBR628BIS"
    source_name: "FRED / BIS"
    source_url: "https://fred.stlouisfed.org/series/QGBR628BIS"
    frequency: "quarterly"
    start_date: "1997-01-01"
    caveat_en: "BIS real residential property price index; smoother and less release-sensitive than Nationwide/Halifax monthly indices."
    caveat_zh: "BIS实际住宅价格指数；比Nationwide/Halifax月度指数更平滑、发布敏感度更低。"
  - id: nominal_house_prices
    section: housing_construction
    label_en: "Nominal Residential Property Prices"
    label_zh: "名义住宅价格"
    unit: "index"
    fetcher: fred
    series: "QGBN628BIS"
    source_name: "FRED / BIS"
    source_url: "https://fred.stlouisfed.org/series/QGBN628BIS"
    frequency: "quarterly"
    start_date: "1997-01-01"
    caveat_en: "BIS nominal residential property price index; does not replicate the report's individual house-price vendor indices."
    caveat_zh: "BIS名义住宅价格指数；并不等同于报告中逐个房价供应商指数。"
  - id: exports_qoq
    section: external
    label_en: "Real Exports"
    label_zh: "实际出口环比"
    unit: "%"
    fetcher: fred
    series: "NAEXKP06GBQ657S"
    source_name: "FRED / OECD"
    source_url: "https://fred.stlouisfed.org/series/NAEXKP06GBQ657S"
    frequency: "quarterly"
    start_date: "1997-01-01"
    caveat_en: "National-accounts exports; monthly goods-trade detail is not yet wired."
    caveat_zh: "国民账户出口；尚未接入月度货物贸易明细。"
  - id: imports_qoq
    section: external
    label_en: "Real Imports"
    label_zh: "实际进口环比"
    unit: "%"
    fetcher: fred
    series: "NAEXKP07GBQ657S"
    source_name: "FRED / OECD"
    source_url: "https://fred.stlouisfed.org/series/NAEXKP07GBQ657S"
    frequency: "quarterly"
    start_date: "1997-01-01"
    caveat_en: "National-accounts imports; trade contribution can change after GDP revisions."
    caveat_zh: "国民账户进口；贸易对GDP的贡献可能随后续修订变化。"
  - id: gbp_reer
    section: external
    label_en: "Sterling Real Effective Exchange Rate"
    label_zh: "英镑实际有效汇率"
    unit: "index"
    fetcher: fred
    series: "RBGBBIS"
    source_name: "FRED / BIS"
    source_url: "https://fred.stlouisfed.org/series/RBGBBIS"
    frequency: "monthly"
    start_date: "1997-01-01"
    caveat_en: "BIS REER is the clean public sterling competitiveness measure used here for the FCI-style FX channel."
    caveat_zh: "BIS REER是这里用于FCI式汇率渠道的公开英镑竞争力指标。"
  - id: unemployment_rate
    section: labour_market
    label_en: "Unemployment Rate"
    label_zh: "失业率"
    unit: "%"
    fetcher: ons_timeseries
    series: "MGSX"
    dataset: "LMS"
    ons_path: "/employmentandlabourmarket/peoplenotinwork/unemployment/timeseries/mgsx/lms/data"
    source_name: "ONS"
    source_url: "https://www.ons.gov.uk/employmentandlabourmarket/peoplenotinwork/unemployment/timeseries/mgsx/lms"
    frequency: "monthly"
    start_date: "1997-01-01"
    caveat_en: "ONS unemployment rate, aged 16 and over, seasonally adjusted; ONS labels the latest point as a three-month average."
    caveat_zh: "ONS 16岁及以上季调失业率；ONS将最新点标注为三个月平均。"
  - id: employment_total
