data_gaps:
  - section: monthly_output
    item_en: "GS UK CAI, GS-MAP, GS Surprise Index, and official GS FCI"
    item_zh: "GS UK CAI、GS-MAP、GS Surprise Index与官方GS FCI"
    status_en: "Proprietary GS products. This page charts public components only."
    status_zh: "GS专有产品；本页只绘制公开可复跑组成项。"
  - section: monthly_output
    item_en: "Manufacturing, construction, services, and composite PMI"
    item_zh: "制造业、建筑业、服务业与综合PMI"
    status_en: "Important in the GS framework, but not yet wired because S&P Global PMI history is vendor-controlled."
    status_zh: "在GS框架中很重要，但S&P Global PMI历史数据受供应商控制，暂未接入。"
  - section: monthly_output
    item_en: "CBI Distributive Trades, CBI Industrial Trends, BCC QES, BRC/KPMG Retail Sales Monitor"
    item_zh: "CBI分销贸易、CBI工业趋势、BCC QES、BRC/KPMG零售销售监测"
    status_en: "Survey sources need separate adapters and licensing checks."
    status_zh: "调查源需要单独adapter并核验授权。"
  - section: housing_construction
    item_en: "Nationwide, Halifax, Rightmove, Hometrack, and RICS"
    item_zh: "Nationwide、Halifax、Rightmove、Hometrack与RICS"
    status_en: "ONS/HMLR UK HPI, MHCLG starts/completions, ONS construction output, and BoE mortgage approvals are now charted; vendor house-price and sentiment sources still need licensing/API validation."
    status_zh: "ONS/HMLR英国HPI、MHCLG开工/竣工、ONS建筑产出与BoE按揭批准已接入；供应商房价和情绪数据仍需授权/API验证。"
  - section: labour_market
    item_en: "Pay settlements"
    item_zh: "工资协议"
    status_en: "ONS redundancy level/rate are now charted; pay-settlement series still need stable release-table mappings or survey/licensing checks."
    status_zh: "ONS裁员人数/裁员率已接入；工资协议序列仍需稳定发布表映射或调查/授权核验。"
  - section: prices
    item_en: "Inflation expectations surveys and index-linked gilt breakevens"
    item_zh: "通胀预期调查与指数挂钩国债隐含通胀"
    status_en: "RPIX and DESNZ petrol/diesel pump prices are now charted; expectations and breakeven series still need stable license-safe mappings."
    status_zh: "RPIX与DESNZ汽油/柴油泵价已接入；通胀预期和盈亏平衡通胀仍需稳定且授权安全的映射。"
  - section: monetary_financial
    item_en: "Trends in Lending, Credit Conditions Survey, HEW, fuller quoted-rate matrix, and stale OECD 3M interbank mirror"
    item_zh: "Trends in Lending、信贷条件调查、住房权益提取、更完整报价利率矩阵，以及滞后的OECD 3M银行间利率镜像"
    status_en: "BoE IADB now covers Bank Rate, SONIA, sterling, 5Y/10Y nominal gilt par yields, M4, consumer credit, mortgage approvals, and one quoted-rate series. The lagged FRED/OECD 3M interbank mirror is intentionally not charted; use SONIA/Bank Rate for the short-rate channel until a validated BoE or market-data 3M term source is wired."
    status_zh: "BoE IADB已覆盖Bank Rate、SONIA、英镑、5年/10年名义国债平价收益率、M4、消费信贷、按揭批准和一条报价利率。滞后的FRED/OECD 3M银行间利率镜像不会作为图表展示；在接入经验证的BoE或市场数据3M期限利率前，短端利率渠道使用SONIA/Bank Rate。"
  - section: fiscal_policy
    item_en: "OBR forecast vintages and deeper debt instrument breakdowns"
    item_zh: "OBR预测版本与更深层债务工具细分"
    status_en: "Monthly PSNB, PSNCR, PSND, PSNFL, and PSND ex BoE are charted from ONS; core March 2026 OBR forecast rows for borrowing, PSND ex BoE, debt interest, and effective interest rates are now charted. Full vintage archive and instrument-level history still need deeper adapters."
    status_zh: "月度PSNB、PSNCR、PSND、PSNFL与不含BoE的PSND已接入ONS；March 2026 OBR核心预测行，包括借款、不含BoE净债务、债务利息和有效利率，已绘图。完整预测版本库和工具级历史仍需更深adapter。"
