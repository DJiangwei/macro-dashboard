data_gaps:
  - section: monthly_output
    item_en: "GS UK CAI, GS-MAP, GS Surprise Index, and official GS FCI"
    item_zh: "GS UK CAI、GS-MAP、GS Surprise Index与官方GS FCI"
    status_en: "Proprietary GS products. This page charts public components only."
    status_zh: "GS专有产品；本页只绘制公开可复跑组成项。"
  - section: monthly_output
    item_en: "Manufacturing, construction, services, and composite PMI"
    item_zh: "制造业、建筑业、服务业与综合PMI"
    status_en: "Important in the GS framework, but not yet wired because S&P Global PMI history is vendor-controlled."
    status_zh: "在GS框架中很重要，但S&P Global PMI历史数据受供应商控制，暂未接入。"
  - section: monthly_output
    item_en: "CBI Distributive Trades, CBI Industrial Trends, BCC QES, BRC/KPMG Retail Sales Monitor"
    item_zh: "CBI分销贸易、CBI工业趋势、BCC QES、BRC/KPMG零售销售监测"
    status_en: "Survey sources need separate adapters and licensing checks."
    status_zh: "调查源需要单独adapter并核验授权。"
  - section: housing_construction
    item_en: "Nationwide, Halifax, Rightmove, Hometrack, RICS, and DCLG starts/completions"
    item_zh: "Nationwide、Halifax、Rightmove、Hometrack、RICS与DCLG开工/竣工"
    status_en: "Mortgage approvals are now charted from BoE; house-price and construction vendor/official endpoints still need licensing and API validation."
    status_zh: "按揭批准已接入BoE；房价和建筑供应商/官方endpoint仍需授权与API验证。"
  - section: labour_market
    item_en: "Redundancies and pay settlements"
    item_zh: "裁员与工资协议"
    status_en: "Core ONS labour-market indicators are now charted; these remaining items need separate release tables or survey/licensing checks."
    status_zh: "核心ONS劳动力市场指标已接入；剩余项目需要单独发布表或调查/授权核验。"
  - section: prices
    item_en: "RPIX, petrol prices, inflation expectations surveys, and index-linked gilt breakevens"
    item_zh: "RPIX、汽油价格、通胀预期调查与指数挂钩国债隐含通胀"
    status_en: "Headline CPI, core CPI, RPI, and ONS PPI are now charted; remaining items need stable public series mapping."
    status_zh: "整体CPI、核心CPI、RPI与ONS PPI已接入；剩余项目仍需映射稳定公开序列。"
  - section: monetary_financial
    item_en: "Trends in Lending, Credit Conditions Survey, HEW, and fuller quoted-rate matrix"
    item_zh: "Trends in Lending、信贷条件调查、住房权益提取与更完整报价利率矩阵"
    status_en: "BoE IADB now covers Bank Rate, SONIA, sterling, M4, consumer credit, mortgage approvals, and one quoted-rate series; survey/PDF-style sources remain open."
    status_zh: "BoE IADB已覆盖Bank Rate、SONIA、英镑、M4、消费信贷、按揭批准和一条报价利率；调查/PDF类来源仍未接入。"
  - section: fiscal_policy
    item_en: "PSNCR, detailed debt breakdowns, and OBR analysis"
    item_zh: "PSNCR、债务细分与OBR分析"
    status_en: "Monthly PSNB and PSND are now charted from ONS; remaining fiscal detail needs additional ONS/OBR table adapters."
    status_zh: "月度PSNB与PSND已接入ONS；剩余财政细节需要额外ONS/OBR表格adapter。"
