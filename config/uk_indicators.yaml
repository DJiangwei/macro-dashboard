    caveat_en: "ONS PSND excluding public-sector banks and Bank of England as a share of GDP; useful for stripping out BoE balance-sheet distortions around APF and QE."
    caveat_zh: "ONS公共部门净债务占GDP比，不含公共部门银行和英格兰银行；有助于剔除APF/QE相关央行资产负债表扰动。"
