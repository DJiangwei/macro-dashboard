    ons_path: "/employmentandlabourmarket/peoplenotinwork/outofworkbenefits/timeseries/bcjd/unem/data"
    source_name: "ONS"
    source_url: "https://www.ons.gov.uk/employmentandlabourmarket/peoplenotinwork/outofworkbenefits/timeseries/bcjd/unem"
    frequency: "monthly"
    start_date: "1997-01-01"
    caveat_en: "ONS UK claimant count, people, seasonally adjusted; definition can be affected by benefit-system changes."
    caveat_zh: "ONS英国申领失业救济人数，人员、季调；口径会受福利制度变化影响。"
  - id: vacancies_total
