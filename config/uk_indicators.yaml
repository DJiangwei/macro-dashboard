    source_url: "https://fred.stlouisfed.org/series/LFEMTTTTGBQ647S"
    frequency: "quarterly"
    start_date: "1997-01-01"
    caveat_en: "Quarterly OECD employment total; not a substitute for the full ONS labour-market release."
    caveat_zh: "OECD季度总就业人数；不能替代完整ONS劳动力市场发布。"
  - id: employment_rate_15_64
