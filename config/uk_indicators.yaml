    fetcher: ons_timeseries
    series: "AP2Y"
    dataset: "UNEM"
    ons_path: "/employmentandlabourmarket/peopleinwork/employmentandemployeetypes/timeseries/ap2y/unem/data"
    source_name: "ONS"
    source_url: "https://www.ons.gov.uk/employmentandlabourmarket/peopleinwork/employmentandemployeetypes/timeseries/ap2y/unem"
    frequency: "monthly"
    start_date: "2001-01-01"
    caveat_en: "ONS UK vacancies, total, in thousands; useful as a labour-demand pressure gauge."
    caveat_zh: "ONS英国总职位空缺，千人；适合观察劳动力需求压力。"
  - id: hours_worked_total
