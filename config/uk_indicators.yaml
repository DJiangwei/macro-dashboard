sections:
  national_accounts:
    title_en: "National Accounts & GDP Tracking"
    title_zh: "国民账户与GDP跟踪"
    report_logic_en: "The GS UK guide stresses that early GDP releases are heavily revised. Use official GDP, demand components, and real-time trackers together rather than treating first GDP as the final word."
    report_logic_zh: "GS英国统计指南强调，早期GDP发布会经历较大修订。应把官方GDP、需求分项与实时跟踪指标结合使用，而不是把初值视为最终答案。"
  monthly_output:
    title_en: "Monthly Output & Survey-Like Signals"
    title_zh: "月度产出与类调查信号"
    report_logic_en: "Monthly production, retail activity, confidence, and leading indicators help bridge the gap before quarterly national accounts are revised and balanced."
    report_logic_zh: "月度生产、零售、信心与领先指标可在季度国民账户修订和平衡前提供更及时的活动线索。"
  housing_construction:
    title_en: "Housing & Construction"
    title_zh: "住房与建筑"
    report_logic_en: "The UK housing channel matters through construction activity, collateral values, household balance sheets, and mortgage-credit transmission."
    report_logic_zh: "英国住房渠道通过建筑活动、抵押品价值、居民资产负债表与按揭信贷传导影响宏观周期。"
  external:
    title_en: "Trade, Sterling & External Balance"
    title_zh: "贸易、英镑与外部平衡"
    report_logic_en: "Trade volumes and sterling's real exchange-rate impulse matter for GDP arithmetic, inflation pass-through, and the external funding narrative."
    report_logic_zh: "贸易量与英镑实际汇率脉冲会影响GDP核算、通胀传导与外部融资叙事。"
  labour_market:
    title_en: "Labour Market"
    title_zh: "劳动力市场"
    report_logic_en: "The labour-market release is central for UK rates because unemployment, employment, hours, vacancies, and wages shape domestic inflation pressure."
    report_logic_zh: "劳动力市场发布对英国利率非常关键，因为失业、就业、工时、职位空缺与工资共同塑造国内通胀压力。"
  prices:
    title_en: "Prices & Inflation"
    title_zh: "价格与通胀"
    report_logic_en: "CPI is the MPC target measure, while core CPI and producer-price pressure help separate energy/import effects from domestic persistence."
    report_logic_zh: "CPI是MPC目标指标；核心CPI与生产者价格压力有助于区分能源/进口冲击和国内通胀粘性。"
  monetary_financial:
    title_en: "Monetary & Financial Conditions"
    title_zh: "货币与金融条件"
    report_logic_en: "The GS FCI frame combines short rates, long rates, sterling, and equities; money, credit, and reserves add banking-system context."
    report_logic_zh: "GS FCI框架结合短端利率、长端利率、英镑与股票；货币、信贷与储备则补充银行体系背景。"
  fiscal_policy:
    title_en: "Fiscal Policy & Sovereign Balance Sheet"
    title_zh: "财政政策与主权资产负债表"
    report_logic_en: "The guide prioritises public-sector borrowing and debt measures, while warning that cash/accrual concepts, sector boundaries, and interventions can distort comparisons."
    report_logic_zh: "指南重视公共部门借款与债务指标，同时提醒现金制/权责发生制、部门边界和金融干预会影响比较。"

indicators:
  - id: real_gdp_qoq
    section: national_accounts
    label_en: "Real GDP Growth"
    label_zh: "实际GDP环比增速"
    unit: "%"
    fetcher: ons_timeseries
    series: "IHYQ"
    dataset: "PN2"
    ons_path: "/economy/grossdomesticproductgdp/timeseries/ihyq/pn2/data"
    source_name: "ONS"
    source_url: "https://www.ons.gov.uk/economy/grossdomesticproductgdp/timeseries/ihyq/pn2"
    frequency: "quarterly"
    start_date: "1997-01-01"
    max_age_days: 170
    caveat_en: "ONS quarter-on-quarter CVM GDP growth is preferred over the slower FRED/OECD mirror; early UK GDP is still subject to material revisions."
    caveat_zh: "优先使用ONS实际GDP环比增速，而非较滞后的FRED/OECD镜像；英国GDP初值后续仍可能较大修订。"
  - id: nominal_gdp_gbp
    section: national_accounts
    label_en: "Nominal GDP"
    label_zh: "名义GDP"
    unit: "GBP mn"
    fetcher: ons_timeseries
    series: "YBHA"
    dataset: "PN2"
    ons_path: "/economy/grossdomesticproductgdp/timeseries/ybha/pn2/data"
    source_name: "ONS"
    source_url: "https://www.ons.gov.uk/economy/grossdomesticproductgdp/timeseries/ybha/pn2"
    frequency: "quarterly"
    start_date: "1997-01-01"
    max_age_days: 170
    caveat_en: "Nominal level is useful for scale and debt ratios, but not for real activity momentum."
    caveat_zh: "名义水平适合观察规模和债务比率，但不适合直接判断实际活动动能。"
  - id: private_consumption_qoq
    section: national_accounts
    label_en: "Real Private Consumption"
    label_zh: "实际私人消费环比"
    unit: "%"
    fetcher: ons_timeseries
    series: "ABJR"
    dataset: "PN2"
    ons_path: "/economy/nationalaccounts/satelliteaccounts/timeseries/abjr/pn2/data"
    source_name: "ONS"
    source_url: "https://www.ons.gov.uk/economy/nationalaccounts/satelliteaccounts/timeseries/abjr/pn2"
    frequency: "quarterly"
    start_date: "1997-01-01"
    transform: "qoq_pct"
    max_age_days: 170
    caveat_en: "Quarter-on-quarter growth derived from ONS household final consumption expenditure, national concept CVM SA; revised alongside GDP balancing."
    caveat_zh: "由ONS居民最终消费支出national concept实际季调水平计算环比；会随GDP平衡过程修订。"
  - id: gfcf_qoq
    section: national_accounts
    label_en: "Real Gross Fixed Capital Formation"
    label_zh: "实际固定资本形成环比"
    unit: "%"
    fetcher: ons_timeseries
    series: "NPQT"
    dataset: "PN2"
    ons_path: "/economy/grossdomesticproductgdp/timeseries/npqt/pn2/data"
    source_name: "ONS"
    source_url: "https://www.ons.gov.uk/economy/grossdomesticproductgdp/timeseries/npqt/pn2"
    frequency: "quarterly"
    start_date: "1997-01-01"
    transform: "qoq_pct"
    max_age_days: 170
    caveat_en: "Quarter-on-quarter growth derived from the ONS CVM SA GFCF level; investment is volatile and revision-prone."
    caveat_zh: "由ONS实际固定资本形成季调水平计算环比；投资波动较大且容易修订。"
  - id: monthly_gdp_index
    section: national_accounts
    label_en: "Monthly GDP Index"
    label_zh: "月度GDP指数"
    unit: "index"
    fetcher: ons_timeseries
    series: "YBEZ"
    dataset: "PN2"
    ons_path: "/economy/grossdomesticproductgdp/timeseries/ybez/pn2/data"
    source_name: "ONS"
    source_url: "https://www.ons.gov.uk/economy/grossdomesticproductgdp/timeseries/ybez/pn2"
    frequency: "monthly"
    start_date: "1997-01-01"
    caveat_en: "ONS monthly GDP index gives release-day activity tracking, but still feeds into later quarterly GDP revisions."
    caveat_zh: "ONS月度GDP指数更适合发布日跟踪活动，但仍会进入后续季度GDP修订。"
  - id: industrial_production
    section: monthly_output
    label_en: "Industrial Production"
    label_zh: "工业生产指数"
    unit: "index"
    fetcher: ons_timeseries
    series: "K222"
    dataset: "DIOP"
    ons_path: "/economy/economicoutputandproductivity/output/timeseries/k222/diop/data"
    source_name: "ONS"
    source_url: "https://www.ons.gov.uk/economy/economicoutputandproductivity/output/timeseries/k222/diop"
    frequency: "monthly"
    start_date: "1997-01-01"
    caveat_en: "ONS Index of Production, B-E production CVMSA; preferred over the lagged FRED/OECD mirror for UK release work."
    caveat_zh: "ONS生产指数B-E生产CVMSA；相较滞后的FRED/OECD镜像，更适合英国发布日研究。"
  - id: services_output_index
    section: monthly_output
    label_en: "Index of Services"
    label_zh: "服务业产出指数"
    unit: "index"
    fetcher: ons_timeseries
    series: "S2KU"
    dataset: "IOS1"
    ons_path: "/economy/economicoutputandproductivity/output/timeseries/s2ku/ios1/data"
    source_name: "ONS"
    source_url: "https://www.ons.gov.uk/economy/economicoutputandproductivity/output/timeseries/s2ku/ios1"
    frequency: "monthly"
    start_date: "1997-01-01"
    caveat_en: "ONS Index of Services, monthly seasonally adjusted output index; it covers the largest GDP(O) sector but remains revision-prone around Blue Book and monthly GDP balancing."
    caveat_zh: "ONS服务业产出月度季调指数；覆盖GDP(O)最大部门，但在Blue Book和月度GDP平衡时仍可能修订。"
  - id: retail_sales_yoy
    section: monthly_output
    label_en: "Retail Sales Volume Index"
    label_zh: "零售销售量指数"
    unit: "index"
    fetcher: ons_timeseries
    series: "J5EK"
    dataset: "DRSI"
    ons_path: "/businessindustryandtrade/retailindustry/timeseries/j5ek/drsi/data"
    source_name: "ONS"
    source_url: "https://www.ons.gov.uk/businessindustryandtrade/retailindustry/timeseries/j5ek/drsi"
    frequency: "monthly"
    start_date: "1997-01-01"
    caveat_en: "ONS retail sales volume index, all retailers including fuel, seasonally adjusted; this replaces the slower quarterly OECD/FRED retail mirror."
    caveat_zh: "ONS零售销售量指数，含燃料、季调；替代较慢的OECD/FRED季度零售镜像。"
  - id: consumer_confidence
    section: monthly_output
    label_en: "Consumer Confidence"
    label_zh: "消费者信心"
    unit: "index"
    fetcher: fred
    series: "CSCICP02GBM460S"
    source_name: "FRED / OECD"
    source_url: "https://fred.stlouisfed.org/series/CSCICP02GBM460S"
    frequency: "monthly"
    start_date: "1997-01-01"
    caveat_en: "Survey-like signal; helpful because UK hard activity data can be revised substantially."
    caveat_zh: "类调查信号；由于英国硬数据修订较大，该指标对实时判断有帮助。"
  - id: composite_leading_indicator
    section: monthly_output
    label_en: "Composite Leading Indicator"
    label_zh: "综合领先指标"
    unit: "index"
    fetcher: fred
    series: "GBRLOLITOAASTSAM"
    source_name: "FRED / OECD"
    source_url: "https://fred.stlouisfed.org/series/GBRLOLITOAASTSAM"
    frequency: "monthly"
    start_date: "1997-01-01"
    caveat_en: "OECD CLI is not a GS CAI substitute, but it is a reproducible public leading-cycle proxy."
    caveat_zh: "OECD CLI不能替代GS CAI，但它是可复跑的公开领先周期指标。"
  - id: real_house_prices
    section: housing_construction
    label_en: "Real Residential Property Prices"
    label_zh: "实际住宅价格"
    unit: "index"
    fetcher: fred
    series: "QGBR628BIS"
    source_name: "FRED / BIS"
    source_url: "https://fred.stlouisfed.org/series/QGBR628BIS"
    frequency: "quarterly"
    start_date: "1997-01-01"
    caveat_en: "BIS real residential property price index; smoother and less release-sensitive than Nationwide/Halifax monthly indices."
    caveat_zh: "BIS实际住宅价格指数；比Nationwide/Halifax月度指数更平滑、发布敏感度更低。"
  - id: nominal_house_prices
    section: housing_construction
    label_en: "Nominal Residential Property Prices"
    label_zh: "名义住宅价格"
    unit: "index"
    fetcher: fred
    series: "QGBN628BIS"
    source_name: "FRED / BIS"
    source_url: "https://fred.stlouisfed.org/series/QGBN628BIS"
    frequency: "quarterly"
    start_date: "1997-01-01"
    caveat_en: "BIS nominal residential property price index; does not replicate the report's individual house-price vendor indices."
    caveat_zh: "BIS名义住宅价格指数；并不等同于报告中逐个房价供应商指数。"
  - id: uk_hpi_average_price
    section: housing_construction
    label_en: "UK HPI Average Price"
    label_zh: "英国HPI平均房价"
    unit: "GBP"
    fetcher: ons_xlsx_table
    source_name: "ONS / HM Land Registry"
    source_url: "https://www.ons.gov.uk/economy/inflationandpriceindices/datasets/ukhousepriceindexmonthlypricestatistics"
    sheet_name: "2"
    date_column: "Time period"
    value_column: "United Kingdom"
    frequency: "monthly"
    start_date: "2011-01-01"
    caveat_en: "ONS UK HPI average price from the monthly price-statistics workbook; latest months are provisional and the workbook notes warn that revisions can be larger for newer observations."
    caveat_zh: "ONS英国HPI月度价格统计工作簿中的平均房价；最新月份为暂估，工作簿说明提示新近观测可能有较大修订。"
  - id: uk_hpi_annual_change
    section: housing_construction
    label_en: "UK HPI Annual Change"
    label_zh: "英国HPI年度涨幅"
    unit: "%"
    fetcher: ons_xlsx_table
    source_name: "ONS / HM Land Registry"
    source_url: "https://www.ons.gov.uk/economy/inflationandpriceindices/datasets/ukhousepriceindexmonthlypricestatistics"
    sheet_name: "3"
    date_column: "Time period"
    value_column: "United Kingdom"
    frequency: "monthly"
    start_date: "2011-01-01"
    caveat_en: "ONS UK HPI annual percentage change; provisional recent months should be cross-checked against the UK HPI release when trading housing-sensitive data."
    caveat_zh: "ONS英国HPI年度百分比变化；交易住房敏感数据时，应对最新暂估月份交叉核对UK HPI发布说明。"
  - id: housing_starts_england_sa
    section: housing_construction
    label_en: "Housing Starts, England SA"
    label_zh: "英格兰住房开工，季调"
    unit: "dwellings"
    fetcher: govuk_xlsx_table
    source_name: "MHCLG / GOV.UK"
    source_url: "https://www.gov.uk/government/statistical-data-sets/live-tables-on-house-building"
    distribution_name_contains: "Table 222"
    sheet_name: "LT_222a"
    date_column: "Period"
    value_column: "All Starts"
    frequency: "quarterly"
    start_date: "2000-01-01"
    caveat_en: "MHCLG Live Table 222, England quarterly seasonally adjusted building-control-reported new-build permanent dwellings; revisions and response-rate/imputation notes matter."
    caveat_zh: "MHCLG Live Table 222，英格兰季度季调建筑监管报告的新建永久住房；需关注修订、回收率和估算说明。"
  - id: housing_completions_england_sa
    section: housing_construction
    label_en: "Housing Completions, England SA"
    label_zh: "英格兰住房竣工，季调"
    unit: "dwellings"
    fetcher: govuk_xlsx_table
    source_name: "MHCLG / GOV.UK"
    source_url: "https://www.gov.uk/government/statistical-data-sets/live-tables-on-house-building"
    distribution_name_contains: "Table 222"
    sheet_name: "LT_222a"
    date_column: "Period"
    value_column: "All Completions"
    frequency: "quarterly"
    start_date: "2000-01-01"
    caveat_en: "MHCLG Live Table 222 all completions; quarterly building-control returns can be revised materially and are less comprehensive than annual net-additions statistics."
    caveat_zh: "MHCLG Live Table 222全部竣工；季度建筑监管回报可能明显修订，且不如年度住房净增加统计全面。"
  - id: construction_output_index
    section: housing_construction
    label_en: "Construction Output All Work"
    label_zh: "建筑业总产出指数"
    unit: "index"
    fetcher: ons_horizontal_csv_table
    source_name: "ONS"
    source_url: "https://www.ons.gov.uk/businessindustryandtrade/constructionindustry/datasets/outputintheconstructionindustryallworksummary"
    table_title_contains: "Table 10b: Chained volume measure, seasonally adjusted index number"
    date_column: "Time period"
    value_column: "All Work"
    frequency: "monthly"
    start_date: "1997-01-01"
    caveat_en: "ONS construction all-work chained-volume seasonally adjusted index from the all-work summary CSV; output is Great Britain rather than full UK and can revise with survey response updates."
    caveat_zh: "ONS建筑业总产出全工作链式量季调指数，来自all-work summary CSV；覆盖英国大不列颠而非完整UK，且会随调查回收更新而修订。"
  - id: exports_qoq
    section: external
    label_en: "Real Exports"
    label_zh: "实际出口环比"
    unit: "%"
    fetcher: ons_timeseries
    series: "IKBK"
    dataset: "PN2"
    ons_path: "/economy/grossdomesticproductgdp/timeseries/ikbk/pn2/data"
    source_name: "ONS"
    source_url: "https://www.ons.gov.uk/economy/grossdomesticproductgdp/timeseries/ikbk/pn2"
    frequency: "quarterly"
    start_date: "1997-01-01"
    transform: "qoq_pct"
    max_age_days: 170
    caveat_en: "Quarter-on-quarter growth derived from ONS total trade exports CVM SA; use monthly ONS goods balance for higher-frequency external-pressure timing."
    caveat_zh: "由ONS总贸易实际出口季调水平计算环比；月度外部压力时点可配合ONS货物贸易余额图。"
  - id: imports_qoq
    section: external
    label_en: "Real Imports"
    label_zh: "实际进口环比"
    unit: "%"
    fetcher: ons_timeseries
    series: "IKBL"
    dataset: "PN2"
    ons_path: "/economy/grossdomesticproductgdp/timeseries/ikbl/pn2/data"
    source_name: "ONS"
    source_url: "https://www.ons.gov.uk/economy/grossdomesticproductgdp/timeseries/ikbl/pn2"
    frequency: "quarterly"
    start_date: "1997-01-01"
    transform: "qoq_pct"
    max_age_days: 170
    caveat_en: "Quarter-on-quarter growth derived from ONS total trade imports CVM SA; trade contribution can change after GDP revisions."
    caveat_zh: "由ONS总贸易实际进口季调水平计算环比；贸易对GDP贡献会随后续GDP修订变化。"
  - id: goods_trade_balance
    section: external
    label_en: "Goods Trade Balance"
    label_zh: "货物贸易余额"
    unit: "GBP mn"
    fetcher: ons_timeseries
    series: "BOKI"
    dataset: "MRET"
    ons_path: "/economy/nationalaccounts/balanceofpayments/timeseries/boki/mret/data"
    source_name: "ONS"
    source_url: "https://www.ons.gov.uk/economy/nationalaccounts/balanceofpayments/timeseries/boki/mret"
    frequency: "monthly"
    start_date: "1997-01-01"
    caveat_en: "ONS seasonally adjusted goods-trade balance, balance-of-payments basis, current prices; volatile erratics and later trade revisions matter."
    caveat_zh: "ONS货物贸易余额，国际收支口径、现价、季调；需注意异常项目波动和后续贸易修订。"
  - id: total_trade_balance
    section: external
    label_en: "Total Trade Balance"
    label_zh: "总贸易余额"
    unit: "GBP mn"
    fetcher: ons_timeseries
    series: "KTMY"
    dataset: "UKEA"
    ons_path: "/economy/nationalaccounts/balanceofpayments/timeseries/ktmy/ukea/data"
    source_name: "ONS"
    source_url: "https://www.ons.gov.uk/economy/nationalaccounts/balanceofpayments/timeseries/ktmy/ukea"
    frequency: "quarterly"
    start_date: "1997-01-01"
    caveat_en: "ONS total goods-and-services trade balance from UK Economic Accounts; quarterly and non-seasonally adjusted, so use it for BoP-level context rather than monthly trading impulse."
    caveat_zh: "ONS英国经济账户中的货物与服务总贸易余额；季度、未季调，更适合作为国际收支层面的背景而非月度交易脉冲。"
  - id: gbp_reer
    section: external
    label_en: "Sterling Real Effective Exchange Rate"
    label_zh: "英镑实际有效汇率"
    unit: "index"
    fetcher: fred
    series: "RBGBBIS"
    source_name: "FRED / BIS"
    source_url: "https://fred.stlouisfed.org/series/RBGBBIS"
    frequency: "monthly"
    start_date: "1997-01-01"
    caveat_en: "BIS REER is the clean public sterling competitiveness measure used here for the FCI-style FX channel."
    caveat_zh: "BIS REER是这里用于FCI式汇率渠道的公开英镑竞争力指标。"
  - id: unemployment_rate
    section: labour_market
    label_en: "Unemployment Rate"
    label_zh: "失业率"
    unit: "%"
    fetcher: ons_timeseries
    series: "MGSX"
    dataset: "LMS"
    ons_path: "/employmentandlabourmarket/peoplenotinwork/unemployment/timeseries/mgsx/lms/data"
    source_name: "ONS"
    source_url: "https://www.ons.gov.uk/employmentandlabourmarket/peoplenotinwork/unemployment/timeseries/mgsx/lms"
    frequency: "monthly"
    start_date: "1997-01-01"
    caveat_en: "ONS unemployment rate, aged 16 and over, seasonally adjusted; ONS labels the latest point as a three-month average."
    caveat_zh: "ONS 16岁及以上季调失业率；ONS将最新点标注为三个月平均。"
  - id: employment_total
    section: labour_market
    label_en: "Employment Total"
    label_zh: "总就业人数"
    unit: "000s"
    fetcher: ons_timeseries
    series: "MGRZ"
    dataset: "LMS"
    ons_path: "/employmentandlabourmarket/peopleinwork/employmentandemployeetypes/timeseries/mgrz/lms/data"
    source_name: "ONS"
    source_url: "https://www.ons.gov.uk/employmentandlabourmarket/peopleinwork/employmentandemployeetypes/timeseries/mgrz/lms"
    frequency: "monthly"
    start_date: "1997-01-01"
    max_age_days: 150
