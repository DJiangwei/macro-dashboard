    caveat_en: "ONS public sector net financial liabilities excluding public-sector banks; broader balance-sheet measure than PSND and sensitive to liquid financial assets and valuation changes."
    caveat_zh: "ONS公共部门净金融负债，不含公共部门银行；比PSND更宽的资产负债表指标，受流动金融资产和估值变化影响。"
