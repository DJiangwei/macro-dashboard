    source_name: "ONS"
    source_url: "https://www.ons.gov.uk/employmentandlabourmarket/peopleinwork/employmentandemployeetypes/timeseries/lf24/lms"
    frequency: "monthly"
    start_date: "1997-01-01"
    caveat_en: "ONS employment rate, aged 16-64, seasonally adjusted; ONS labels the latest point as a three-month average."
    caveat_zh: "ONS 16-64岁季调就业率；ONS将最新点标注为三个月平均。"
  - id: claimant_count
