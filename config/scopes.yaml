# Scope registry: the single list of pages the dashboard builds.
#
# Every consumer (builders, navigation, archive, catalog, freshness audit,
# coverage matrix, workbench, Chart Studio, My Dashboard, Policy Tracker,
# validation and the scheduled refresh) reads this file. Adding a country is
# one entry here plus its indicator YAML.
#
# Fields
#   id            scope code used across outputs (ISO-like; UK and EA are kept)
#   kind          country | region | market
#   slug          output/<slug>.html, output/<slug>_canonical_frame.json,
#                 output/<slug>_dashboard_summary.json
#   pipeline      data_first (scripts/build_scope.py) | cee_v4 (build_v4.py, legacy)
#   indicators    indicator YAML for data_first scopes
#   headline      summary card: first charted id in `indicators`, rendered with
#                 `format` (Python str.format with value/date), stored under `key`
#   fetch_workers parallel fetches during a refresh (be gentle with keyless APIs)
#   quick_refresh refreshed on weekday quick runs (daily FX/rates/markets data)

scopes:
  - id: HU
    kind: country
    slug: hungary
    name: {en: Hungary, zh: 匈牙利}
    flag: "🇭🇺"
    nav_group: cee
    pipeline: cee_v4
    currency: HUF
    institution: MNB

