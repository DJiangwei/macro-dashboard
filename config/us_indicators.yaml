      - "TIPS"
      - "FRN"
    scale: 1000000000
    source_name: "Treasury FiscalData / US Treasury"
    source_url: "https://api.fiscaldata.treasury.gov/services/api/fiscal_service/v1/accounting/od/auctions_query"
    frequency: "monthly"
    start_date: "2018-01-01"
    caveat_en: "Coupon/TIPS/FRN auction supply is the cleaner duration-heavy issuance gauge; reopenings are included when Treasury reports completed auction results."
    caveat_zh: "附息债/TIPS/FRN拍卖供给更接近久期供给观察；财政部已完成拍卖结果中的续发也会包含在内。"
  - id: treasury_auction_bid_to_cover
    section: fiscal
    label_en: "Treasury Auction Bid-to-Cover"
    label_zh: "美国国债拍卖投标覆盖倍数"
    unit: "ratio"
    fetcher: treasury_auctions
    series: "auctions_query.total_tendered_to_total_accepted"
    metric: "bid_to_cover_ratio"
    aggregate: "monthly_weighted_bid_to_cover"
    source_name: "Treasury FiscalData / US Treasury"
    source_url: "https://api.fiscaldata.treasury.gov/services/api/fiscal_service/v1/accounting/od/auctions_query"
    frequency: "monthly"
    start_date: "2018-01-01"
    caveat_en: "Computed as monthly total tendered divided by total accepted across completed auctions, which is more stable than a simple average of individual auction ratios."
    caveat_zh: "按月度总投标额除以总获配额计算，比简单平均单场拍卖覆盖倍数更稳定。"
  - id: monthly_treasury_deficit
    section: fiscal
    label_en: "Monthly Treasury Deficit"
    label_zh: "月度财政赤字"
    unit: "USD mn"
    fetcher: fred
    series: "MTSDS133FMS"
    source_name: "FRED / US Treasury"
    source_url: "https://fred.stlouisfed.org/series/MTSDS133FMS"
    frequency: "monthly"
    start_date: "1990-01-01"
    caveat_en: "Monthly Treasury Statement deficit/surplus series; sign conventions should be checked before event work."
    caveat_zh: "月度财政部收支差额；做事件分析前需核对符号约定。"
  - id: federal_receipts_growth
    section: fiscal
    label_en: "Federal Receipts Growth"
    label_zh: "联邦财政收入同比"
    unit: "% y/y"
    transform: "yoy_pct"
    fetcher: fred
    series: "MTSR133FMS"
    source_name: "FRED / US Treasury"
    source_url: "https://fred.stlouisfed.org/series/MTSR133FMS"
    frequency: "monthly"
    start_date: "1990-01-01"
    caveat_en: "Monthly Treasury receipts are noisy around tax dates; use rolling context for event work."
    caveat_zh: "月度财政收入在纳税日期附近噪音较大；事件分析需使用滚动背景。"
  - id: federal_outlays_growth
    section: fiscal
    label_en: "Federal Outlays Growth"
    label_zh: "联邦财政支出同比"
    unit: "% y/y"
    transform: "yoy_pct"
    fetcher: fred
    series: "MTSO133FMS"
    source_name: "FRED / US Treasury"
    source_url: "https://fred.stlouisfed.org/series/MTSO133FMS"
    frequency: "monthly"
    start_date: "1990-01-01"
    caveat_en: "Monthly outlays are affected by calendar timing and benefit-payment schedules."
    caveat_zh: "月度支出受日历时点和福利支付安排影响。"
  - id: federal_interest_payments
    section: fiscal
    label_en: "Federal Interest Payments"
    label_zh: "联邦政府利息支出"
    unit: "USD bn"
    fetcher: fred
    series: "A091RC1Q027SBEA"
    source_name: "FRED / BEA"
    source_url: "https://fred.stlouisfed.org/series/A091RC1Q027SBEA"
    frequency: "quarterly"
    start_date: "1990-01-01"
    caveat_en: "Quarterly federal interest payments help track the fiscal-rate feedback loop."
    caveat_zh: "季度联邦利息支出用于观察财政和利率之间的反馈。"
  - id: federal_debt_growth
    section: fiscal
    label_en: "Federal Debt Growth"
    label_zh: "联邦债务同比"
    unit: "% y/y"
    transform: "yoy_pct"
    fetcher: fred
    series: "GFDEBTN"
    source_name: "FRED / US Treasury"
    source_url: "https://fred.stlouisfed.org/series/GFDEBTN"
    frequency: "quarterly"
    start_date: "1990-01-01"
    caveat_en: "Derived growth from federal debt held by the public and intragovernmental holdings."
    caveat_zh: "由联邦总债务水平派生的同比增速。"
  - id: federal_debt_gdp
    section: fiscal
    label_en: "Federal Debt to GDP"
    label_zh: "联邦债务/GDP"
    unit: "% of GDP"
    fetcher: fred
    series: "GFDEGDQ188S"
    source_name: "FRED / US Treasury"
    source_url: "https://fred.stlouisfed.org/series/GFDEGDQ188S"
    frequency: "quarterly"
    start_date: "1990-01-01"
    caveat_en: "Federal debt ratio for sovereign balance-sheet context."
    caveat_zh: "用于主权资产负债表背景的联邦债务率。"
  - id: public_debt_gdp
    section: fiscal
    label_en: "Federal Debt Held by Public to GDP"
    label_zh: "公众持有联邦债务/GDP"
    unit: "% of GDP"
    fetcher: fred
    series: "FYGFGDQ188S"
    source_name: "FRED / US Treasury"
    source_url: "https://fred.stlouisfed.org/series/FYGFGDQ188S"
    frequency: "quarterly"
    start_date: "1990-01-01"
    caveat_en: "Publicly held debt is the market-facing federal debt stock."
    caveat_zh: "公众持有债务是更面向市场的联邦债务存量。"
  - id: fiscal_year_deficit
    section: fiscal
    label_en: "Federal Fiscal-Year Deficit"
    label_zh: "联邦财年赤字"
    unit: "USD mn"
    fetcher: fred
    series: "FYFSD"
    source_name: "FRED / US Treasury"
    source_url: "https://fred.stlouisfed.org/series/FYFSD"
    frequency: "annual"
    start_date: "1990-09-30"
    caveat_en: "Annual fiscal-year deficit; monthly Treasury data are more tactical."
    caveat_zh: "年度财年赤字；月度财政部数据更适合战术观察。"
  - id: federal_interest_outlays_gdp
    section: fiscal
    label_en: "Federal Interest Outlays to GDP"
    label_zh: "联邦利息支出/GDP"
    unit: "% of GDP"
    fetcher: fred
    series: "FYOIGDA188S"
    source_name: "FRED / OMB"
    source_url: "https://fred.stlouisfed.org/series/FYOIGDA188S"
    frequency: "annual"
    start_date: "1990-01-01"
    caveat_en: "Annual federal interest burden; useful for fiscal sustainability narratives."
    caveat_zh: "年度联邦利息负担；用于财政可持续性叙事。"
  - id: federal_net_outlays_gdp
    section: fiscal
    label_en: "Federal Net Outlays to GDP"
    label_zh: "联邦净支出/GDP"
    unit: "% of GDP"
    fetcher: fred
    series: "FYONGDA188S"
    source_name: "FRED / OMB"
    source_url: "https://fred.stlouisfed.org/series/FYONGDA188S"
    frequency: "annual"
    start_date: "1990-01-01"
    caveat_en: "Annual federal net outlays ratio; budget definitions differ from NIPA fiscal flows."
    caveat_zh: "年度联邦净支出比率；预算口径不同于NIPA财政流量。"
  - id: federal_current_expenditures_growth
    section: fiscal
    label_en: "Federal Current Expenditures Growth"
    label_zh: "联邦经常支出同比"
    unit: "% y/y"
    transform: "yoy_pct"
    fetcher: fred
    series: "FGEXPND"
    source_name: "FRED / BEA"
    source_url: "https://fred.stlouisfed.org/series/FGEXPND"
    frequency: "quarterly"
    start_date: "1990-01-01"
    caveat_en: "NIPA federal current expenditures; complements Treasury cash-flow data."
    caveat_zh: "NIPA联邦经常支出；补充财政部现金流数据。"

data_gaps:
  - section: gs_market_indexes
    item_en: "GSFCI, GSAI, GSSI, GSRI"
    item_zh: "GSFCI、GSAI、GSSI、GSRI"
    status_en: "Proprietary Goldman Sachs indicators; chart public components only."
    status_zh: "GS专有指标；本页只绘制公开组成项。"
  - section: production_orders
    item_en: "ISM manufacturing/non-manufacturing, Chicago PMI, and Beige Book text"
    item_zh: "ISM制造业/非制造业、芝加哥PMI与褐皮书文本"
    status_en: "National ISM/PMI and Beige Book remain adapter gaps; public regional Fed survey gauges are charted separately."
    status_zh: "全国ISM/PMI与褐皮书仍是adapter缺口；公开地区联储调查已单独绘图。"
  - section: consumer
    item_en: "Conference Board confidence, Redbook, ICSC/UBS, ABC Consumer Comfort, stale OECD consumer-confidence mirror"
    item_zh: "Conference Board信心、Redbook、ICSC/UBS、ABC消费者舒适度、滞后的OECD消费者信心镜像"
    status_en: "Vendor-controlled, not yet mapped to a reproducible public endpoint, or stale in the public mirror. University of Michigan sentiment remains charted as the durable public confidence gauge; the Weekly Economic Index is charted as a high-frequency activity composite, not a substitute for these retail/confidence products."
    status_zh: "供应商控制、尚未映射到可复跑公开endpoint，或公开镜像已滞后。密歇根消费者信心继续作为稳定公开信心指标绘图；周度经济指数作为高频活动综合指标绘图，但不能替代这些零售/信心产品。"
  - section: housing
    item_en: "Pending Home Sales Index, NAHB Housing Market Index, mortgage applications"
    item_zh: "待完成房屋销售指数、NAHB住房市场指数、按揭申请"
    status_en: "Still not validated as license-safe public chart data; public supply, price, and stress gauges are charted."
    status_zh: "仍未验证为授权安全公开图表数据；公开库存、价格和压力指标已绘图。"
  - section: external
    item_en: "Detailed Treasury International Capital System flows"
    item_zh: "TIC详细资本流"
    status_en: "Core TIC Treasury transactions and holdings are now charted via FRED; deeper country/security tables still need a Treasury TIC adapter if required."
    status_zh: "核心TIC国债交易与持有量已通过FRED绘图；如需更深国家/证券表，仍需要财政部TIC adapter。"
  - section: employment
    item_en: "Manpower, Challenger layoffs, Monster/help-wanted indexes; BED API quota"
    item_zh: "Manpower、Challenger裁员、Monster/Help-wanted指数；BED API额度"
    status_en: "ADP private payrolls are charted from FRED and BLS BED gross job gains/losses are charted through the public BLS API with key-aware request windows. Manpower, Challenger, and proprietary help-wanted sources remain vendor/licensing gaps."
    status_zh: "ADP私营就业已通过FRED绘图，BLS BED总就业创造/损失已通过BLS公开API绘图，并按是否有API key调整请求窗口。Manpower、Challenger和专有Help-wanted来源仍属于供应商/授权缺口。"
  - section: fed_policy
    item_en: "FOMC statement language, minutes, transcripts, projections, and future Treasury auction calendar"
    item_zh: "FOMC声明措辞、纪要、会议记录、预测与未来国债拍卖日历"
    status_en: "Completed Treasury auction quantities and bid-to-cover are now charted from FiscalData; text and future-calendar sources require separate NLP/calendar adapters."
    status_zh: "已完成国债拍卖规模和覆盖倍数已从FiscalData绘图；文本和未来日历数据需要单独NLP/日历adapter。"
