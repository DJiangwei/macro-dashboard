sections:
  data_quirks:
    title_en: "Data Quirks & Release Discipline"
    title_zh: "数据特性与发布纪律"
    report_logic_en: "The GS guide opens with revisions, seasonal adjustment, and sequential-versus-year-over-year reporting. The dashboard keeps this as a standing caveat for all high-frequency US releases."
    report_logic_zh: "GS指南开篇强调修订、季调以及环比/同比口径差异。该页面把这些作为所有美国高频数据的基础提示。"
  gs_market_indexes:
    title_en: "Market Impact & GS Proprietary Indexes"
    title_zh: "市场影响与GS专有指数"
    report_logic_en: "The report highlights market-moving releases and GS proprietary gauges such as GSFCI, GSAI, and GSSI. Public component series are charted where possible; proprietary aggregates are tracked as gaps."
    report_logic_zh: "报告强调市场敏感数据以及GSFCI、GSAI、GSSI等GS专有指标。公开组成项尽量绘图；专有综合指标列入缺口。"
  nipa:
    title_en: "GDP, Income & NIPA"
    title_zh: "GDP、收入与NIPA"
    report_logic_en: "BEA national accounts anchor the macro story: real GDP, nominal GDP, personal income, disposable income, and corporate profits."
    report_logic_zh: "BEA国民账户构成宏观叙事基准：实际GDP、名义GDP、个人收入、可支配收入与企业利润。"
  production_orders:
    title_en: "Production, Orders & Inventories"
    title_zh: "生产、订单与库存"
    report_logic_en: "The GS report uses ISM, regional Fed surveys, durable goods, factory orders, industrial production, capacity utilization, and inventories to read cyclical momentum."
    report_logic_zh: "GS报告使用ISM、地区联储调查、耐用品、工厂订单、工业生产、产能利用率和库存来判断周期动能。"
  consumer:
    title_en: "Consumer Spending & Confidence"
    title_zh: "消费支出与信心"
    report_logic_en: "Retail sales, PCE, autos, and confidence surveys capture the US consumer, the largest demand component in GDP."
    report_logic_zh: "零售、PCE、汽车和信心调查刻画美国消费者，而消费是GDP中最大的需求分项。"
  housing:
    title_en: "Housing & Construction"
    title_zh: "住房与建筑"
    report_logic_en: "Housing starts, permits, home sales, construction spending, house prices, and mortgage stress define the housing transmission channel."
    report_logic_zh: "开工、许可、新房/成屋销售、建筑支出、房价与按揭压力共同定义住房传导渠道。"
  external:
    title_en: "Trade & International Capital Flows"
    title_zh: "贸易与国际资本流动"
    report_logic_en: "The report separates goods trade, current account, and TIC capital-flow data; this v1 charts the public external-balance skeleton."
    report_logic_zh: "报告区分货物贸易、经常账户和TIC资本流；v1先绘制公开可复跑的外部平衡骨架。"
  employment:
    title_en: "Employment"
    title_zh: "就业"
    report_logic_en: "Payrolls, unemployment, labor-force participation, hours, wages, claims, and JOLTS are core US market-moving labor indicators."
    report_logic_zh: "非农、失业率、劳动参与率、工时、工资、失业救济申请和JOLTS是美国最核心的市场敏感劳动力指标。"
  prices_wages:
    title_en: "Prices, Wages & Productivity"
    title_zh: "价格、工资与生产率"
    report_logic_en: "CPI, PCE inflation, GDP deflator, ECI, productivity, unit labor costs, PPI, and trade prices connect inflation to Fed reaction."
    report_logic_zh: "CPI、PCE通胀、GDP平减指数、ECI、生产率、单位劳动成本、PPI和进出口价格共同连接通胀与美联储反应。"
  monetary_financial:
    title_en: "Monetary & Financial Data"
    title_zh: "货币与金融数据"
    report_logic_en: "Money, credit, SLOOS, household debt service, and household net worth extend the report's financial-data section into a modern balance-sheet lens."
    report_logic_zh: "货币、信贷、SLOOS、居民债务负担和居民净资产把报告中的金融数据章节扩展为现代资产负债表视角。"
  fed_policy:
    title_en: "Federal Reserve Policy"
    title_zh: "美联储政策"
    report_logic_en: "Modern US policy plumbing now requires effective fed funds, target range, IORB, SOFR, and the Fed balance sheet, not only FOMC statements and discount tools."
    report_logic_zh: "现代美国政策框架需要观察有效联邦基金利率、目标区间、IORB、SOFR与美联储资产负债表，而不只是FOMC声明和贴现工具。"
  fiscal:
    title_en: "Federal Government Finances"
    title_zh: "联邦政府财政"
    report_logic_en: "Monthly Treasury Statement data, federal debt, debt/GDP, and fiscal-year deficits provide the public fiscal anchor."
    report_logic_zh: "月度财政部报表、联邦债务、债务/GDP和财年赤字提供公开财政锚。"

min_chart_count: 85

indicators:
  - id: real_gdp_growth
    section: nipa
    label_en: "Real GDP Growth"
    label_zh: "实际GDP增速"
    unit: "%"
    fetcher: fred
    series: "A191RL1Q225SBEA"
    source_name: "FRED / BEA"
    source_url: "https://fred.stlouisfed.org/series/A191RL1Q225SBEA"
    frequency: "quarterly"
    start_date: "1990-01-01"
    caveat_en: "BEA annualized quarter-on-quarter real GDP growth; advance estimates are revised."
    caveat_zh: "BEA实际GDP年化环比；初值后续会修订。"
  - id: real_gdp_level
    section: nipa
    label_en: "Real GDP Level"
    label_zh: "实际GDP水平"
    unit: "USD bn"
    fetcher: fred
    series: "GDPC1"
    source_name: "FRED / BEA"
    source_url: "https://fred.stlouisfed.org/series/GDPC1"
    frequency: "quarterly"
    start_date: "1990-01-01"
    caveat_en: "Chained-dollar real GDP level; useful for scale and cycle depth."
    caveat_zh: "链式美元实际GDP水平；适合观察规模与周期深度。"
  - id: nominal_gdp_growth
    section: nipa
    label_en: "Nominal GDP Growth"
    label_zh: "名义GDP同比"
    unit: "% y/y"
    transform: "yoy_pct"
    fetcher: fred
    series: "GDP"
    source_name: "FRED / BEA"
    source_url: "https://fred.stlouisfed.org/series/GDP"
    frequency: "quarterly"
    start_date: "1990-01-01"
    caveat_en: "Derived year-over-year growth from BEA nominal GDP level."
    caveat_zh: "由BEA名义GDP水平派生的同比增速。"
  - id: personal_income_growth
    section: nipa
    label_en: "Personal Income Growth"
    label_zh: "个人收入同比"
    unit: "% y/y"
    transform: "yoy_pct"
    fetcher: fred
    series: "PI"
    source_name: "FRED / BEA"
    source_url: "https://fred.stlouisfed.org/series/PI"
    frequency: "monthly"
    start_date: "1990-01-01"
    caveat_en: "Derived year-over-year growth from BEA personal income."
    caveat_zh: "由BEA个人收入水平派生的同比增速。"
  - id: real_disposable_income_growth
    section: nipa
    label_en: "Real Disposable Income Growth"
    label_zh: "实际可支配收入同比"
    unit: "% y/y"
    transform: "yoy_pct"
    fetcher: fred
    series: "DSPIC96"
    source_name: "FRED / BEA"
    source_url: "https://fred.stlouisfed.org/series/DSPIC96"
    frequency: "monthly"
    start_date: "1990-01-01"
    caveat_en: "Real disposable personal income is central to household spending capacity."
    caveat_zh: "实际可支配个人收入是居民消费能力的核心指标。"
  - id: corporate_profits_growth
    section: nipa
    label_en: "Corporate Profits Growth"
    label_zh: "企业利润同比"
    unit: "% y/y"
    transform: "yoy_pct"
    fetcher: fred
    series: "CP"
    source_name: "FRED / BEA"
    source_url: "https://fred.stlouisfed.org/series/CP"
    frequency: "quarterly"
    start_date: "1990-01-01"
    caveat_en: "NIPA corporate profits; not identical to S&P 500 earnings."
    caveat_zh: "NIPA企业利润；不同于标普500盈利。"
  - id: real_pce_component_growth
    section: nipa
    label_en: "Real PCE Component Growth"
    label_zh: "实际个人消费分项同比"
    unit: "% y/y"
    transform: "yoy_pct"
    fetcher: fred
    series: "PCECC96"
    source_name: "FRED / BEA"
    source_url: "https://fred.stlouisfed.org/series/PCECC96"
    frequency: "quarterly"
    start_date: "1990-01-01"
    caveat_en: "Quarterly real PCE from NIPA; useful for decomposing GDP-side demand."
    caveat_zh: "NIPA季度实际个人消费；用于拆分GDP需求侧。"
  - id: private_investment_growth
    section: nipa
    label_en: "Real Private Domestic Investment Growth"
    label_zh: "实际私人国内投资同比"
    unit: "% y/y"
    transform: "yoy_pct"
    fetcher: fred
    series: "GPDIC1"
    source_name: "FRED / BEA"
    source_url: "https://fred.stlouisfed.org/series/GPDIC1"
    frequency: "quarterly"
    start_date: "1990-01-01"
    caveat_en: "Investment is the cyclical high-beta component of real GDP."
    caveat_zh: "投资是实际GDP中周期弹性较高的分项。"
  - id: government_spending_growth
    section: nipa
    label_en: "Real Government Spending & Investment Growth"
    label_zh: "实际政府消费与投资同比"
    unit: "% y/y"
    transform: "yoy_pct"
    fetcher: fred
    series: "GCEC1"
    source_name: "FRED / BEA"
    source_url: "https://fred.stlouisfed.org/series/GCEC1"
    frequency: "quarterly"
    start_date: "1990-01-01"
    caveat_en: "Real government consumption and investment; separates fiscal demand from private demand."
    caveat_zh: "实际政府消费和投资；用于区分财政需求与私人需求。"
  - id: real_net_exports
    section: nipa
    label_en: "Real Net Exports"
    label_zh: "实际净出口"
    unit: "USD bn"
    fetcher: fred
    series: "NETEXC"
    source_name: "FRED / BEA"
    source_url: "https://fred.stlouisfed.org/series/NETEXC"
    frequency: "quarterly"
    start_date: "1990-01-01"
    caveat_en: "Real net exports level; negative values indicate an external demand drag."
    caveat_zh: "实际净出口水平；负值代表外需项拖累。"
  - id: inventory_share_gdp
    section: nipa
    label_en: "Private Inventory Change Share of GDP"
    label_zh: "私人库存变化占GDP比重"
    unit: "% of GDP"
    fetcher: fred
    series: "A014RE1Q156NBEA"
    source_name: "FRED / BEA"
    source_url: "https://fred.stlouisfed.org/series/A014RE1Q156NBEA"
    frequency: "quarterly"
    start_date: "1990-01-01"
    caveat_en: "Inventory swings can dominate quarterly GDP surprises."
    caveat_zh: "库存波动常常主导季度GDP意外。"
  - id: industrial_production_growth
    section: production_orders
    label_en: "Industrial Production Growth"
    label_zh: "工业生产同比"
    unit: "% y/y"
    transform: "yoy_pct"
    fetcher: fred
    series: "INDPRO"
    source_name: "FRED / Federal Reserve"
    source_url: "https://fred.stlouisfed.org/series/INDPRO"
    frequency: "monthly"
    start_date: "1990-01-01"
    caveat_en: "Derived year-over-year growth from Federal Reserve industrial production."
    caveat_zh: "由美联储工业生产指数派生的同比增速。"
  - id: capacity_utilization
    section: production_orders
    label_en: "Capacity Utilization"
    label_zh: "产能利用率"
    unit: "%"
    fetcher: fred
    series: "TCU"
    source_name: "FRED / Federal Reserve"
    source_url: "https://fred.stlouisfed.org/series/TCU"
    frequency: "monthly"
    start_date: "1990-01-01"
    caveat_en: "Federal Reserve total industry capacity utilization."
    caveat_zh: "美联储全部工业产能利用率。"
  - id: durable_goods_orders_growth
    section: production_orders
    label_en: "Durable Goods Orders Growth"
    label_zh: "耐用品订单同比"
    unit: "% y/y"
    transform: "yoy_pct"
    fetcher: fred
    series: "DGORDER"
    source_name: "FRED / Census"
    source_url: "https://fred.stlouisfed.org/series/DGORDER"
    frequency: "monthly"
    start_date: "1992-02-01"
    caveat_en: "Advance durable goods orders are volatile and revised."
    caveat_zh: "耐用品订单初值波动较大且会修订。"
  - id: factory_orders_growth
    section: production_orders
    label_en: "Manufacturers' New Orders Growth"
    label_zh: "制造商新订单同比"
    unit: "% y/y"
    transform: "yoy_pct"
    fetcher: fred
    series: "AMTMNO"
    source_name: "FRED / Census"
    source_url: "https://fred.stlouisfed.org/series/AMTMNO"
    frequency: "monthly"
    start_date: "1992-02-01"
    caveat_en: "Total manufacturing new orders; often interpreted alongside ISM."
    caveat_zh: "制造业总新订单；通常与ISM结合解读。"
  - id: business_inventories_growth
    section: production_orders
    label_en: "Business Inventories Growth"
    label_zh: "商业库存同比"
    unit: "% y/y"
    transform: "yoy_pct"
    fetcher: fred
    series: "BUSINV"
    source_name: "FRED / Census"
    source_url: "https://fred.stlouisfed.org/series/BUSINV"
    frequency: "monthly"
    start_date: "1992-01-01"
    caveat_en: "Inventories can amplify GDP swings through stockbuilding."
    caveat_zh: "库存变化会通过补库/去库放大GDP波动。"
  - id: inventory_sales_ratio
    section: production_orders
    label_en: "Inventory-to-Sales Ratio"
    label_zh: "库存销售比"
    unit: "ratio"
    fetcher: fred
    series: "ISRATIO"
    source_name: "FRED / Census"
    source_url: "https://fred.stlouisfed.org/series/ISRATIO"
    frequency: "monthly"
    start_date: "1992-01-01"
    caveat_en: "Inventory-sales balance helps judge whether production is running ahead of demand."
    caveat_zh: "库存销售平衡有助于判断生产是否跑在需求前面。"
  - id: philly_fed_outlook
    section: production_orders
    label_en: "Philadelphia Fed Manufacturing Outlook"
    label_zh: "费城联储制造业展望"
    unit: "diffusion"
    fetcher: fred
    series: "GACDFSA066MSFRBPHI"
    source_name: "FRED / Philadelphia Fed"
    source_url: "https://fred.stlouisfed.org/series/GACDFSA066MSFRBPHI"
    frequency: "monthly"
    start_date: "1990-01-01"
    caveat_en: "Regional Fed survey used as a public substitute for some survey momentum in the GS framework."
    caveat_zh: "地区联储调查可作为GS框架中部分调查动能的公开替代观察。"
  - id: retail_sales_growth
    section: consumer
    label_en: "Retail Sales Growth"
    label_zh: "零售销售同比"
    unit: "% y/y"
    transform: "yoy_pct"
    fetcher: fred
    series: "RSAFS"
    source_name: "FRED / Census"
    source_url: "https://fred.stlouisfed.org/series/RSAFS"
    frequency: "monthly"
    start_date: "1992-01-01"
    caveat_en: "Derived year-over-year growth from advance retail sales."
    caveat_zh: "由零售销售初值水平派生的同比增速。"
  - id: retail_ex_auto_growth
    section: consumer
    label_en: "Retail Sales ex Autos Growth"
    label_zh: "扣除汽车零售同比"
    unit: "% y/y"
    transform: "yoy_pct"
    fetcher: fred
    series: "RSXFS"
    source_name: "FRED / Census"
    source_url: "https://fred.stlouisfed.org/series/RSXFS"
    frequency: "monthly"
    start_date: "1992-01-01"
    caveat_en: "Ex-auto retail sales reduce vehicle-driven volatility."
    caveat_zh: "扣除汽车的零售销售可降低汽车项波动。"
  - id: nominal_pce_growth
    section: consumer
    label_en: "Nominal PCE Growth"
    label_zh: "名义PCE同比"
    unit: "% y/y"
    transform: "yoy_pct"
    fetcher: fred
    series: "PCE"
    source_name: "FRED / BEA"
    source_url: "https://fred.stlouisfed.org/series/PCE"
    frequency: "monthly"
    start_date: "1990-01-01"
    caveat_en: "PCE is broader than retail sales and covers services."
    caveat_zh: "PCE比零售销售更广，覆盖服务消费。"
  - id: real_pce_growth
    section: consumer
    label_en: "Real PCE Growth"
    label_zh: "实际PCE同比"
    unit: "% y/y"
    transform: "yoy_pct"
    fetcher: fred
    series: "PCEC96"
    source_name: "FRED / BEA"
    source_url: "https://fred.stlouisfed.org/series/PCEC96"
    frequency: "monthly"
    start_date: "2007-01-01"
    caveat_en: "Real PCE is the cleanest monthly read on consumption volume."
    caveat_zh: "实际PCE是观察月度消费量的最干净口径。"
  - id: vehicle_sales
    section: consumer
    label_en: "Light Vehicle Sales"
    label_zh: "轻型车销量"
    unit: "mn SAAR"
    fetcher: fred
    series: "TOTALSA"
    source_name: "FRED / BEA"
    source_url: "https://fred.stlouisfed.org/series/TOTALSA"
    frequency: "monthly"
    start_date: "1990-01-01"
    caveat_en: "Auto sales are an early read on durable-consumption momentum."
    caveat_zh: "汽车销量是耐用品消费动能的早期信号。"
  - id: consumer_confidence_oecd
    section: consumer
    label_en: "Consumer Confidence"
    label_zh: "消费者信心"
    unit: "index"
    fetcher: fred
    series: "CSCICP03USM665S"
    source_name: "FRED / OECD"
    source_url: "https://fred.stlouisfed.org/series/CSCICP03USM665S"
    frequency: "monthly"
    start_date: "1990-01-01"
    caveat_en: "OECD confidence measure; Conference Board history is not wired in v1."
    caveat_zh: "OECD信心指标；Conference Board历史序列v1暂未接入。"
  - id: michigan_sentiment
    section: consumer
    label_en: "University of Michigan Sentiment"
    label_zh: "密歇根消费者信心"
    unit: "index"
    fetcher: fred
    series: "UMCSENT"
    source_name: "FRED / University of Michigan"
    source_url: "https://fred.stlouisfed.org/series/UMCSENT"
    frequency: "monthly"
    start_date: "1990-01-01"
    caveat_en: "University of Michigan sentiment is one of the report's consumer-confidence gauges."
    caveat_zh: "密歇根消费者信心是报告中的消费者信心指标之一。"
  - id: housing_starts
    section: housing
    label_en: "Housing Starts"
    label_zh: "新屋开工"
    unit: "k SAAR"
    fetcher: fred
    series: "HOUST"
    source_name: "FRED / Census"
    source_url: "https://fred.stlouisfed.org/series/HOUST"
    frequency: "monthly"
    start_date: "1990-01-01"
    caveat_en: "Starts are volatile and weather-sensitive, as the GS report stresses."
    caveat_zh: "新屋开工波动大且受天气影响，GS报告对此特别强调。"
  - id: building_permits
    section: housing
    label_en: "Building Permits"
    label_zh: "建筑许可"
    unit: "k SAAR"
    fetcher: fred
    series: "PERMIT"
    source_name: "FRED / Census"
    source_url: "https://fred.stlouisfed.org/series/PERMIT"
    frequency: "monthly"
    start_date: "1990-01-01"
    caveat_en: "Permits are often a cleaner forward-looking housing signal than starts."
    caveat_zh: "建筑许可通常比开工更适合作为前瞻住房信号。"
  - id: new_home_sales
    section: housing
    label_en: "New Home Sales"
    label_zh: "新房销售"
    unit: "k SAAR"
    fetcher: fred
    series: "HSN1F"
    source_name: "FRED / Census"
    source_url: "https://fred.stlouisfed.org/series/HSN1F"
    frequency: "monthly"
    start_date: "1990-01-01"
    caveat_en: "New home sales are volatile and heavily revised."
    caveat_zh: "新房销售波动大且修订明显。"
  - id: construction_spending_growth
    section: housing
    label_en: "Construction Spending Growth"
    label_zh: "建筑支出同比"
    unit: "% y/y"
    transform: "yoy_pct"
    fetcher: fred
    series: "TTLCONS"
    source_name: "FRED / Census"
    source_url: "https://fred.stlouisfed.org/series/TTLCONS"
    frequency: "monthly"
    start_date: "1993-01-01"
    caveat_en: "Derived growth from total construction spending."
    caveat_zh: "由总建筑支出水平派生的同比增速。"
  - id: case_shiller_20_city_growth
    section: housing
    label_en: "Case-Shiller 20-City Home Prices"
    label_zh: "Case-Shiller 20城房价同比"
    unit: "% y/y"
    transform: "yoy_pct"
    fetcher: fred
    series: "SPCS20RSA"
    source_name: "FRED / S&P CoreLogic Case-Shiller"
    source_url: "https://fred.stlouisfed.org/series/SPCS20RSA"
    frequency: "monthly"
