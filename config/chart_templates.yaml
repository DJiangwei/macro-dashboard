defaults:
  template: plotly_white
  height: 380
  margin: {l: 50, r: 30, t: 50, b: 70}
  font_family: "Avenir Next, PingFang SC, Hiragino Sans GB, Noto Sans SC, Segoe UI, Helvetica Neue, Arial, sans-serif"
  font_size: 12
  hovermode: x unified

colors:
  primary: "#8a593d"        # buy-side blue
  secondary: "#5f6f66"      # accent red for "vs target"
  peer_palette:             # for peer overlays (primary highlighted in primary blue)
    - "#9aa3ad"
    - "#7c8794"
    - "#5e6b78"
    - "#404d5b"
  positive: "#3f6f50"
  negative: "#9d3d2e"
  band_fill: "rgba(31, 78, 121, 0.08)"

footer:
  template: "Source: {source} · Series: {series_id} · Updated {last_update} · Fetched {fetched}"
  font_size: 10
  color: "#666"
