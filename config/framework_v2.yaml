version: 2
core_concept_count: 48

pillars:
  growth_demand:
    order: 1
    priority_weight: 5
    title_en: Growth & Domestic Demand
    title_zh: 增长与内需
  production_cycle:
    order: 2
    priority_weight: 4
    title_en: Production & Business Cycle
    title_zh: 生产与商业周期
  labour_household:
    order: 3
    priority_weight: 4
    title_en: Labour & Household Income
    title_zh: 劳动力与居民收入
  prices_costs:
    order: 4
    priority_weight: 5
    title_en: Prices, Wages & Costs
    title_zh: 价格、工资与成本
  housing_investment:
    order: 5
    priority_weight: 3
    title_en: Housing & Investment
    title_zh: 房地产与投资
  external_fx:
    order: 6
    priority_weight: 4
    title_en: External Balance & FX
    title_zh: 外部平衡与汇率
  fiscal_sovereign:
    order: 7
    priority_weight: 3
    title_en: Fiscal & Sovereign
    title_zh: 财政与主权
  monetary_financial:
    order: 8
    priority_weight: 5
    title_en: Monetary, Credit & Financial Conditions
    title_zh: 货币、信用与金融条件
  stability_structural:
    order: 9
    priority_weight: 2
    title_en: Financial Stability & Structural Risk
    title_zh: 金融稳定与结构性风险

# Old identifiers remain resolvable for downstream readers, but new output uses
# economically accurate identifiers.
legacy_aliases:
  manufacturing_pmi: industry_confidence
  oecd_cli: employment_expectations
  ifo_expectations: german_industry_confidence
  truck_km_index: road_freight_activity
  cds_5y: sovereign_spread_public
  embi_spread: sovereign_spread_public
  fx_implied_vol: fx_realised_volatility

