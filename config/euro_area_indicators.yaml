name: "Euro Area"
name_zh: "欧元区"
code: "EA"
iso2: "EA"
subtitle_en: "A data-first macro page for the Euro Area built from official ECB Data Portal and Eurostat Dissemination public endpoints."
subtitle_zh: "基于欧洲央行(ECB)与欧盟统计局(Eurostat)官方公开接口构建的欧元区数据优先宏观页面。"
min_chart_count: 55

sections:
  growth_accounts:
    title_en: "GDP & National Accounts"
    title_zh: "GDP与国民账户"
    report_logic_en: "Eurostat quarterly national accounts anchor the euro area macro story: real GDP sequential QoQ and annual YoY growth, household consumption, gross fixed capital formation, government consumption, and trade volumes."
    report_logic_zh: "欧盟统计局(Eurostat)季度国民账户构成欧元区宏观叙事基准：实际GDP环比与同比增速、居民消费、固定资本形成总额、政府消费及进出口贸易量。"
  production_cycle:
    title_en: "Production & Business Cycle"
    title_zh: "生产与商业周期"
    report_logic_en: "Eurostat monthly short-term business statistics (STS) track industrial and manufacturing production, retail trade volume, and construction output. DG ECFIN business and consumer surveys (BCS) supply capacity utilisation, the headline Economic Sentiment Indicator (ESI), sector confidence balances, and employment expectations."
    report_logic_zh: "欧盟统计局月度短期商业统计(STS)追踪工业与制造业生产、零售销售量与建筑业产出。欧盟委员会经济金融总司(DG ECFIN)商业与消费者调查提供产能利用率、综合经济景气指数(ESI)、分行业信心差值及就业预期。"
  labour_wages:
    title_en: "Labour Market & Wages"
    title_zh: "劳动力市场与工资"
    report_logic_en: "Harmonised unemployment and youth unemployment rates track labour slack; national accounts employment growth, Eurostat job vacancy rates, and the Labour Cost Index (LCI) capture labour demand and cost pressures. The ECB indicator of negotiated wages is the key metric for underlying domestic inflationary persistence."
    report_logic_zh: "调和失业率与青年失业率衡量劳动力闲置程度；国民账户就业增长、职位空缺率与劳动力成本指数(LCI)捕捉劳动力需求与成本压力。欧洲央行协议工资指标是评估潜在本土通胀粘性的核心变量。"
  prices_costs:
    title_en: "Prices & Costs"
    title_zh: "价格与成本"
    report_logic_en: "Eurostat monthly HICP (prc_hicp_manr) provides headline, core (excluding energy and food), services, energy, and food annual inflation. Industrial producer prices (PPI) capture pipeline pressures. The ECB Survey of Professional Forecasters (SPF) and Consumer Expectations Survey (CES) anchor long-term and 12-month forward expectations."
    report_logic_zh: "欧盟统计局月度调和消费者物价指数(HICP)提供总体、核心（剔除能源与食品）、服务、能源与食品通胀年率。工业生产者出厂价格(PPI)捕捉生产端管道压力。欧洲央行专业预测机构调查(SPF)与消费者预期调查(CES)锚定长期与未来12个月的通胀预期。"
  housing_investment:
    title_en: "Housing & Property"
    title_zh: "住房与房地产"
    report_logic_en: "Eurostat quarterly house price index (HPI) tracks residential property valuations across the euro area. The ECB MFI interest rate statistics (MIR) track composite household borrowing costs for house purchase, while building permits provide a leading indicator of residential construction activity."
    report_logic_zh: "欧盟统计局季度房价指数(HPI)跟踪欧元区住宅估值。欧洲央行MFI利率统计(MIR)衡量居民购房综合借贷成本，建筑许可则提供住宅建筑活动的前瞻信号。"
  external_fx:
    title_en: "External Balance & FX"
    title_zh: "外部平衡与汇率"
    report_logic_en: "Eurostat monthly international trade in goods and quarterly balance of payments (BoP) current account ratio capture the external surplus. ECB daily EUR/USD reference rates and monthly nominal effective exchange rates (EER-40) alongside BIS real effective exchange rates (REER) track the common currency's external valuation."
    report_logic_zh: "欧盟统计局月度国际货物贸易与季度国际收支(BoP)经常账户比率刻画外部盈余。欧洲央行日度EUR/USD参考汇率、月度名义有效汇率(EER-40)及BIS实际有效汇率(REER)跟踪欧元的外部估值。"
  fiscal_sovereign:
    title_en: "Fiscal & Sovereign"
    title_zh: "财政与主权"
    report_logic_en: "Eurostat annual EDP notifications and quarterly government debt statistics track aggregate Maastricht deficit and debt ratios. IMF DataMapper structural balances capture cyclically adjusted fiscal stance. The ECB daily AAA euro area central government yield curve (2Y, 10Y, and 10Y-2Y slope) provides the risk-free term structure benchmark."
    report_logic_zh: "欧盟统计局年度EDP通报与季度政府债务统计跟踪马斯特里赫特赤字与债务比率。IMF DataMapper结构性平衡衡量经周期调整的财政立场。欧洲央行日度AAA级欧元区中央政府收益率曲线（2年、10年及10Y-2Y期限利差）提供无风险期限结构基准。"
  fragmentation:
    title_en: "Sovereign Spreads & Fragmentation"
    title_zh: "主权利差与碎片化风险"
    report_logic_en: "Sovereign spreads against the German 10Y Bund benchmark (Italy BTP, France OAT, Spain Bonos, Greece GGB) measure financial fragmentation and sovereign credit risk within the currency union. The ECB Composite Indicator of Systemic Stress (CISS) and national central bank TARGET2 balances (Bundesbank and Banca d'Italia) track systemic stress and inter-country settlement imbalances."
    report_logic_zh: "对德国10年期国债基准(Bund)的主权利差（意大利BTP、法国OAT、西班牙Bonos、希腊GGB）衡量货币联盟内的金融碎片化与主权信用风险。欧洲央行系统性压力综合指标(CISS)与各国央行TARGET2净余额（德国央行与意大利央行）跟踪系统性压力与跨境清算不平衡。"
  monetary_financial:
    title_en: "Monetary & Financial Conditions"
    title_zh: "货币与金融条件"
    report_logic_en: "The ECB Deposit Facility Rate (DFR) is the primary policy rate anchor; €STR is the benchmark overnight unsecured rate. M3 broad money growth and adjusted bank loan growth to NFCs and households reflect credit creation. NFC borrowing costs, the Eurosystem consolidated balance sheet, and Bank Lending Survey (BLS) credit standards complete the transmission mechanism."
    report_logic_zh: "欧洲央行存款便利利率(DFR)为核心政策利率锚；€STR为无担保隔夜基准利率。广义货币M3增速与经调整的企业及居民贷款增速反映信用创造。非金融企业借贷成本、欧元系统资产负债表总规模及银行借贷调查(BLS)信贷标准完整刻画货币政策传导。"
  stability_structural:
    title_en: "Financial Stability & Structural Risk"
    title_zh: "金融稳定与结构性风险"
    report_logic_en: "ECB Supervisory Banking Statistics provide Common Equity Tier 1 (CET1) capital ratios and non-performing loan (NPL) ratios for Significant Institutions under the Single Supervisory Mechanism (SSM). BIS credit to households tracks aggregate private leverage relative to GDP."
    report_logic_zh: "欧洲央行单一监管机制(SSM)下的主要银行监管统计提供核心一级资本充足率(CET1)与不良贷款率(NPL)。BIS居民部门信贷数据跟踪相对于GDP的私人部门杠杆存量。"

