  - id: real_gdp_growth
    section: growth_accounts
    label_en: "Real GDP Growth, QoQ"
    label_zh: "实际GDP环比"
    unit: "% q/q"
    fetcher: eurostat_jsonstat
    dataset: "namq_10_gdp"
    filters:
      freq: "Q"
      geo: "EA"
      s_adj: "SCA"
      na_item: "B1GQ"
      unit: "CLV_PCH_PRE"
    source_name: "Eurostat"
    source_url: "https://ec.europa.eu/eurostat/databrowser/view/namq_10_gdp"
    frequency: "quarterly"
    start_date: "1995"
    caveat_en: "Quarter-on-quarter real GDP growth in volumes; seasonally and calendar adjusted."
    caveat_zh: "以数量计的季调实际GDP环比增速；经季节与工作日调整。"

