HU:
  name: Hungary
  iso2: HU
  iso3: HUN
  currency: HUF
  population: "9.6 million"
  gdp_nominal: "$215 bn (2024)"
  gdp_per_capita: "$22,400"
  central_bank: Magyar Nemzeti Bank (MNB)
  fx_regime: Free float (with FX-stabilising operations)
  inflation_target: "3.0% ±1pp"
  sovereign_ratings:
    sp: BBB-
    moody: Baa3
    fitch: BBB
  equity_index: BUX (OTP Bank, ~25% wt as proxy)
  equity_yahoo: "OTP.BD"
  default_peers: [PL, CZ, RO]
  trading_partners: [Germany, Austria, China, Italy, Romania]
  major_industries:
    - Automotive & EV batteries (Audi, BMW, Mercedes, CATL plants)
    - Electronics & ICT manufacturing
    - Pharmaceuticals (Richter Gedeon, Egis)
    - Food processing & agriculture
    - Business services & shared service centres
  geo_context: |
    Landlocked CEE economy at the crossroads of major EU transport corridors.
    Borders 7 countries (AT, SK, UA, RO, RS, HR, SI). Flat terrain (Pannonian Basin)
    with the Danube as the main waterway. EU and NATO member since 2004, Schengen
    since 2007. Not a euro-area member.
  political_context: |
    The April 2026 parliamentary election produced a Tisza Party supermajority,
    ending 16 years of Fidesz rule under Viktor Orbán. The new government
    inherits a wide fiscal deficit and suspended EU RRF/cohesion funds (~€36bn
    envelope frozen) due to rule-of-law disputes under the previous administration.
    The political pivot raises the probability of an EU funds agreement in H2
    2026 but introduces policy uncertainty during the transition.
  societal_context: |
    Population ~9.6mn, declining slowly (-0.3%/yr). Median age 44, above EU
    average. Labour force participation ~67% with scope to rise. High educational
    attainment in STEM fields supports manufacturing FDI. Budapest metro area
    (~1.7mn) dominates economic activity; east-west regional inequality is
    pronounced. Household debt is low (~20% of GDP) but FX mortgage exposure
    (mostly HUF-refinanced post-2015) is a legacy vulnerability.
  central_bank_section:
    governor: "György Matolcsy (term ends March 2027)"
    board:
      - "Barnabás Virág (Deputy Governor — monetary policy, financial stability)"
      - "Mihály Patai (Deputy Governor — international relations, payments)"
      - "Csaba Kandrács (Deputy Governor — supervision, consumer protection)"
      - "András Bártfai-Mager (external member)"
      - "Gyula Pleschinger (external member)"
      - "Zoltán Kovács (external member)"
    mpc: "Monetary Council — 9 members (Governor + 3 Deputy Governors + 5 external). Decisions by simple majority."
    meeting_schedule: "Monthly rate-setting meetings, typically third Tuesday. Minutes published 2 weeks after. Quarterly Inflation Report (March, June, September, December)."
    policy_framework: |
      Inflation-targeting regime since 2001. Target: 3.0% CPI ±1pp tolerance band.
      MNB Act grants instrument independence; the Monetary Council sets the base rate,
      the overnight deposit/collateralised loan corridor (+/-100bp around base rate),
      and reserve requirements. Since 2020 the MNB has also used unconventional tools:
      long-dated collateralised loans (FGS Go!), government bond purchases (Q€), and
      FX swaps to manage HUF liquidity. The MNB balance sheet is ~55% of GDP
      (elevated vs CEE peers), reflecting asset purchase programmes and FX swap stock.
    balance_sheet:
      total_assets: "~HUF 44 trillion (~55% GDP)"
      key_items:
        - "FX reserves: ~€46bn (46% of assets) — predominantly EUR, USD, and gold"
        - "Government securities held: ~HUF 12tn (27% of assets) — legacy of Q€ programme"
        - "Collateralised lending to banks: ~HUF 5tn (11% of assets) — FGS Go! and other facilities"
        - "Liabilities: commercial bank reserves + overnight deposits (~HUF 20tn) are the main funding source"
        - "Capital & reserves: negative equity position (~-HUF 800bn) due to Q€ mark-to-market losses"
    key_risks: |
      (1) Negative equity: the MNB's Q€ portfolio sits at a deep mark-to-market loss after
      2021-23 rate hikes. The central bank can operate with negative equity (it's not a
      solvency risk), but it creates a political vulnerability. (2) FX swap stock: ~€20bn
      equivalent in outstanding swaps — a liquidity backstop but also a contingent liability
      if HUF comes under pressure. (3) Policy credibility: the 2021-22 inflation overshoot
      (peak 25.7% CPI) hurt MNB credibility; the current cautious stance is designed to
      rebuild it. (4) Governor transition: Matolcsy's term ends March 2027; the Tisza
      government's appointment will signal its monetary-policy preferences.

PL:
  name: Poland
  iso2: PL
  iso3: POL
  currency: PLN
  population: "36.8 million"
  gdp_nominal: "$845 bn (2024)"
  gdp_per_capita: "$23,000"
  central_bank: Narodowy Bank Polski (NBP)
  fx_regime: Free float
  inflation_target: "2.5% ±1pp"
  sovereign_ratings:
    sp: A-
    moody: A2
    fitch: A-
  equity_index: WIG20
  equity_yahoo: "WIG20.WA"
  default_peers: [HU, CZ, RO]
  trading_partners: [Germany, Czechia, France, UK, Netherlands]
  major_industries:
    - Automotive parts & assembly (Europe's largest auto-parts exporter)
    - Consumer electronics & home appliances
    - IT services & software development
    - Food processing & agribusiness
    - Coal mining & energy (legacy, declining)
  geo_context: |
    Largest CEE economy. Baltic Sea access (Gdańsk, Gdynia ports). Borders 7
    countries (DE, CZ, SK, UA, BY, LT, RU-Kaliningrad). Critical NATO eastern-flank
    logistics hub post-2022. EU member since 2004, non-euro.
  political_context: |
    The KO (Civic Coalition) government under PM Donald Tusk took office in late 2023,
    shifting policy toward EU alignment and judicial reform. EU RRF funds (~€60bn)
    have been partially unlocked. Presidential election due mid-2025 adds near-term
    political noise. Broadly pro-EU, pro-NATO consensus across major parties.
  societal_context: |
    Population ~36.8mn, largest in CEE. Relatively young demographic profile vs EU
    average. Strong Catholic social conservatism coexists with rapid urbanisation.
    Warsaw, Kraków, Wrocław are talent hubs. Large diaspora (~20mn diaspora globally)
    provides significant remittance flows (~€4bn/yr). Labour market tight with
    unemployment structurally below 4% — a binding constraint on growth.

CZ:
  name: Czechia
  iso2: CZ
  iso3: CZE
  currency: CZK
  population: "10.9 million"
  gdp_nominal: "$345 bn (2024)"
  gdp_per_capita: "$31,600"
  central_bank: Česká národní banka (CNB)
  fx_regime: Managed float
  inflation_target: "2.0% ±1pp"
  sovereign_ratings:
    sp: AA-
    moody: Aa3
    fitch: AA-
  equity_index: PX
  equity_yahoo: "^PX"
  default_peers: [HU, PL, RO]
  trading_partners: [Germany, Slovakia, Poland, France, Austria]
  major_industries:
    - Automotive OEM & supply chain (Škoda/VW, Hyundai, Toyota plants)
    - Machinery & precision engineering
    - Electronics & semiconductor-adjacent manufacturing
    - Beer & beverages
    - Tourism (Prague, 12mn+ visitors/yr)
  geo_context: |
    Landlocked, borders DE, PL, SK, AT. Deeply integrated into German supply chains.
    EU and NATO member since 2004, Schengen since 2007. The CZK is freely convertible
    but CNB maintains a managed-float regime with occasional verbal/FX intervention.
  political_context: |
    ANO (centrist-populist) under Andrej Babiš leads opinion polls heading into the
    2025 parliamentary election. The current SPOLU coalition has delivered fiscal
    consolidation (deficit ~2.2% GDP) but faces voter fatigue. Euro adoption remains
    a distant prospect — public opinion is 65%+ opposed. Key risk: ANO's policy
    platform is light on fiscal detail.
  societal_context: |
    Population ~10.9mn, ageing profile. Highest GDP per capita in CEE (PPP-adjusted
    above Italy/Spain). Very low unemployment (~2.6%, EU's lowest) creates severe
    labour shortages in manufacturing and services. Prague property market is
    among Europe's most overvalued on price-to-income. Secular/atheist-leaning
    population; high social trust. Strong vocational education system supports
    manufacturing base.

RO:
  name: Romania
  iso2: RO
  iso3: ROU
  currency: RON
  population: "19.0 million"
  gdp_nominal: "$370 bn (2024)"
  gdp_per_capita: "$19,500"
  central_bank: Banca Națională a României (BNR)
  fx_regime: Managed float (de facto crawl vs EUR)
  inflation_target: "2.5% ±1pp"
  sovereign_ratings:
    sp: BBB-
    moody: Baa3
    fitch: BBB-
  equity_index: BET
  equity_yahoo: "^BETI"
  default_peers: [HU, PL, CZ]
  trading_partners: [Germany, Italy, France, Hungary, Bulgaria]
  major_industries:
    - Automotive components & wire harnesses (Dacia/Renault, Ford, Continental)
    - IT services & software outsourcing (fastest-growing tech sector in EU)
    - Oil & gas extraction (OMV Petrom, Black Sea offshore)
    - Agri-food (EU's largest maize/sunflower producer)
    - Construction materials & cement
  geo_context: |
    Southeastern Europe, Black Sea coastline (Constanța port — EU's easternmost
    major port). Borders 5 countries (HU, RS, BG, UA, MD). Danube river corridor
    connects to Central Europe. EU and NATO member since 2007; Schengen accession
    (partial: air/sea borders) achieved 2024. Constanța is a critical maritime
    gateway for Ukrainian grain exports via the Solidarity Lanes.
  political_context: |
    The PSD-PNL grand coalition has governed since 2021, delivering political
    stability but limited reform momentum. Fiscal consolidation is the key
    challenge — Romania faces an Excessive Deficit Procedure (EDP) with a deficit
    exceeding 6% of GDP. The presidential and parliamentary election cycle (2024-25)
    saw a strong far-right showing (~32% combined), introducing a new political
    risk dimension. EU RRF funds (~€29bn) are partially disbursed but dependent
    on judicial and pension reform milestones.
  societal_context: |
    Population ~19mn, declining faster than any EU peer (-0.6%/yr) due to
    emigration and low fertility. Very large diaspora (~4mn, mainly in IT, ES, DE,
    UK) generates significant remittance inflows (~€6bn/yr). Regional inequality
    is extreme: Bucharest-Ilfov GDP per capita is ~160% of EU average, while the
    NE and SW development regions are below 50%. Tech talent pool is deep and
    cost-competitive — Bucharest, Cluj, Iași, and Timișoara are growing tech hubs.
    Twin deficits (fiscal + current account) are the perennial macro vulnerability.

