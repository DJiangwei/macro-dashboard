data_gaps:
  - section: labour_structural
    item_en: High-Frequency Monthly Seasonally Adjusted Unemployment Rate Time Series
    item_zh: 高频月度季节调整后失业率历史序列
    status_en: DGBAS publishes monthly unemployment and participation rates via dynamic web queries (nstatdb) and press releases; automated API ingestion can be expanded once DGBAS open data API tokens are provisioned.
    status_zh: 主计总处通过nstatdb动态查询及新闻稿发布月度季调失业率与劳动参与率；待开放API接口进一步对接后可自动升级。

cross_checks:
  - concept: headline_inflation
    primary: cpi_inflation
    secondary: core_cpi_inflation
    tolerance: 1.50
    label_en: DGBAS Headline CPI vs Core CPI
  - concept: real_effective_exchange_rate
    primary: reer
    secondary: bis_reer
    tolerance: 15.0
    label_en: Bruegel REER vs BIS REER Mirror
