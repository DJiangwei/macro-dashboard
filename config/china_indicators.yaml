  - id: gdp_deflator
    section: prices
    label_en: "GDP Deflator"
    label_zh: "GDP平减指数"
    unit: "%"
    fetcher: world_bank
    series: "NY.GDP.DEFL.KD.ZG"
    source_name: "World Bank WDI"
    source_url: "https://api.worldbank.org/v2/country/CHN/indicator/NY.GDP.DEFL.KD.ZG"
    frequency: "annual"
    caveat_en: "Useful for economy-wide nominal/real split, but not a monthly price gauge."
    caveat_zh: "适合观察全经济名义/实际拆分，但不是月度价格指标。"
  - id: unemployment
    section: population_labor
    label_en: "Unemployment Rate"
    label_zh: "失业率"
    unit: "%"
    fetcher: world_bank
    series: "SL.UEM.TOTL.ZS"
    source_name: "World Bank WDI / ILO estimate"
    source_url: "https://api.worldbank.org/v2/country/CHN/indicator/SL.UEM.TOTL.ZS"
    frequency: "annual"
    caveat_en: "ILO-modeled annual rate; China urban surveyed unemployment and youth unemployment have definition breaks."
    caveat_zh: "ILO模型年度失业率；中国城镇调查失业率和青年失业率存在口径变化。"
  - id: total_population
    section: population_labor
    label_en: "Total Population"
    label_zh: "总人口"
    unit: "people"
    transform: "people_billion"
    fetcher: world_bank
    series: "SP.POP.TOTL"
    source_name: "World Bank WDI"
    source_url: "https://api.worldbank.org/v2/country/CHN/indicator/SP.POP.TOTL"
    frequency: "annual"
    caveat_en: "Annual population stock; revisions can follow census updates."
    caveat_zh: "年度人口存量；人口普查后可能修订。"
  - id: urban_population_share
    section: population_labor
    label_en: "Urban Population Share"
    label_zh: "城镇人口占比"
    unit: "%"
    fetcher: world_bank
    series: "SP.URB.TOTL.IN.ZS"
    source_name: "World Bank WDI"
    source_url: "https://api.worldbank.org/v2/country/CHN/indicator/SP.URB.TOTL.IN.ZS"
    frequency: "annual"
    caveat_en: "Structural urbanization metric; not a labor-market cycle indicator."
    caveat_zh: "结构性城镇化指标；不是劳动力市场周期指标。"
  - id: working_age_share
    section: population_labor
    label_en: "Working-age Population Share"
    label_zh: "劳动年龄人口占比"
    unit: "%"
    fetcher: world_bank
    series: "SP.POP.1564.TO.ZS"
    source_name: "World Bank WDI"
    source_url: "https://api.worldbank.org/v2/country/CHN/indicator/SP.POP.1564.TO.ZS"
    frequency: "annual"
    caveat_en: "Captures demographic pressure but not employment quality or migrant-worker dynamics."
    caveat_zh: "反映人口压力，但不反映就业质量或农民工动态。"
  - id: birth_rate
    section: population_labor
    label_en: "Crude Birth Rate"
    label_zh: "出生率"
    unit: "per 1,000 people"
    fetcher: world_bank
    series: "SP.DYN.CBRT.IN"
    source_name: "World Bank WDI"
    source_url: "https://api.worldbank.org/v2/country/CHN/indicator/SP.DYN.CBRT.IN"
    frequency: "annual"
    caveat_en: "Demographic vital-statistics series; revisions are possible."
    caveat_zh: "人口生命统计序列；可能修订。"
  - id: death_rate
    section: population_labor
    label_en: "Crude Death Rate"
    label_zh: "死亡率"
    unit: "per 1,000 people"
    fetcher: world_bank
    series: "SP.DYN.CDRT.IN"
    source_name: "World Bank WDI"
    source_url: "https://api.worldbank.org/v2/country/CHN/indicator/SP.DYN.CDRT.IN"
    frequency: "annual"
    caveat_en: "Demographic vital-statistics series; revisions are possible."
    caveat_zh: "人口生命统计序列；可能修订。"
  - id: electricity_consumption_yoy_akshare
    section: activity_production
    label_en: "Electricity Consumption, YoY"
    label_zh: "全社会用电量同比"
    unit: "%"
    fetcher: akshare_table
    function: macro_china_society_electricity
    date_column: "统计时间"
    value_column: "全社会用电量同比"
    series: "macro_china_society_electricity:全社会用电量同比"
    source_name: "AKShare / Sina Finance"
    source_url: "https://www.akshare.xyz/data/macro/macro.html"
    frequency: "monthly"
    caveat_en: "Monthly electricity-consumption growth via AKShare's Sina Finance wrapper; useful as a physical activity cross-check, not a GDP substitute."
    caveat_zh: "AKShare新浪财经包装的全社会用电量同比；适合作为实体活动交叉验证，不是GDP替代。"
  - id: general_gov_balance
    section: government_finance
    label_en: "General Government Balance"
    label_zh: "广义政府财政余额"
    unit: "% of GDP"
    fetcher: imf_datamapper
    series: "GGXCNL_NGDP"
    source_name: "IMF WEO"
    source_url: "https://www.imf.org/external/datamapper/GGXCNL_NGDP@WEO/CHN"
    frequency: "annual"
    actual_through: 2024
    caveat_en: "IMF WEO includes estimates/projections; China fiscal analysis should also monitor land sales and off-budget local-government financing."
    caveat_zh: "IMF WEO包含估算/预测；中国财政还需要跟踪土地出让与地方政府预算外融资。"
  - id: fiscal_revenue_ytd_yoy_akshare
    section: government_finance
    label_en: "Fiscal Revenue YTD, YoY"
    label_zh: "财政收入累计同比"
    unit: "%"
    fetcher: akshare_table
    function: macro_china_czsr
    date_column: "月份"
    value_column: "累计-同比增长"
    series: "macro_china_czsr:累计-同比增长"
    source_name: "AKShare / Eastmoney Data Center"
    source_url: "https://www.akshare.xyz/data/macro/macro.html"
    frequency: "monthly"
    caveat_en: "Monthly cumulative fiscal revenue growth via AKShare; YTD series is affected by base effects and fiscal calendar timing."
    caveat_zh: "AKShare包装的月度财政收入累计同比；累计口径受基数效应和财政日历节奏影响。"
  - id: general_gov_debt
    section: government_finance
    label_en: "General Government Gross Debt"
    label_zh: "广义政府总债务"
    unit: "% of GDP"
    fetcher: imf_datamapper
    series: "GGXWDG_NGDP"
    source_name: "IMF WEO"
    source_url: "https://www.imf.org/external/datamapper/GGXWDG_NGDP@WEO/CHN"
    frequency: "annual"
    actual_through: 2024
    caveat_en: "IMF WEO measure; does not fully solve quasi-fiscal/LGFV boundary issues."
    caveat_zh: "IMF WEO口径；不能完全解决准财政/LGFV边界问题。"

