data_gaps:
  - section: activity_production
    item_en: "NBS monthly industrial production, services output index, electricity consumption, rail freight, industrial profits, and PMI series"
    item_zh: "NBS月度工业增加值、服务业生产指数、电力消费、铁路货运、工业企业利润与PMI序列"
    status_en: "AKShare-wrapped industrial value added, official PMI, electricity consumption, enterprise boom, and global freight are charted; NBS-native services output, rail freight, profits, and direct EasyQuery remain adapter gaps."
    status_zh: "页面已加入AKShare包装的工业增加值、官方PMI、用电量、企业景气和全球航运指标；NBS原生服务业生产、铁路货运、工业利润和EasyQuery直连仍是adapter缺口。"
  - section: investment
    item_en: "NBS fixed asset investment by sector and project pipeline"
    item_zh: "NBS固定资产投资分项与项目施工链条"
    status_en: "Headline FAI growth is charted through AKShare's Eastmoney wrapper; sector and project-pipeline details remain open."
    status_zh: "页面已通过AKShare东方财富包装接入固定资产投资总量增速；行业和项目施工链条仍待补充。"
  - section: real_estate
