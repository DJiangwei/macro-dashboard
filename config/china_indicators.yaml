    status_zh: "页面已加入M2、M1、新增人民币贷款、社融增量/分项、LPR、存准率、日度SHIBOR、3个月银行间利率和PBC最新卡片；社融存量、分部门存款、MLF和完整PBOC原生历史仍待补充。"
