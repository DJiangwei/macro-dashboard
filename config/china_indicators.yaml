data_gaps:
  - section: activity_production
    item_en: "NBS monthly industrial production, services output index, electricity consumption, rail freight, industrial profits, and PMI series"
    item_zh: "NBS月度工业增加值、服务业生产指数、电力消费、铁路货运、工业企业利润与PMI序列"
    status_en: "NBS EasyQuery returned 403 from this runtime; add an official adapter only after the endpoint is reproducible."
    status_zh: "当前运行环境访问NBS EasyQuery返回403；只有在官方接口可复跑后才应加入adapter。"
  - section: investment
    item_en: "NBS fixed asset investment by sector and project pipeline"
    item_zh: "NBS固定资产投资分项与项目施工链条"
    status_en: "Core China-native monthly indicators; not proxied in v1."
    status_zh: "中国本土核心月度指标；v1不使用替代proxy。"
  - section: real_estate
    item_en: "NBS property investment, floor-space starts/completions/sales, 70-city price index, land transactions, and inventory"
    item_zh: "NBS房地产开发投资、开工/竣工/销售面积、70城房价、土地成交与库存"
    status_en: "High priority for the next official-source adapter."
    status_zh: "下一阶段官方数据adapter的最高优先级之一。"
  - section: consumption
    item_en: "NBS retail sales, online retail sales, household survey, auto sales, and consumer confidence"
    item_zh: "NBS社零、网上零售、居民调查、汽车销售与消费者信心"
    status_en: "Retail sales are not equivalent to national-accounts consumption; keep separate when official data is wired."
    status_zh: "社零不等同于国民账户消费；接入官方数据时应分开呈现。"
  - section: money_credit
    item_en: "PBOC monthly RMB loans, deposits, TSF flow/stock, LPR/MLF/RRR, and interbank rates"
    item_zh: "PBOC月度人民币贷款、存款、社融流量/存量、LPR/MLF/RRR与银行间利率"
    status_en: "PBC latest cards are shown; full history requires a dedicated PBOC parser."
    status_zh: "页面已显示PBC最新卡片；完整历史需要专门的PBOC解析器。"
  - section: prices
    item_en: "NBS monthly CPI, core CPI, PPI, agriculture prices, and trade price indices"
    item_zh: "NBS月度CPI、核心CPI、PPI、农产品价格与进出口价格指数"
    status_en: "Annual WDI inflation and deflator charts are shown; tactical monthly data is pending."
    status_zh: "页面显示年度WDI通胀和平减指数；战术性月度数据待接入。"
