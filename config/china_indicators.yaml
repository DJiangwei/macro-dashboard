sections:
  activity_production:
    title_en: "Activity & Production"
    title_zh: "总量活动与生产"
    report_logic_en: "GDP, production-side value added, industrial activity, services output, electricity, freight, profits, and PMIs."
    report_logic_zh: "GDP、生产法增加值、工业活动、服务业产出、电力、货运、工业利润与PMI。"
  investment:
    title_en: "Investment"
    title_zh: "投资"
    report_logic_en: "Fixed asset investment, construction pipeline, and investment funding conditions."
    report_logic_zh: "固定资产投资、项目施工链条与投资资金来源。"
  real_estate:
    title_en: "Real Estate"
    title_zh: "房地产"
    report_logic_en: "Property investment, floor space starts/completions/sales, prices, land, and inventory."
    report_logic_zh: "房地产开发投资、开工/竣工/销售面积、房价、土地与库存。"
  consumption:
    title_en: "Consumption"
    title_zh: "消费"
    report_logic_en: "Retail sales, household income and spending, autos, and consumer confidence."
    report_logic_zh: "社会消费品零售、居民收入与支出、汽车销售与消费者信心。"
  external:
    title_en: "External Sector"
    title_zh: "外部部门"
    report_logic_en: "Goods and services trade, BOP, FDI, external debt, FX reserves, and RMB exchange-rate measures."
    report_logic_zh: "货物和服务贸易、国际收支、FDI、外债、外汇储备与人民币汇率指标。"
  money_credit:
    title_en: "Money, Credit & Banking"
    title_zh: "货币、信用与银行"
    report_logic_en: "Money supply, bank credit, total social financing, policy tools, and interbank rates."
    report_logic_zh: "货币供应、银行信贷、社会融资规模、政策工具与银行间利率。"
  financial_markets:
    title_en: "Financial Markets"
    title_zh: "金融市场"
    report_logic_en: "Market prices that help cross-check macro stress: equities, effective exchange rates, and market rates."
    report_logic_zh: "用于交叉验证宏观压力的市场价格：股票、有效汇率与市场利率。"
  prices:
    title_en: "Prices"
    title_zh: "价格"
    report_logic_en: "CPI, PPI, agriculture/raw-material prices, trade prices, and GDP deflator."
    report_logic_zh: "CPI、PPI、农产品/原材料价格、进出口价格与GDP平减指数。"
  population_labor:
    title_en: "Population & Labor"
    title_zh: "人口与劳动力"
    report_logic_en: "Population structure, migration, employment, unemployment, wages, and survey breaks."
    report_logic_zh: "人口结构、迁移、就业、失业、工资与调查口径变化。"
  government_finance:
    title_en: "Government Finance"
    title_zh: "政府财政"
    report_logic_en: "Budget revenue, expenditure, balance, local government debt, and off-budget/quasi-fiscal risks."
    report_logic_zh: "财政收入、支出、收支差额、地方政府债务与预算外/准财政风险。"

indicators:
  - id: real_gdp_growth
    section: activity_production
    label_en: "Real GDP Growth"
    label_zh: "实际GDP增速"
    unit: "%"
    fetcher: world_bank
    series: "NY.GDP.MKTP.KD.ZG"
    source_name: "World Bank WDI"
    source_url: "https://api.worldbank.org/v2/country/CHN/indicator/NY.GDP.MKTP.KD.ZG"
    frequency: "annual"
    caveat_en: "Annual WDI series; the report's preferred short-term lens is NBS quarterly/monthly production-side data."
    caveat_zh: "年度WDI序列；报告更偏好NBS季度/月度生产法数据来判断短期动能。"
  - id: nominal_gdp_usd
    section: activity_production
    label_en: "Nominal GDP"
    label_zh: "名义GDP"
    unit: "USD"
    transform: "usd_trn"
    fetcher: world_bank
    series: "NY.GDP.MKTP.CD"
    source_name: "World Bank WDI"
    source_url: "https://api.worldbank.org/v2/country/CHN/indicator/NY.GDP.MKTP.CD"
    frequency: "annual"
    caveat_en: "USD conversion adds exchange-rate effects; use RMB NBS levels for domestic accounting work."
    caveat_zh: "美元口径包含汇率影响；国内核算应优先使用NBS人民币现价数据。"
  - id: industry_value_added_growth
    section: activity_production
    label_en: "Industry Value Added Growth"
    label_zh: "工业部门增加值增速"
    unit: "%"
    fetcher: world_bank
    series: "NV.IND.TOTL.KD.ZG"
    source_name: "World Bank WDI"
    source_url: "https://api.worldbank.org/v2/country/CHN/indicator/NV.IND.TOTL.KD.ZG"
    frequency: "annual"
    caveat_en: "Annual industry value added is broader and slower than NBS monthly industrial production."
    caveat_zh: "年度工业部门增加值比NBS月度工业增加值更宽、更慢。"
  - id: services_value_added_growth
    section: activity_production
    label_en: "Services Value Added Growth"
    label_zh: "服务业增加值增速"
    unit: "%"
    fetcher: world_bank
    series: "NV.SRV.TOTL.KD.ZG"
    source_name: "World Bank WDI"
    source_url: "https://api.worldbank.org/v2/country/CHN/indicator/NV.SRV.TOTL.KD.ZG"
    frequency: "annual"
    caveat_en: "Services are harder to measure at high frequency; annual data can miss turning points."
    caveat_zh: "服务业高频测量难度更高；年度数据可能错过拐点。"
  - id: industrial_value_added_yoy_akshare
    section: activity_production
    label_en: "Industrial Value Added, YoY"
    label_zh: "工业增加值同比"
    unit: "%"
    fetcher: akshare_table
    function: macro_china_gyzjz
    date_column: "月份"
    value_column: "同比增长"
    series: "macro_china_gyzjz:同比增长"
    source_name: "AKShare / Eastmoney Data Center"
    source_url: "https://www.akshare.xyz/data/macro/macro.html"
    frequency: "monthly"
    caveat_en: "China-native monthly industrial value-added growth via AKShare's Eastmoney wrapper; use as a web-wrapped public series, not as a direct NBS API contract."
    caveat_zh: "AKShare东方财富包装的中国月度工业增加值增速；可作公开网页包装序列，不等同于NBS直连API。"
  - id: manufacturing_pmi_akshare
    section: activity_production
    label_en: "Manufacturing PMI"
    label_zh: "制造业PMI"
    unit: "Index"
    fetcher: akshare_table
    function: macro_china_pmi
    date_column: "月份"
    value_column: "制造业-指数"
    series: "macro_china_pmi:制造业-指数"
    source_name: "AKShare / Eastmoney Data Center"
    source_url: "https://www.akshare.xyz/data/macro/macro.html"
    frequency: "monthly"
    caveat_en: "Official PMI series as exposed by AKShare's Eastmoney wrapper; cross-check release dates and revisions against NBS/CFLP when precision matters."
    caveat_zh: "AKShare东方财富包装的官方PMI序列；精确使用时应与NBS/CFLP发布日期和修订交叉核对。"
  - id: non_manufacturing_pmi_akshare
    section: activity_production
    label_en: "Non-Manufacturing PMI"
    label_zh: "非制造业PMI"
    unit: "Index"
    fetcher: akshare_table
    function: macro_china_pmi
    date_column: "月份"
    value_column: "非制造业-指数"
    series: "macro_china_pmi:非制造业-指数"
    source_name: "AKShare / Eastmoney Data Center"
    source_url: "https://www.akshare.xyz/data/macro/macro.html"
    frequency: "monthly"
    caveat_en: "Uses the Eastmoney-wrapped PMI table rather than the Jin10 non-manufacturing PMI endpoint because the latter returned less reliable tail observations in this runtime."
    caveat_zh: "使用东方财富包装PMI表，而非金十非制造业PMI端点；后者在当前环境中尾部观测不够稳定。"
  - id: enterprise_boom_index_akshare
    section: activity_production
    label_en: "Enterprise Boom Index"
    label_zh: "企业景气指数"
    unit: "Index"
    fetcher: akshare_table
    function: macro_china_enterprise_boom_index
    date_column: "季度"
    value_column: "企业景气指数-指数"
    series: "macro_china_enterprise_boom_index:企业景气指数-指数"
    source_name: "AKShare / Eastmoney Data Center"
    source_url: "https://www.akshare.xyz/data/macro/macro.html"
    frequency: "quarterly"
    caveat_en: "Quarterly enterprise boom index via AKShare's Eastmoney wrapper; useful as a business-cycle sentiment cross-check, not a production-volume measure."
    caveat_zh: "AKShare东方财富包装的季度企业景气指数；适合作为商业周期情绪交叉验证，不是产量指标。"
  - id: baltic_dry_index_akshare
    section: activity_production
    label_en: "Baltic Dry Index"
    label_zh: "波罗的海干散货指数"
    unit: "Index"
    fetcher: akshare_table
    function: macro_china_freight_index
    date_column: "截止日期"
    value_column: "波罗的海综合运价指数BDI"
    series: "macro_china_freight_index:波罗的海综合运价指数BDI"
    source_name: "AKShare / Eastmoney Data Center"
    source_url: "https://www.akshare.xyz/data/macro/macro.html"
    frequency: "daily"
    caveat_en: "Global dry-bulk freight index exposed through AKShare; use as a shipping/commodity-cycle cross-check rather than a China-only freight series."
    caveat_zh: "AKShare包装的全球干散货运价指数；适合作为航运/商品周期交叉验证，不是中国专属货运指标。"
  - id: gfcf_share_gdp
    section: investment
    label_en: "Gross Fixed Capital Formation"
    label_zh: "固定资本形成总额"
    unit: "% of GDP"
    fetcher: world_bank
    series: "NE.GDI.FTOT.ZS"
    source_name: "World Bank WDI"
    source_url: "https://api.worldbank.org/v2/country/CHN/indicator/NE.GDI.FTOT.ZS"
    frequency: "annual"
    caveat_en: "National-accounts investment share; not the same as NBS fixed asset investment growth."
    caveat_zh: "国民账户投资占比；不同于NBS固定资产投资增速。"
  - id: fixed_asset_investment_yoy_akshare
    section: investment
    label_en: "Fixed Asset Investment, YoY"
    label_zh: "固定资产投资同比"
    unit: "%"
    fetcher: akshare_table
    function: macro_china_gdzctz
    date_column: "月份"
    value_column: "同比增长"
    series: "macro_china_gdzctz:同比增长"
    source_name: "AKShare / Eastmoney Data Center"
    source_url: "https://www.akshare.xyz/data/macro/macro.html"
    frequency: "monthly"
    caveat_en: "Headline fixed-asset investment growth from AKShare's Eastmoney wrapper; sector/project detail remains a separate NBS-native gap."
    caveat_zh: "AKShare东方财富包装的固定资产投资总量增速；行业和项目细项仍属于NBS原生数据缺口。"
  - id: nominal_residential_property_price_bis
    section: real_estate
    label_en: "Residential Property Prices"
    label_zh: "住宅价格指数"
    unit: "Index 2010=100"
    fetcher: fred_graph_csv
    series: "QCNN628BIS"
    source_name: "FRED / BIS Residential Property Price Database"
    source_url: "https://fred.stlouisfed.org/series/QCNN628BIS"
    frequency: "quarterly"
    caveat_en: "BIS residential property price database; coverage shifts from new dwellings in 70 cities to existing buildings from 2016, so the level break matters."
    caveat_zh: "BIS住宅价格数据库；2016年前后口径从70城新建住宅转向既有建筑，需注意水平断点。"
  - id: real_residential_property_price_bis
    section: real_estate
    label_en: "Real Residential Property Prices"
    label_zh: "实际住宅价格指数"
    unit: "Index 2010=100"
    fetcher: fred_graph_csv
    series: "QCNR628BIS"
    source_name: "FRED / BIS Residential Property Price Database"
    source_url: "https://fred.stlouisfed.org/series/QCNR628BIS"
    frequency: "quarterly"
    caveat_en: "BIS CPI-deflated residential property price series; useful for cycle pressure, but not a replacement for NBS 70-city price details."
    caveat_zh: "BIS经CPI平减的住宅价格序列；适合观察周期压力，但不能替代NBS 70城房价分项。"
  - id: beijing_new_home_price_yoy_akshare
    section: real_estate
    label_en: "Beijing New Home Prices, YoY"
    label_zh: "北京新建商品住宅价格同比"
    unit: "%"
    transform: "index_100_to_yoy"
    fetcher: akshare_table
    function: macro_china_new_house_price
    kwargs:
      city_first: "北京"
      city_second: "上海"
    filter_column: "城市"
    filter_value: "北京"
    date_column: "日期"
    value_column: "新建商品住宅价格指数-同比"
    series: "macro_china_new_house_price:北京:新建商品住宅价格指数-同比"
    source_name: "AKShare / Eastmoney Data Center"
    source_url: "https://www.akshare.xyz/data/macro/macro.html"
    frequency: "monthly"
    caveat_en: "Selected-city NBS-style price index via AKShare, transformed from index level where year-ago=100 into YoY percentage; not a national 70-city aggregate."
    caveat_zh: "AKShare包装的城市样本房价指数，由上年同月=100转换为同比百分比；不是全国70城总指数。"
  - id: shanghai_new_home_price_yoy_akshare
    section: real_estate
    label_en: "Shanghai New Home Prices, YoY"
    label_zh: "上海新建商品住宅价格同比"
    unit: "%"
    transform: "index_100_to_yoy"
    fetcher: akshare_table
    function: macro_china_new_house_price
    kwargs:
      city_first: "北京"
      city_second: "上海"
    filter_column: "城市"
    filter_value: "上海"
    date_column: "日期"
    value_column: "新建商品住宅价格指数-同比"
    series: "macro_china_new_house_price:上海:新建商品住宅价格指数-同比"
    source_name: "AKShare / Eastmoney Data Center"
    source_url: "https://www.akshare.xyz/data/macro/macro.html"
    frequency: "monthly"
    caveat_en: "Selected-city NBS-style price index via AKShare, transformed from index level where year-ago=100 into YoY percentage; not a national 70-city aggregate."
    caveat_zh: "AKShare包装的城市样本房价指数，由上年同月=100转换为同比百分比；不是全国70城总指数。"
  - id: beijing_existing_home_price_yoy_akshare
    section: real_estate
    label_en: "Beijing Existing Home Prices, YoY"
    label_zh: "北京二手住宅价格同比"
    unit: "%"
    transform: "index_100_to_yoy"
    fetcher: akshare_table
    function: macro_china_new_house_price
    kwargs:
      city_first: "北京"
      city_second: "上海"
    filter_column: "城市"
    filter_value: "北京"
    date_column: "日期"
    value_column: "二手住宅价格指数-同比"
    series: "macro_china_new_house_price:北京:二手住宅价格指数-同比"
    source_name: "AKShare / Eastmoney Data Center"
    source_url: "https://www.akshare.xyz/data/macro/macro.html"
    frequency: "monthly"
    caveat_en: "Selected-city existing-home price index via AKShare; Beijing/Shanghai samples help read property stress but do not replace full 70-city details."
    caveat_zh: "AKShare包装的城市二手住宅价格样本；北京/上海样本有助于观察地产压力，但不能替代完整70城细项。"
  - id: shanghai_existing_home_price_yoy_akshare
    section: real_estate
    label_en: "Shanghai Existing Home Prices, YoY"
    label_zh: "上海二手住宅价格同比"
    unit: "%"
    transform: "index_100_to_yoy"
    fetcher: akshare_table
    function: macro_china_new_house_price
    kwargs:
      city_first: "北京"
      city_second: "上海"
    filter_column: "城市"
    filter_value: "上海"
    date_column: "日期"
    value_column: "二手住宅价格指数-同比"
    series: "macro_china_new_house_price:上海:二手住宅价格指数-同比"
    source_name: "AKShare / Eastmoney Data Center"
    source_url: "https://www.akshare.xyz/data/macro/macro.html"
    frequency: "monthly"
    caveat_en: "Selected-city existing-home price index via AKShare; Beijing/Shanghai samples help read property stress but do not replace full 70-city details."
    caveat_zh: "AKShare包装的城市二手住宅价格样本；北京/上海样本有助于观察地产压力，但不能替代完整70城细项。"
  - id: household_consumption_growth
    section: consumption
    label_en: "Household Consumption Growth"
    label_zh: "居民消费增长"
    unit: "%"
    fetcher: world_bank
    series: "NE.CON.PRVT.KD.ZG"
    source_name: "World Bank WDI"
    source_url: "https://api.worldbank.org/v2/country/CHN/indicator/NE.CON.PRVT.KD.ZG"
    frequency: "annual"
    caveat_en: "National-accounts household consumption; not directly comparable to retail sales."
    caveat_zh: "国民账户居民消费；与社零口径不可直接等同。"
  - id: household_consumption_share
    section: consumption
    label_en: "Household Consumption Share"
    label_zh: "居民消费占GDP比重"
    unit: "% of GDP"
    fetcher: world_bank
    series: "NE.CON.PRVT.ZS"
    source_name: "World Bank WDI"
    source_url: "https://api.worldbank.org/v2/country/CHN/indicator/NE.CON.PRVT.ZS"
    frequency: "annual"
    caveat_en: "Useful for rebalancing, but too low-frequency for near-term consumption momentum."
    caveat_zh: "适合观察再平衡，但频率太低，不适合捕捉短期消费动能。"
  - id: retail_sales_yoy_akshare
    section: consumption
    label_en: "Retail Sales, YoY"
    label_zh: "社会消费品零售同比"
    unit: "%"
    fetcher: akshare_table
    function: macro_china_consumer_goods_retail
    date_column: "月份"
    value_column: "同比增长"
    series: "macro_china_consumer_goods_retail:同比增长"
    source_name: "AKShare / Eastmoney Data Center"
    source_url: "https://www.akshare.xyz/data/macro/macro.html"
    frequency: "monthly"
    caveat_en: "Monthly retail-sales growth via AKShare's Eastmoney wrapper; retail sales are not the same concept as national-accounts household consumption."
    caveat_zh: "AKShare东方财富包装的月度社零增速；社零并不等同于国民账户居民消费。"
  - id: consumer_confidence_index_akshare
    section: consumption
    label_en: "Consumer Confidence Index"
    label_zh: "消费者信心指数"
    unit: "Index"
    fetcher: akshare_table
    function: macro_china_xfzxx
    date_column: "月份"
    value_column: "消费者信心指数-指数值"
    series: "macro_china_xfzxx:消费者信心指数-指数值"
    source_name: "AKShare / Eastmoney Data Center"
    source_url: "https://www.akshare.xyz/data/macro/macro.html"
    frequency: "monthly"
    caveat_en: "Consumer confidence index via AKShare's Eastmoney wrapper; use alongside retail sales because survey sentiment can diverge from realized spending."
    caveat_zh: "AKShare东方财富包装的消费者信心指数；应与社零一起使用，因为调查情绪可能与实际支出分化。"
  - id: consumer_expectations_index_akshare
    section: consumption
    label_en: "Consumer Expectations Index"
    label_zh: "消费者预期指数"
    unit: "Index"
    fetcher: akshare_table
    function: macro_china_xfzxx
    date_column: "月份"
    value_column: "消费者预期指数-指数值"
    series: "macro_china_xfzxx:消费者预期指数-指数值"
    source_name: "AKShare / Eastmoney Data Center"
    source_url: "https://www.akshare.xyz/data/macro/macro.html"
    frequency: "monthly"
    caveat_en: "Consumer expectations index via AKShare's Eastmoney wrapper; levels are survey-based and should be read directionally."
    caveat_zh: "AKShare东方财富包装的消费者预期指数；属于调查型指标，水平值应方向性解读。"
  - id: current_account_gdp
    section: external
    label_en: "Current Account Balance"
    label_zh: "经常账户差额"
    unit: "% of GDP"
    fetcher: world_bank
    series: "BN.CAB.XOKA.GD.ZS"
    source_name: "World Bank WDI"
    source_url: "https://api.worldbank.org/v2/country/CHN/indicator/BN.CAB.XOKA.GD.ZS"
    frequency: "annual"
    caveat_en: "Annual BOP ratio; SAFE quarterly BOP is the preferred higher-frequency source."
    caveat_zh: "年度国际收支占比；更高频应优先使用SAFE季度国际收支。"
  - id: exports_goods_services
    section: external
    label_en: "Exports of Goods & Services"
    label_zh: "货物与服务出口"
    unit: "USD"
    transform: "usd_trn"
    fetcher: world_bank
    series: "BX.GSR.GNFS.CD"
    source_name: "World Bank WDI"
    source_url: "https://api.worldbank.org/v2/country/CHN/indicator/BX.GSR.GNFS.CD"
    frequency: "annual"
    caveat_en: "Annual national-accounts goods and services exports; customs monthly goods trade is the preferred high-frequency source."
    caveat_zh: "年度国民账户货物与服务出口；更高频应优先使用海关月度货物贸易。"
  - id: imports_goods_services
    section: external
    label_en: "Imports of Goods & Services"
    label_zh: "货物与服务进口"
    unit: "USD"
    transform: "usd_trn"
