name: "Nigeria"
name_zh: "尼日利亚"
code: "NG"
iso2: "NG"
subtitle_en: "A data-first macro page for Nigeria built from DBnomics (IMF IFS & FSI), IMF DataMapper, World Bank WDI, FRED, and Bruegel REER."
subtitle_zh: "基于DBnomics (IMF IFS与FSI)、IMF DataMapper、世界银行WDI、FRED与Bruegel实际有效汇率构建的尼日利亚数据优先宏观页面。"
min_chart_count: 20

sections:
  growth_accounts:
    title_en: "GDP & Sector Value Added"
    title_zh: "GDP与行业增加值"
    report_logic_en: "Official real GDP growth trajectories and sector value added dynamics (industry, agriculture, services) from IMF DataMapper and World Bank WDI."
    report_logic_zh: "基于IMF DataMapper与世界银行WDI的实际GDP增速及行业增加值动态（工业、农业、服务业）。"
  labour_wages:
    title_en: "Labour Market"
    title_zh: "劳动力市场"
    report_logic_en: "National modeled unemployment rate tracking labor force utilization."
    report_logic_zh: "国际劳工组织/世界银行模型估算的全国失业率。"
  prices_costs:
    title_en: "Prices & Inflation"
    title_zh: "价格与通胀"
    report_logic_en: "Official headline CPI inflation rate and index base from IMF International Financial Statistics."
    report_logic_zh: "IMF国际金融统计(IFS)公布的尼日利亚官方总体CPI通胀同比率与价格基数。"
  external_fx:
    title_en: "External Sector, FX & Remittances"
    title_zh: "外部部门、汇率与侨汇"
    report_logic_en: "USD/NGN official exchange rate, Bruegel REER/NEER, workers' personal remittances (% of GDP), and quarterly BPM6 Current Account Balance."
    report_logic_zh: "美元兑尼日利亚奈拉官方汇率、Bruegel实际与名义有效汇率、海外劳工侨汇占GDP比重以及季度BPM6经常账户差额。"
  fiscal_sovereign:
    title_en: "Fiscal & Public Debt"
    title_zh: "财政与主权债务"
    report_logic_en: "General government gross debt, fiscal deficit, and primary balance ratios from IMF DataMapper, alongside gross foreign exchange reserves."
    report_logic_zh: "IMF DataMapper提供的广义政府总债务、财政赤字与初级收支比率，配合官方外汇储备总额。"
  monetary_financial:
    title_en: "Monetary, Credit & Commodities"
    title_zh: "货币、利率与大宗商品"
    report_logic_en: "Central Bank of Nigeria Monetary Policy Rate (MPR), commercial lending and deposit rates, broad money growth, domestic private credit, and Brent crude benchmark pricing."
    report_logic_zh: "尼日利亚央行货币政策利率(MPR)、商业存贷款利率、广义货币增速、国内私营部门信贷与布伦特原油基准价格。"
  stability_structural:
    title_en: "Financial Stability"
    title_zh: "金融稳定与银行体系"
    report_logic_en: "Banking sector regulatory capital adequacy ratio (CAR) and non-performing loan ratio (NPL) from IMF Financial Soundness Indicators."
    report_logic_zh: "IMF金融稳健指标(FSI)提供的银行体系监管资本充足率(CAR)与不良贷款率(NPL)。"

indicators:
  # ==========================================
  # 1. Growth & National Accounts
  # ==========================================
  - id: real_gdp_growth
    section: growth_accounts
    label_en: Real GDP Growth (IMF WEO)
    label_zh: 实际GDP增速 (IMF)
    unit: "%"
    fetcher: imf_datamapper
    series: NGDP_RPCH/NGA
    actual_through: 2025
    source_name: IMF DataMapper (WEO)
    source_url: https://www.imf.org/external/datamapper/NGDP_RPCH/NGA
    frequency: annual
    start_date: 2000-01-01
    caveat_en: Annual percentage change in constant-price gross domestic product.
    caveat_zh: 按不变价格计算的国内生产总值年度变动百分比。

  - id: real_gdp_growth_wb
    section: growth_accounts
    label_en: Real GDP Growth (World Bank)
    label_zh: 实际GDP增速 (世行)
    unit: "%"
    fetcher: world_bank
    series: NY.GDP.MKTP.KD.ZG
    country_iso3: NGA
    source_name: World Bank WDI
    source_url: https://data.worldbank.org/indicator/NY.GDP.MKTP.KD.ZG?locations=NG
    frequency: annual
    start_date: 2000-01-01
    caveat_en: Annual percentage growth rate of GDP at market prices based on constant local currency.
    caveat_zh: 基于不变本币市场价格计算的GDP年度增长率。

  - id: industry_growth
    section: growth_accounts
    label_en: Industry Value Added Growth
    label_zh: 工业增加值年度增速 (含采掘与能源)
    unit: "%"
    fetcher: world_bank
    series: NV.IND.TOTL.KD.ZG
    country_iso3: NGA
    source_name: World Bank WDI
    source_url: https://data.worldbank.org/indicator/NV.IND.TOTL.KD.ZG?locations=NG
    frequency: annual
    start_date: 2000-01-01
    caveat_en: Annual growth rate for industrial value added including mining and quarrying.
    caveat_zh: 包含采矿业与油气开采的工业增加值实际年增长率。

  - id: agriculture_growth
    section: growth_accounts
    label_en: Agriculture Value Added Growth
    label_zh: 农业增加值年度增速
    unit: "%"
    fetcher: world_bank
    series: NV.AGR.TOTL.KD.ZG
    country_iso3: NGA
    source_name: World Bank WDI
    source_url: https://data.worldbank.org/indicator/NV.AGR.TOTL.KD.ZG?locations=NG
    frequency: annual
    start_date: 2000-01-01
    caveat_en: Annual growth rate for agricultural value added.
    caveat_zh: 农业林业与渔业增加值实际年增长率。

  - id: services_growth
    section: growth_accounts
    label_en: Services Value Added Growth
    label_zh: 服务业增加值年度增速
    unit: "%"
    fetcher: world_bank
    series: NV.SRV.TOTL.KD.ZG
    country_iso3: NGA
    source_name: World Bank WDI
    source_url: https://data.worldbank.org/indicator/NV.SRV.TOTL.KD.ZG?locations=NG
    frequency: annual
    start_date: 2000-01-01
    caveat_en: Annual growth rate for services value added.
    caveat_zh: 服务业增加值实际年增长率。

  # ==========================================
  # 2. Labour Market
  # ==========================================
  - id: unemployment_rate
    section: labour_wages
    label_en: Unemployment Rate
    label_zh: 失业率
    unit: "%"
    fetcher: world_bank
    series: SL.UEM.TOTL.ZS
    country_iso3: NGA
    source_name: World Bank / ILO
    source_url: https://data.worldbank.org/indicator/SL.UEM.TOTL.ZS?locations=NG
    frequency: annual
    start_date: 2000-01-01
    caveat_en: Total unemployment as a percentage of the total labor force (ILO modeled estimate).
    caveat_zh: 占总劳动力百分比的总失业率（国际劳工组织模型估算值）。

  # ==========================================
  # 3. Prices & Inflation
  # ==========================================
  - id: cpi_inflation
    section: prices_costs
    label_en: Headline CPI Inflation YoY
    label_zh: 总体CPI通胀同比
    unit: "% y/y"
    fetcher: imf_sdmx
    dataflow: CPI
    series: NGA.CPI._T.YOY_PCH_PA_PT.M
    source_name: IMF SDMX / Nigeria NBS
    source_url: https://api.imf.org/external/sdmx/2.1/data/CPI/NGA.CPI._T.YOY_PCH_PA_PT.M
    frequency: monthly
    start_date: 2010-01-01
    caveat_en: Year-on-year percentage change in official Consumer Price Index reported via IMF CPI.
    caveat_zh: 尼日利亚国家统计局(NBS)向IMF报送的月度消费者物价指数同比变动率。

  - id: cpi_inflation_mom
    section: prices_costs
    label_en: Headline CPI Inflation MoM
    label_zh: 总体CPI通胀环比
    unit: "% m/m"
    fetcher: imf_sdmx
    dataflow: CPI
    series: NGA.CPI._T.POP_PCH_PA_PT.M
    source_name: IMF SDMX / Nigeria NBS
    source_url: https://api.imf.org/external/sdmx/2.1/data/CPI/NGA.CPI._T.POP_PCH_PA_PT.M
    frequency: monthly
    start_date: 2010-01-01
    caveat_en: Month-on-month percentage change in official Consumer Price Index.
    caveat_zh: 月度消费者物价指数环比变动率。

  - id: cpi_index
    section: prices_costs
    label_en: Headline Consumer Price Index
    label_zh: 总体消费价格指数基数
    unit: "Index"
    fetcher: imf_sdmx
    dataflow: CPI
    series: NGA.CPI._T.IX.M
    source_name: IMF SDMX / Nigeria NBS
    source_url: https://api.imf.org/external/sdmx/2.1/data/CPI/NGA.CPI._T.IX.M
    frequency: monthly
    start_date: 2010-01-01
    caveat_en: Consumer Price Index (All items) monthly index level.
    caveat_zh: 总体消费者物价指数月度定基指数。

  - id: cpi_inflation_weo
    section: prices_costs
    label_en: Headline Inflation (IMF WEO Cross-Check)
    label_zh: 总体通胀率 (IMF WEO交叉核对)
    unit: "%"
    fetcher: imf_datamapper
    series: PCPIPCH/NGA
    actual_through: 2025
    source_name: IMF DataMapper (WEO)
    source_url: https://www.imf.org/external/datamapper/PCPIPCH/NGA
    frequency: annual
    start_date: 2000-01-01
    caveat_en: Annual average consumer price inflation rate from IMF World Economic Outlook.
    caveat_zh: IMF《世界经济展望》提供的年均消费者物价通胀率。

  # ==========================================
  # 4. External Sector, FX & Remittances
  # ==========================================
  - id: usd_ngn
    section: external_fx
    label_en: USD/NGN Official Daily Central Rate (CBN NFEM)
    label_zh: 美元兑尼日利亚奈拉官方日度中间价 (CBN)
    unit: "NGN"
    fetcher: cbn_fx
    currency: "US DOLLAR"
    rate_field: centralrate
    source_authority: official_primary
    source_name: Central Bank of Nigeria (CBN)
    source_url: https://www.cbn.gov.ng/rates/ExchRateByCurrency.asp
    frequency: daily
    start_date: 2010-01-01
    caveat_en: Official daily central exchange rate published directly by the Central Bank of Nigeria.
    caveat_zh: 尼日利亚中央银行(CBN)直接发布的美元兑奈拉官方日度中间汇率。

  - id: usd_ngn_ifs
    section: external_fx
    label_en: USD/NGN End-of-Period (IMF IFS Cross-Check)
    label_zh: 美元兑奈拉期末官方汇率 (IMF IFS核对)
    unit: "NGN"
    fetcher: dbnomics
    series: IMF/IFS/M.NG.ENDE_XDC_USD_RATE
    source_name: IMF / DBnomics (IFS)
    source_url: https://db.nomics.world/IMF/IFS/M.NG.ENDE_XDC_USD_RATE
    frequency: monthly
    start_date: 2010-01-01
    caveat_en: Monthly end-of-period national currency units per US dollar.
    caveat_zh: IMF国际金融统计公布的月末每美元兑奈拉官方汇率。

  - id: reer
    section: external_fx
    label_en: Real Effective Exchange Rate (120 Partners)
    label_zh: 实际有效汇率 (REER 120国)
    unit: "2007=100"
    fetcher: bruegel_reer
    country: NG
    series_type: reer_120
    source_name: Bruegel (Darvas REER Dataset)
    source_url: https://www.bruegel.org/publications/datasets/real-effective-exchange-rates-for-178-countries-a-new-database
    frequency: monthly
    start_date: 2005-01-01
    caveat_en: CPI-deflated real effective exchange rate against 120 trading partners.
    caveat_zh: 基于CPI平减的对120个贸易伙伴的实际有效汇率。

  - id: neer
    section: external_fx
    label_en: Nominal Effective Exchange Rate (120 Partners)
    label_zh: 名义有效汇率 (NEER 120国)
    unit: "2007=100"
    fetcher: bruegel_reer
    country: NG
    series_type: neer_120
    source_name: Bruegel (Darvas REER Dataset)
    source_url: https://www.bruegel.org/publications/datasets/real-effective-exchange-rates-for-178-countries-a-new-database
    frequency: monthly
    start_date: 2005-01-01
    caveat_en: Trade-weighted nominal effective exchange rate against 120 trading partners.
    caveat_zh: 贸易加权名义有效汇率。

  - id: remittances_gdp
    section: external_fx
    label_en: Personal Remittances Received (% of GDP)
    label_zh: 个人侨汇收入占GDP比重
    unit: "% of GDP"
    fetcher: world_bank
    series: BX.TRF.PWKR.DT.GD.ZS
    country_iso3: NGA
    source_name: World Bank WDI
    source_url: https://data.worldbank.org/indicator/BX.TRF.PWKR.DT.GD.ZS?locations=NG
    frequency: annual
    start_date: 2000-01-01
    caveat_en: Personal transfers received comprised of all current transfers from nonresident households.
    caveat_zh: 尼日利亚海外侨民汇回本国的个人侨汇占GDP比重。

  - id: remittances_usd
    section: external_fx
    label_en: Secondary Income / Remittances Balance (USD Millions)
    label_zh: 二次收入(海外侨汇)净额 (百万美元)
    unit: "USD mn"
    fetcher: imf_sdmx
    dataflow: BOP
    series: NGA.NETCD_T.IN2.USD.Q
    scale: 1000000
    source_name: IMF SDMX / CBN
    source_url: https://api.imf.org/external/sdmx/2.1/data/BOP/NGA.NETCD_T.IN2.USD.Q
    frequency: quarterly
    start_date: 2005-01-01
    caveat_en: Quarterly BPM6 secondary income net balance (primarily diaspora remittances) in millions of US dollars.
    caveat_zh: BPM6季度二次收入（主要由海外侨民汇款构成）净差额（百万美元）。

  - id: current_account_usd
    section: external_fx
    label_en: Current Account Balance (USD Millions)
    label_zh: 经常账户差额 (百万美元)
    unit: "USD mn"
    fetcher: imf_sdmx
    dataflow: BOP
    series: NGA.NETCD_T.CAB.USD.Q
    scale: 1000000
    source_name: IMF SDMX / CBN
    source_url: https://api.imf.org/external/sdmx/2.1/data/BOP/NGA.NETCD_T.CAB.USD.Q
    frequency: quarterly
    start_date: 2005-01-01
    caveat_en: Quarterly BPM6 current account balance in millions of US dollars.
    caveat_zh: BPM6季度经常账户净差额（百万美元）。

  - id: goods_trade_balance
    section: external_fx
    label_en: Goods Trade Balance (USD Millions)
    label_zh: 货物贸易差额 (百万美元)
    unit: "USD mn"
    fetcher: imf_sdmx
    dataflow: BOP
    series: NGA.NETCD_T.G.USD.Q
    scale: 1000000
    source_name: IMF SDMX / CBN
    source_url: https://api.imf.org/external/sdmx/2.1/data/BOP/NGA.NETCD_T.G.USD.Q
    frequency: quarterly
    start_date: 2005-01-01
    caveat_en: Net balance of merchandise exports minus imports (BPM6, USD millions).
    caveat_zh: 货物出口减去进口净额（BPM6标准，百万美元）。

  - id: goods_exports
    section: external_fx
    label_en: Goods Exports (BOP Basis, USD Millions)
    label_zh: 货物出口总额 (BOP口径，百万美元)
    unit: "USD mn"
    fetcher: imf_sdmx
    dataflow: BOP
    series: NGA.CD_T.G.USD.Q
    scale: 1000000
    source_name: IMF SDMX / CBN
    source_url: https://api.imf.org/external/sdmx/2.1/data/BOP/NGA.CD_T.G.USD.Q
    frequency: quarterly
    start_date: 2005-01-01
    caveat_en: Quarterly BPM6 merchandise exports credit in millions of US dollars (dominated by crude oil and LNG).
    caveat_zh: BPM6季度货物出口总额（主要由原油及液化天然气构成，百万美元）。

  - id: goods_imports
    section: external_fx
    label_en: Goods Imports (BOP Basis, USD Millions)
    label_zh: 货物进口总额 (BOP口径，百万美元)
    unit: "USD mn"
    fetcher: imf_sdmx
    dataflow: BOP
    series: NGA.DB_T.G.USD.Q
    scale: 1000000
    source_name: IMF SDMX / CBN
    source_url: https://api.imf.org/external/sdmx/2.1/data/BOP/NGA.DB_T.G.USD.Q
    frequency: quarterly
    start_date: 2005-01-01
    caveat_en: Quarterly BPM6 merchandise imports debit in millions of US dollars.
    caveat_zh: BPM6季度货物进口总额（百万美元）。

  - id: services_balance
    section: external_fx
    label_en: Services Trade Balance (USD Millions)
    label_zh: 服务贸易差额 (百万美元)
    unit: "USD mn"
    fetcher: imf_sdmx
    dataflow: BOP
    series: NGA.NETCD_T.S.USD.Q
    scale: 1000000
    source_name: IMF SDMX / CBN
    source_url: https://api.imf.org/external/sdmx/2.1/data/BOP/NGA.NETCD_T.S.USD.Q
    frequency: quarterly
    start_date: 2005-01-01
    caveat_en: Quarterly BPM6 services trade balance in millions of US dollars.
    caveat_zh: BPM6季度服务贸易净差额（百万美元）。

  - id: fdi_net_usd
    section: external_fx
    label_en: Direct Investment Net Balance (FDI, USD Millions)
    label_zh: 直接投资净额 (FDI，百万美元)
    unit: "USD mn"
    fetcher: imf_sdmx
    dataflow: BOP
    series: NGA.NNAFANIL_T.D_F.USD.Q
    scale: 1000000
    source_name: IMF SDMX / CBN
    source_url: https://api.imf.org/external/sdmx/2.1/data/BOP/NGA.NNAFANIL_T.D_F.USD.Q
    frequency: quarterly
    start_date: 2005-01-01
    caveat_en: Quarterly BPM6 direct investment net acquisition of financial assets less incurrence of liabilities.
    caveat_zh: BPM6金融账户季度直接投资净额（百万美元）。

  - id: current_account_gdp
    section: external_fx
    label_en: Current Account Balance (% of GDP)
    label_zh: 经常账户占GDP比重
    unit: "% of GDP"
    fetcher: imf_datamapper
    series: BCA_NGDPD/NGA
    actual_through: 2025
    source_name: IMF DataMapper (WEO)
    source_url: https://www.imf.org/external/datamapper/BCA_NGDPD/NGA
    frequency: annual
    start_date: 2000-01-01
    caveat_en: Current account balance expressed as a percentage of gross domestic product.
    caveat_zh: 经常账户差额占GDP比重。

  # ==========================================
  # 5. Fiscal & Sovereign
  # ==========================================
  - id: government_debt_gdp
    section: fiscal_sovereign
    label_en: General Government Gross Debt (% of GDP)
    label_zh: 广义政府总债务占GDP比重
    unit: "% of GDP"
    fetcher: imf_datamapper
    series: GGXWDG_NGDP/NGA
    actual_through: 2025
    source_name: IMF DataMapper (WEO)
    source_url: https://www.imf.org/external/datamapper/GGXWDG_NGDP/NGA
    frequency: annual
    start_date: 2000-01-01
    caveat_en: General government gross debt as a percentage of GDP.
    caveat_zh: 广义政府总债务占GDP比重。

  - id: fiscal_balance_gdp
    section: fiscal_sovereign
    label_en: Fiscal Balance (% of GDP)
    label_zh: 财政净借贷(赤字率)占GDP比重
    unit: "% of GDP"
    fetcher: imf_datamapper
    series: GGXCNL_NGDP/NGA
    actual_through: 2025
    source_name: IMF DataMapper (WEO)
    source_url: https://www.imf.org/external/datamapper/GGXCNL_NGDP/NGA
    frequency: annual
    start_date: 2000-01-01
    caveat_en: General government net lending/borrowing as a percentage of GDP.
    caveat_zh: 广义政府净借贷（赤字率）占GDP比重。

  - id: primary_balance_gdp
    section: fiscal_sovereign
    label_en: Primary Net Lending/Borrowing (% of GDP)
    label_zh: 初级财政收支占GDP比重
    unit: "% of GDP"
    fetcher: imf_datamapper
    series: GGXONLB_G01_GDP_PT/NGA
    actual_through: 2025
    source_name: IMF DataMapper (Fiscal Monitor)
    source_url: https://www.imf.org/external/datamapper/GGXONLB_G01_GDP_PT/NGA
    frequency: annual
    start_date: 2000-01-01
    caveat_en: Primary net lending/borrowing excluding net interest outlays.
    caveat_zh: 剔除净利息支出的初级财政收支占GDP比重。

  - id: fx_reserves
    section: fiscal_sovereign
    label_en: Official Reserve Assets (USD Millions)
    label_zh: 官方储备资产总额 (百万美元)
    unit: "USD mn"
    fetcher: dbnomics
    series: IMF/IFS/M.NG.RAFA_USD
    source_name: IMF / DBnomics (IFS)
    source_url: https://db.nomics.world/IMF/IFS/M.NG.RAFA_USD
    frequency: monthly
    start_date: 2010-01-01
    caveat_en: Official reserve assets in US dollars reported in IMF IFS.
    caveat_zh: 报送IMF国际金融统计的官方储备资产总额（百万美元）。

  # ==========================================
  # 6. Monetary, Credit & Commodities
  # ==========================================
  - id: policy_rate
    section: monetary_financial
    label_en: Central Bank Monetary Policy Rate (MPR)
    label_zh: 央行货币政策利率 (CBN MPR)
    unit: "%"
    fetcher: dbnomics
    series: IMF/IFS/M.NG.FPOLM_PA
    source_name: IMF / DBnomics (IFS)
    source_url: https://db.nomics.world/IMF/IFS/M.NG.FPOLM_PA
    frequency: monthly
    start_date: 2015-01-01
    caveat_en: Central Bank of Nigeria Monetary Policy Rate reported in IFS.
    caveat_zh: 尼日利亚中央银行向IMF报送的货币政策基准利率。

  - id: lending_rate
    section: monetary_financial
    label_en: Commercial Bank Prime Lending Rate
    label_zh: 商业银行优惠贷款利率
    unit: "%"
    fetcher: dbnomics
    series: IMF/IFS/M.NG.FILR_PA
