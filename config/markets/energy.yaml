     derivation: derived, op: zscore, window: 156, inputs: [cftc_wti_mm_net], frequency: weekly,
     caveat_en: "Current net position relative to the trailing 156-week mean and standard deviation.", caveat_zh: "当前净持仓相对过去156周均值与标准差的位置。"}
  - {id: cftc_wti_ice_mm_net, section: positioning, label_en: "WTI (ICE) Managed-Money Net Position", label_zh: "WTI（ICE）管理基金净持仓", unit: contracts,
