     source_name: CFTC Commitments of Traders (disaggregated), source_url: "https://publicreporting.cftc.gov/stories/s/r4w3-av2u",
     caveat_en: "NYMEX RBOB gasoline.", caveat_zh: "NYMEX RBOB汽油。"}
  - {id: cftc_ulsd_mm_net, section: positioning, label_en: "ULSD (Heating Oil) Managed-Money Net Position", label_zh: "超低硫柴油管理基金净持仓", unit: contracts,
