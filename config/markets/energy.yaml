    status_zh: EIA的期货曲线序列（RCLC1-4）已于2024-04-05后停更；CME与ICE曲线为授权数据。
  - section: gas_lng
    item_en: Daily TTF
    item_zh: 日度TTF
    status_en: TTF is ICE Endex licensed.
    status_zh: TTF为ICE Endex授权数据。
  - section: power_coal
    item_en: EU carbon (EUA) price
    item_zh: 欧盟碳价（EUA）
