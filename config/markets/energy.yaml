# Energy market page (scope ENERGY, framework market_energy).
#
# Every chart is either an observed series from the named source or a
# `derivation: derived` series computed by a whitelisted operator from series
# on this page (src/country_primer/derived.py). Licensed data (ICE/CME curves,
# TTF daily, Platts/Argus, tanker rates) is listed under data_gaps.
# `view: core` marks the key charts shown first; the rest are under "All charts".

name: "Energy"
name_zh: "能源"
code: "ENERGY"
iso2: "ENERGY"
framework: market_energy
subtitle_en: "Global energy markets for macro: crude and products, gas and LNG, European power, supply, demand, inventories, positioning and the pass-through to inflation. Sources: EIA (incl. the Short-Term Energy Outlook), IMF (via FRED), GIE AGSI+, Ember, CFTC, energy-charts (SMARD), CBOE and the US Treasury."
subtitle_zh: "面向宏观的全球能源市场：原油与成品油、天然气与LNG、欧洲电力、供给、需求、库存、持仓以及向通胀的传导。数据来源：EIA（含短期能源展望）、IMF（经FRED）、GIE AGSI+、Ember、CFTC、energy-charts（SMARD）、CBOE与美国财政部。"
min_chart_count: 35
core_view_label_en: "Key charts"
core_view_label_zh: "核心图表"

# Cross-economy panels computed from other scopes' canonical frames (src/country_primer/transmission.py).
panels:
  - {type: energy_passthrough, section: macro_transmission, input: brent_spot}
  - {type: oil_shock_cpi, section: macro_transmission, input: brent_spot, shock_pct: 10, lags: 6, sample_start: "2015-01"}

sections:
  crude_benchmarks:
    title_en: "Crude Benchmarks"
    title_zh: "原油基准"
    report_logic_en: "Price levels, regional spreads (Brent–WTI, sweet–sour Brent–Dubai) and implied volatility. Free term-structure data is not available: WTI/Brent curves are CME/ICE licensed."
    report_logic_zh: "价格水平、地区价差（Brent–WTI、轻重质Brent–Dubai）与隐含波动率。WTI/Brent期限结构为CME/ICE授权数据，暂无免费来源。"
  refining_products:
    title_en: "Refining & Products"
    title_zh: "炼化与成品油"
    report_logic_en: "Crack spreads and refinery runs set product prices; retail gasoline and diesel are the most direct channel into CPI and freight costs."
    report_logic_zh: "裂解价差与炼厂开工决定成品油价格；零售汽柴油是进入CPI与运费成本最直接的渠道。"
  gas_lng:
    title_en: "Natural Gas & LNG"
    title_zh: "天然气与LNG"
    report_logic_en: "The three regional gas prices, and US and EU storage against their five-year seasonal norms (GIE AGSI+ for Europe)."
    report_logic_zh: "三大区域气价，以及美国与欧盟储气相对五年季节常态的偏离（欧洲数据来自GIE AGSI+）。"
  power_coal:
    title_en: "Power, Coal & Uranium"
    title_zh: "电力、煤炭与铀"
    report_logic_en: "European day-ahead power (daily mean of the auction), the monthly generation mix (Ember), thermal coal and uranium."
    report_logic_zh: "欧洲日前电价（日内拍卖均价）、月度发电结构（Ember）、动力煤与铀。"
  supply:
    title_en: "Supply"
    title_zh: "供给"
    report_logic_en: "US field production (weekly and monthly), and from EIA's Short-Term Energy Outlook: OPEC and OPEC+ crude output, OPEC spare capacity, major producers and world liquids supply. STEO figures for other countries are EIA estimates; STEO forecasts are not shown."
    report_logic_zh: "美国原油产量（周度与月度），以及来自EIA短期能源展望（STEO）的OPEC与OPEC+原油产量、OPEC闲置产能、主要产油国与全球液体燃料供给。STEO中其他国家的数据为EIA估计值；不显示STEO预测。"
  demand:
    title_en: "Demand"
    title_zh: "需求"
    report_logic_en: "US product supplied (apparent demand), four-week averages smooth weekly noise; world, China and India liquid fuels consumption from EIA STEO (monthly)."
    report_logic_zh: "美国油品表观消费（产品供应量），以四周均值平滑周度噪音；全球、中国与印度液体燃料消费来自EIA STEO（月度）。"
  inventories:
    title_en: "Inventories"
    title_zh: "库存"
    report_logic_en: "US crude, Cushing, SPR, gasoline and distillate stocks, with deviations from the five-year seasonal average and distillate days of cover; OECD commercial stocks and the global implied stock change from EIA STEO."
    report_logic_zh: "美国原油、库欣、战略储备、汽油与馏分油库存，以及相对五年季节均值的偏离和馏分油可用天数；OECD商业库存与全球隐含库存变化来自EIA STEO。"
  trade_geography:
    title_en: "Trade"
    title_zh: "贸易"
    report_logic_en: "US crude exports and net imports (weekly)."
    report_logic_zh: "美国原油出口与净进口（周度）。"
  positioning:
    title_en: "Positioning (CFTC)"
    title_zh: "持仓（CFTC）"
    report_logic_en: "Managed-money net futures positions from the disaggregated Commitments of Traders, queried by contract code."
    report_logic_zh: "CFTC分类持仓报告中管理基金的期货净持仓，按合约代码查询。"
  macro_transmission:
    title_en: "Macro Transmission"
    title_zh: "宏观传导"
    report_logic_en: "From crude to retail fuel, US energy CPI and inflation compensation (5Y breakeven, 5y5y forward)."
    report_logic_zh: "从原油到零售燃油、美国能源CPI与通胀补偿（5年盈亏平衡、5年后5年远期）。"

  model_inputs:
    title_en: "Model Inputs: Official Energy Weights"
    title_zh: "模型输入：官方能源权重"
    report_logic_en: "Basket weights of energy in each consumer price index, used by the oil-shock model in Macro Transmission."
    report_logic_zh: "各国消费价格指数中能源的篮子权重，供宏观传导版块的油价冲击模型使用。"

indicators:
  # ------------------------------------------------------------ crude_benchmarks
  - {id: brent_spot, section: crude_benchmarks, view: core, label_en: "Brent Spot (FOB)", label_zh: "布伦特现货", unit: USD/bbl,
     fetcher: eia_xls, source_authority: official_primary, series: pet/RBRTE, frequency: daily, start_date: 2015-01-01,
     source_name: EIA spot prices, source_url: "https://www.eia.gov/dnav/pet/pet_pri_spt_s1_d.htm",
     caveat_en: "Europe Brent spot price FOB, daily; EIA publishes with a lag of one to two business days.",
     caveat_zh: "欧洲布伦特离岸现货价，日度；EIA发布滞后一到两个工作日。"}
  - {id: wti_spot, section: crude_benchmarks, view: core, label_en: "WTI Spot (Cushing)", label_zh: "WTI现货（库欣）", unit: USD/bbl,
     fetcher: eia_xls, source_authority: official_primary, series: pet/RWTC, frequency: daily, start_date: 2015-01-01,
     source_name: EIA spot prices, source_url: "https://www.eia.gov/dnav/pet/pet_pri_spt_s1_d.htm",
     caveat_en: "Cushing, OK WTI spot price FOB, daily.", caveat_zh: "俄克拉荷马州库欣WTI现货价，日度。"}
  - {id: brent_front_futures, section: crude_benchmarks, label_en: "Brent Front-Month Futures (same day)", label_zh: "布伦特近月期货（当日）", unit: USD/bbl,
     fetcher: foreign_futures, series: OIL, frequency: daily, start_date: 2015-01-01, source_authority: public_wrapper,
     source_name: "Sina Finance via AKShare", source_url: "https://finance.sina.com.cn/futuremarket/",
     caveat_en: "Completed sessions only, from a public wrapper; the EIA spot series is the verified reference.",
     caveat_zh: "仅保留已收盘交易日，来自公开封装接口；EIA现货为核验基准。"}
  - {id: wti_front_futures, section: crude_benchmarks, label_en: "WTI Front-Month Futures (same day)", label_zh: "WTI近月期货（当日）", unit: USD/bbl,
     fetcher: foreign_futures, series: CL, frequency: daily, start_date: 2015-01-01, source_authority: public_wrapper,
     source_name: "Sina Finance via AKShare", source_url: "https://finance.sina.com.cn/futuremarket/",
     caveat_en: "Completed sessions only, from a public wrapper.", caveat_zh: "仅保留已收盘交易日，来自公开封装接口。"}
  - {id: dubai_monthly, section: crude_benchmarks, label_en: "Dubai Crude (monthly average)", label_zh: "迪拜原油月均价", unit: USD/bbl,
     fetcher: fred, series: POILDUBUSDM, frequency: monthly, start_date: 2005-01-01,
     source_name: IMF Primary Commodity Prices via FRED, source_url: "https://fred.stlouisfed.org/series/POILDUBUSDM",
     caveat_en: "Monthly average; the Middle East sour benchmark for Asian crude imports.", caveat_zh: "月均价；亚洲原油进口的中东含硫基准。"}
  - {id: brent_wti_spread, section: crude_benchmarks, view: core, label_en: "Brent–WTI Spread", label_zh: "Brent–WTI价差", unit: USD/bbl,
     derivation: derived, op: spread, inputs: [brent_spot, wti_spot], frequency: daily,
     caveat_en: "Seaborne vs inland US crude; widens with US export constraints.", caveat_zh: "海运原油与美国内陆原油的价差；美国出口受限时走阔。"}
  - {id: brent_dubai_spread, section: crude_benchmarks, label_en: "Brent–Dubai Spread (sweet–sour, monthly)", label_zh: "Brent–Dubai价差（轻重质，月度）", unit: USD/bbl,
     derivation: derived, op: spread, inputs: ["brent_spot@monthly_mean", dubai_monthly], frequency: monthly,
     caveat_en: "Monthly mean of daily Brent minus the IMF monthly Dubai average. Negative values mean sour crude trades above sweet.",
     caveat_zh: "布伦特日度价月均值减去IMF迪拜月均价。负值表示含硫原油价格高于低硫原油。"}
  - {id: brent_yoy, section: crude_benchmarks, label_en: "Brent YoY (monthly average)", label_zh: "布伦特同比（月均）", unit: "% y/y",
     derivation: derived, op: yoy_pct, inputs: ["brent_spot@monthly_mean"], frequency: monthly,
     caveat_en: "Year-on-year change of the monthly mean; the base-effect driver of headline energy inflation.",
     caveat_zh: "月均价的同比变动；总体能源通胀的基数效应来源。"}
  - {id: ovx, section: crude_benchmarks, view: core, label_en: "CBOE Crude Oil Volatility Index (OVX)", label_zh: "原油波动率指数OVX", unit: index,
     fetcher: fred, series: OVXCLS, frequency: daily, start_date: 2015-01-01,
     source_name: CBOE via FRED, source_url: "https://fred.stlouisfed.org/series/OVXCLS",
     caveat_en: "30-day implied volatility of USO options.", caveat_zh: "基于USO期权的30天隐含波动率。"}

  # ------------------------------------------------------------ refining_products
  - {id: nyh_gasoline_spot, section: refining_products, label_en: "NY Harbor Conventional Gasoline", label_zh: "纽约港常规汽油现货", unit: USD/gal,
     fetcher: eia_xls, source_authority: official_primary, series: pet/EER_EPMRU_PF4_Y35NY_DPG, frequency: daily, start_date: 2015-01-01,
     source_name: EIA spot prices, source_url: "https://www.eia.gov/dnav/pet/pet_pri_spt_s1_d.htm",
     caveat_en: "New York Harbor conventional regular gasoline spot price FOB.", caveat_zh: "纽约港常规普通汽油离岸现货价。"}
  - {id: nyh_ulsd_spot, section: refining_products, label_en: "NY Harbor Ultra-Low-Sulfur Diesel", label_zh: "纽约港超低硫柴油现货", unit: USD/gal,
     fetcher: eia_xls, source_authority: official_primary, series: pet/EER_EPD2DXL0_PF4_Y35NY_DPG, frequency: daily, start_date: 2015-01-01,
     source_name: EIA spot prices, source_url: "https://www.eia.gov/dnav/pet/pet_pri_spt_s1_d.htm",
     caveat_en: "New York Harbor ULSD No. 2 spot price FOB.", caveat_zh: "纽约港2号超低硫柴油离岸现货价。"}
  - {id: usgc_jet_spot, section: refining_products, label_en: "US Gulf Coast Kerosene-Type Jet Fuel", label_zh: "美湾航煤现货", unit: USD/gal,
     fetcher: eia_xls, source_authority: official_primary, series: pet/EER_EPJK_PF4_RGC_DPG, frequency: daily, start_date: 2015-01-01,
     source_name: EIA spot prices, source_url: "https://www.eia.gov/dnav/pet/pet_pri_spt_s1_d.htm",
     caveat_en: "US Gulf Coast kerosene-type jet fuel spot price FOB.", caveat_zh: "美国墨西哥湾航空煤油离岸现货价。"}
  - {id: crack_321, section: refining_products, view: core, label_en: "3-2-1 Crack Spread (NYH products vs WTI)", label_zh: "3-2-1裂解价差（纽约港 vs WTI）", unit: USD/bbl,
     derivation: derived, op: linear, weights: [28, 14, -1], inputs: [nyh_gasoline_spot, nyh_ulsd_spot, wti_spot], frequency: daily,
     caveat_en: "(2 × 42 × gasoline + 42 × ULSD − 3 × WTI) / 3, using NY Harbor spot products ($/gal × 42 gal/bbl).",
     caveat_zh: "(2×42×汽油 + 42×柴油 − 3×WTI)/3，使用纽约港成品油现货（美元/加仑×42加仑/桶）。"}
  - {id: diesel_crack, section: refining_products, view: core, label_en: "Diesel Crack (NYH ULSD vs Brent)", label_zh: "柴油裂解价差（纽约港柴油 vs Brent）", unit: USD/bbl,
     derivation: derived, op: linear, weights: [42, -1], inputs: [nyh_ulsd_spot, brent_spot], frequency: daily,
     caveat_en: "42 × ULSD − Brent. Diesel margins feed freight and food costs, a second-round inflation channel.",
     caveat_zh: "42×超低硫柴油 − 布伦特。柴油利润传导至运费与食品成本，是二轮通胀渠道。"}
  - {id: us_refinery_utilization, section: refining_products, label_en: "US Refinery Utilization", label_zh: "美国炼厂开工率", unit: "%",
     fetcher: eia_xls, source_authority: official_primary, series: pet/WPULEUS3, frequency: weekly, start_date: 2010-01-01,
     source_name: EIA Weekly Petroleum Status Report, source_url: "https://www.eia.gov/petroleum/supply/weekly/",
     caveat_en: "Percent utilization of operable crude distillation capacity.", caveat_zh: "可运行原油蒸馏能力的利用率。"}
  - {id: us_retail_gasoline, section: refining_products, view: core, label_en: "US Retail Gasoline (regular, all formulations)", label_zh: "美国零售汽油价（普通）", unit: USD/gal,
     fetcher: eia_xls, source_authority: official_primary, series: pet/EMM_EPMR_PTE_NUS_DPG, frequency: weekly, start_date: 2010-01-01,
     source_name: EIA Gasoline and Diesel Fuel Update, source_url: "https://www.eia.gov/petroleum/gasdiesel/",
     caveat_en: "Weekly US average pump price including taxes.", caveat_zh: "美国周度平均含税零售价。"}
  - {id: us_retail_diesel, section: refining_products, label_en: "US Retail Diesel", label_zh: "美国零售柴油价", unit: USD/gal,
     fetcher: eia_xls, source_authority: official_primary, series: pet/EMD_EPD2D_PTE_NUS_DPG, frequency: weekly, start_date: 2010-01-01,
     source_name: EIA Gasoline and Diesel Fuel Update, source_url: "https://www.eia.gov/petroleum/gasdiesel/",
     caveat_en: "Weekly US average on-highway diesel price including taxes.", caveat_zh: "美国周度公路柴油平均含税零售价。"}

  # ------------------------------------------------------------ gas_lng
  - {id: henry_hub_spot, section: gas_lng, view: core, label_en: "Henry Hub Natural Gas Spot", label_zh: "亨利港天然气现货", unit: USD/MMBtu,
     fetcher: eia_xls, source_authority: official_primary, series: ng/RNGWHHD, frequency: daily, start_date: 2015-01-01,
     source_name: EIA natural gas spot prices, source_url: "https://www.eia.gov/dnav/ng/ng_pri_fut_s1_d.htm",
     caveat_en: "Henry Hub, Louisiana, daily spot price.", caveat_zh: "路易斯安那州亨利港日度现货价。"}
  - {id: henry_hub_front_futures, section: gas_lng, label_en: "NYMEX Natural Gas Front Month (same day)", label_zh: "NYMEX天然气近月期货（当日）", unit: USD/MMBtu,
     fetcher: foreign_futures, series: NG, frequency: daily, start_date: 2015-01-01, source_authority: public_wrapper,
     source_name: "Sina Finance via AKShare", source_url: "https://finance.sina.com.cn/futuremarket/",
     caveat_en: "Completed sessions only, from a public wrapper.", caveat_zh: "仅保留已收盘交易日，来自公开封装接口。"}
  - {id: eu_gas_monthly, section: gas_lng, view: core, label_en: "European Natural Gas (monthly average)", label_zh: "欧洲天然气月均价", unit: USD/MMBtu,
     fetcher: fred, series: PNGASEUUSDM, frequency: monthly, start_date: 2005-01-01,
     source_name: IMF Primary Commodity Prices via FRED, source_url: "https://fred.stlouisfed.org/series/PNGASEUUSDM",
     caveat_en: "IMF monthly European gas price (TTF-based). Daily TTF is ICE Endex licensed.", caveat_zh: "IMF欧洲天然气月度价格（基于TTF）。日度TTF为ICE Endex授权数据。"}
  - {id: asia_lng_monthly, section: gas_lng, label_en: "Asian LNG (monthly average, Japan)", label_zh: "亚洲LNG月均价（日本）", unit: USD/MMBtu,
     fetcher: fred, series: PNGASJPUSDM, frequency: monthly, start_date: 2005-01-01,
     source_name: IMF Primary Commodity Prices via FRED, source_url: "https://fred.stlouisfed.org/series/PNGASJPUSDM",
     caveat_en: "IMF monthly Japan LNG import price.", caveat_zh: "IMF日本LNG进口月度价格。"}
  - {id: eu_hh_gas_spread, section: gas_lng, view: core, label_en: "Europe – Henry Hub Gas Spread (monthly)", label_zh: "欧洲–美国气价价差（月度）", unit: USD/MMBtu,
     derivation: derived, op: spread, inputs: [eu_gas_monthly, "henry_hub_spot@monthly_mean"], frequency: monthly,
     caveat_en: "The margin that pulls US LNG cargoes to Europe.", caveat_zh: "吸引美国LNG船货流向欧洲的价差。"}
  - {id: asia_eu_lng_spread, section: gas_lng, label_en: "Asia LNG – Europe Gas Spread (monthly)", label_zh: "亚洲LNG–欧洲气价价差（月度）", unit: USD/MMBtu,
     derivation: derived, op: spread, inputs: [asia_lng_monthly, eu_gas_monthly], frequency: monthly,
     caveat_en: "Positive values pull flexible cargoes to Asia.", caveat_zh: "正值时灵活船货流向亚洲。"}
  - {id: us_gas_storage, section: gas_lng, label_en: "US Working Gas in Storage (Lower 48)", label_zh: "美国天然气工作库存（本土48州）", unit: Bcf,
     fetcher: eia_xls, source_authority: official_primary, series: ng/NW2_EPG0_SWO_R48_BCF, frequency: weekly, start_date: 2010-01-01,
     source_name: EIA Weekly Natural Gas Storage Report, source_url: "https://ir.eia.gov/ngs/ngs.html",
     caveat_en: "Weekly working gas in underground storage.", caveat_zh: "周度地下储气工作气量。"}
  - {id: us_gas_storage_vs_5y, section: gas_lng, view: core, label_en: "US Gas Storage vs 5-Year Same-Week Average", label_zh: "美国储气相对五年同周均值", unit: Bcf,
     derivation: derived, op: dev_from_5y_seasonal, inputs: [us_gas_storage], frequency: weekly,
     caveat_en: "Storage minus the mean of the same ISO week in the previous five years (three years minimum).",
     caveat_zh: "库存减去前五年同一ISO周的均值（至少需三年）。"}
  - {id: eu_gas_storage_full, section: gas_lng, view: core, label_en: "EU Gas Storage Fill (% of working gas volume)", label_zh: "欧盟储气率（占工作气量）", unit: "%",
     fetcher: gie_agsi, source_authority: official_primary, series: eu, frequency: daily, start_date: 2015-01-01,
     source_name: GIE AGSI+, source_url: "https://agsi.gie.eu/",
     caveat_en: "Gas in storage as a share of working gas volume at the start of each gas day, EU aggregate. The latest gas days can be estimates that storage operators confirm later.",
     caveat_zh: "每个燃气日开始时的储气量占工作气量的比例，欧盟合计。最近几个燃气日可能是估计值，之后由储气运营商确认。"}
  - {id: eu_gas_storage_vs_5y, section: gas_lng, view: core, label_en: "EU Gas Storage vs 5-Year Same-Day Average", label_zh: "欧盟储气率相对五年同日均值", unit: pp,
     derivation: derived, op: dev_from_5y_seasonal, inputs: [eu_gas_storage_full], frequency: daily,
     caveat_en: "Fill level minus the mean of the same calendar day in the previous five years (three years minimum), in percentage points.",
     caveat_zh: "储气率减去前五年同一日历日的均值（至少需三年），单位为百分点。"}
  - {id: de_gas_storage_full, section: gas_lng, label_en: "Germany Gas Storage Fill (% of working gas volume)", label_zh: "德国储气率（占工作气量）", unit: "%",
     fetcher: gie_agsi, source_authority: official_primary, series: DE, frequency: daily, start_date: 2015-01-01,
     source_name: GIE AGSI+, source_url: "https://agsi.gie.eu/",
     caveat_en: "Germany holds the largest storage capacity in the EU. The latest gas days can be estimates that storage operators confirm later.",
     caveat_zh: "德国储气能力居欧盟之首。最近几个燃气日可能是估计值，之后由储气运营商确认。"}

  # ------------------------------------------------------------ power_coal
  - {id: de_power_day_ahead, section: power_coal, view: core, label_en: "Germany–Luxembourg Day-Ahead Power (daily mean)", label_zh: "德国–卢森堡日前电价（日均）", unit: EUR/MWh,
     fetcher: energy_charts_price, source_authority: official_mirror, series: DE-LU, frequency: daily, start_date: 2019-01-01,
