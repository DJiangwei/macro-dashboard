  - {id: us_gasoline_stocks, section: inventories, label_en: "US Total Motor Gasoline Stocks", label_zh: "美国车用汽油库存", unit: mb,
     fetcher: eia_xls, source_authority: official_primary, series: pet/WGTSTUS1, scale: 1000, frequency: weekly, start_date: 2010-01-01,
     source_name: EIA Weekly Petroleum Status Report, source_url: "https://www.eia.gov/petroleum/supply/weekly/",
     caveat_en: "Total motor gasoline stocks.", caveat_zh: "车用汽油总库存。"}
  - {id: us_distillate_stocks, section: inventories, label_en: "US Distillate Fuel Oil Stocks", label_zh: "美国馏分燃料油库存", unit: mb,
     fetcher: eia_xls, source_authority: official_primary, series: pet/WDISTUS1, scale: 1000, frequency: weekly, start_date: 2010-01-01,
     source_name: EIA Weekly Petroleum Status Report, source_url: "https://www.eia.gov/petroleum/supply/weekly/",
     caveat_en: "Distillate fuel oil stocks.", caveat_zh: "馏分燃料油库存。"}
  - {id: us_distillate_stocks_vs_5y, section: inventories, label_en: "US Distillate Stocks vs 5-Year Same-Week Average", label_zh: "美国馏分油库存相对五年同周均值", unit: mb,
     derivation: derived, op: dev_from_5y_seasonal, inputs: [us_distillate_stocks], frequency: weekly,
     caveat_en: "Stocks minus the mean of the same ISO week in the previous five years.", caveat_zh: "库存减去前五年同一ISO周的均值。"}
  - {id: distillate_days_cover, section: inventories, view: core, label_en: "US Distillate Days of Cover", label_zh: "美国馏分油可用天数", unit: days,
     derivation: derived, op: ratio, factor: 1000, inputs: [us_distillate_stocks, us_distillate_demand], frequency: weekly,
     caveat_en: "Distillate stocks (mb × 1000) divided by weekly distillate product supplied (kb/d).", caveat_zh: "馏分油库存（百万桶×1000）除以周度馏分油表观消费（千桶/日）。"}
  - {id: global_stock_draws, section: inventories, view: core, label_en: "World Oil Net Inventory Withdrawals", label_zh: "全球石油净库存提取", unit: mb/d,
     fetcher: eia_steo, source_authority: official_primary, series: T3_STCHANGE_WORLD, steo_unit: "million barrels per day", frequency: monthly, start_date: 2010-01-01,
     source_name: EIA Short-Term Energy Outlook, source_url: "https://www.eia.gov/outlooks/steo/",
     caveat_en: "EIA's implied global stock change: positive means inventories are being drawn, negative means they are building. History months only; revised in later STEO releases.",
     caveat_zh: "EIA口径的全球隐含库存变化：正值表示去库，负值表示累库。只显示历史月份，会在之后的STEO中修订。"}
  - {id: oecd_commercial_stocks, section: inventories, label_en: "OECD Commercial Oil Inventories (end of month)", label_zh: "OECD商业石油库存（月末）", unit: mb,
     fetcher: eia_steo, source_authority: official_primary, series: PASC_OECD_T3, steo_unit: "million barrels, end-of-period", frequency: monthly, start_date: 2010-01-01,
     source_name: EIA Short-Term Energy Outlook, source_url: "https://www.eia.gov/outlooks/steo/",
     caveat_en: "Crude oil and other liquids held commercially in OECD countries at month end. EIA estimate from the Short-Term Energy Outlook, not the producer's own reported figure; history months only (STEO forecasts are not shown), and the latest months are revised in later STEO releases.",
     caveat_zh: "OECD国家月末商业原油与其他液体库存。EIA短期能源展望（STEO）的估计值，并非生产国自报数据；只显示历史月份（不显示STEO预测），最近几个月会在之后的STEO中修订。"}
  - {id: oecd_commercial_stocks_vs_5y, section: inventories, view: core, label_en: "OECD Commercial Inventories vs 5-Year Same-Month Average", label_zh: "OECD商业库存相对五年同月均值", unit: mb,
     derivation: derived, op: dev_from_5y_seasonal, inputs: [oecd_commercial_stocks], frequency: monthly,
     caveat_en: "Inventories minus the mean of the same month in the previous five years (three years minimum).",
     caveat_zh: "库存减去前五年同月的均值（至少需三年）。"}

