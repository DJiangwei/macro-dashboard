data_gaps:
  - section: crude_benchmarks
    item_en: WTI and Brent futures curves (term structure)
    item_zh: WTI与布伦特期货曲线（期限结构）
    status_en: EIA discontinued its futures curve series (RCLC1-4) after 2024-04-05; CME and ICE curves are licensed.
    status_zh: EIA的期货曲线序列（RCLC1-4）已于2024-04-05后停更；CME与ICE曲线为授权数据。
  - section: gas_lng
    item_en: Daily TTF and EU gas storage fill
    item_zh: 日度TTF与欧盟储气率
    status_en: TTF is ICE Endex licensed. EU storage (GIE AGSI+) needs GIE_AGSI_API_KEY in the build environment.
    status_zh: TTF为ICE Endex授权数据。欧盟储气（GIE AGSI+）需要在构建环境中配置GIE_AGSI_API_KEY。
  - section: supply
    item_en: OPEC+ production by country, spare capacity, global balances (EIA STEO)
    item_zh: OPEC+分国产量、闲置产能与全球供需平衡（EIA STEO）
    status_en: Requires EIA_API_KEY in the build environment.
    status_zh: 需要在构建环境中配置EIA_API_KEY。
  - section: power_coal
    item_en: EU carbon (EUA) price and generation mix
    item_zh: 欧盟碳价（EUA）与发电结构
    status_en: EUA settlement data is EEX/ICE licensed; the generation mix needs EMBER_API_KEY.
    status_zh: EUA结算价为EEX/ICE授权数据；发电结构需要EMBER_API_KEY。
  - section: trade_geography
    item_en: Tanker rates, rig counts and chokepoint flows
    item_zh: 油轮运价、钻机数与关键海峡流量
    status_en: Baltic Exchange/Kpler data is licensed; Baker Hughes refuses requests from this environment.
    status_zh: 波罗的海交易所/Kpler数据为授权数据；Baker Hughes拒绝本环境的请求。
