     source_name: CFTC Commitments of Traders (disaggregated), source_url: "https://publicreporting.cftc.gov/stories/s/r4w3-av2u",
     caveat_en: "NYMEX NY Harbor ULSD.", caveat_zh: "NYMEX纽约港超低硫柴油。"}

  # ------------------------------------------------------------ macro_transmission
  - {id: us_cpi_energy_yoy, section: macro_transmission, view: core, label_en: "US CPI Energy YoY", label_zh: "美国CPI能源分项同比", unit: "% y/y",
