     source_name: EIA Weekly Petroleum Status Report, source_url: "https://www.eia.gov/petroleum/supply/weekly/",
     caveat_en: "Weekly estimate; noisy week to week.", caveat_zh: "周度估计，周间波动较大。"}
  - {id: us_crude_net_imports, section: trade_geography, label_en: "US Crude Oil Net Imports", label_zh: "美国原油净进口", unit: kb/d,
