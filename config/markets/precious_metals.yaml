# Precious metals page (scope PRECIOUS, framework market_precious).
#
# Observed series come from the named source; `derivation: derived` series use
# whitelisted operators (src/country_primer/derived.py), including cross-scope
# inputs such as ENERGY:brent_spot and JP:usd_jpy. LBMA prices and ETF holdings
# are not freely available and are listed under data_gaps.

name: "Precious Metals"
name_zh: "贵金属"
code: "PRECIOUS"
iso2: "PRECIOUS"
framework: market_precious
subtitle_en: "Gold, silver, platinum and palladium for macro: prices, cross-metal and cross-asset ratios, gold in local currencies, the real-rate and dollar drivers, official-sector buying, the Shanghai premium and positioning. Sources: COMEX via Sina/AKShare, IMF, Shanghai Gold Exchange, FRED and CFTC."
subtitle_zh: "面向宏观的金、银、铂、钯：价格、金属间与跨资产比价、本币金价、实际利率与美元驱动、官方部门购金、上海溢价与持仓。数据来源：COMEX（经新浪/AKShare）、IMF、上海黄金交易所、FRED与CFTC。"
min_chart_count: 40
core_view_label_en: "Key charts"
core_view_label_zh: "核心图表"

panels:
  - {type: official_gold, section: official_sector, prefix: cb_gold_}

sections:
  prices:
    title_en: "Prices"
    title_zh: "价格"
    report_logic_en: "Same-day COMEX front-month futures (completed sessions) and IMF monthly averages. LBMA auction prices are licensed."
    report_logic_zh: "COMEX近月期货当日收盘（仅已收盘交易日）与IMF月均价。LBMA定价为授权数据。"
  ratios:
    title_en: "Ratios & Gold in Local Currency"
    title_zh: "比价与本币金价"
    report_logic_en: "Gold relative to silver, platinum, oil and copper, and gold priced in the currencies of large holders and buyers."
    report_logic_zh: "黄金相对白银、铂金、原油与铜的比价，以及按主要持有国与买家货币计价的金价。"
  macro_drivers:
    title_en: "Macro Drivers"
    title_zh: "宏观驱动"
    report_logic_en: "US 10-year real yield, the broad dollar, long-run inflation compensation and gold implied volatility. The post-2022 break between gold and real yields is visible by comparing the charts."
    report_logic_zh: "美国10年期实际利率、广义美元、长期通胀补偿与黄金隐含波动率。对照图表可以看到2022年后黄金与实际利率的脱钩。"
  official_sector:
    title_en: "Official Sector"
    title_zh: "官方部门"
    report_logic_en: "Central-bank gold holdings reported to the IMF. Several holders on this dashboard (KZ, UZ) are also gold producers and active traders of their own reserves."
    report_logic_zh: "各国央行向IMF报告的黄金储备。本仪表盘中的部分持有方（哈萨克斯坦、乌兹别克斯坦）同时是产金国，并主动交易其黄金储备。"
  regional_premium:
    title_en: "Shanghai Premium"
    title_zh: "上海溢价"
    report_logic_en: "Shanghai Gold Exchange prices converted to USD per ounce against COMEX: a gauge of Chinese physical demand and import constraints."
    report_logic_zh: "上海黄金交易所价格换算为美元/盎司后与COMEX比较：衡量中国实物需求与进口约束。"
  positioning:
    title_en: "Positioning (CFTC)"
    title_zh: "持仓（CFTC）"
    report_logic_en: "Managed-money net futures positions from the disaggregated Commitments of Traders."
    report_logic_zh: "CFTC分类持仓报告中管理基金的期货净持仓。"

indicators:
  # ------------------------------------------------------------ prices
  - {id: gold_front_futures, section: prices, view: core, label_en: "Gold (COMEX front month)", label_zh: "黄金（COMEX近月）", unit: USD/oz,
     fetcher: foreign_futures, series: GC, frequency: daily, start_date: 2015-01-01, source_authority: public_wrapper, source_name: "Sina Finance via AKShare", source_url: "https://finance.sina.com.cn/futuremarket/",
     caveat_en: "Completed sessions only, from a public wrapper; IMF monthly averages are the verified reference.", caveat_zh: "仅保留已收盘交易日，来自公开封装接口；IMF月均价为核验基准。"}
  - {id: silver_front_futures, section: prices, view: core, label_en: "Silver (COMEX front month)", label_zh: "白银（COMEX近月）", unit: USD/oz,
     fetcher: foreign_futures, series: SI, frequency: daily, start_date: 2015-01-01, source_authority: public_wrapper, source_name: "Sina Finance via AKShare", source_url: "https://finance.sina.com.cn/futuremarket/",
     caveat_en: "Completed sessions only, from a public wrapper.", caveat_zh: "仅保留已收盘交易日，来自公开封装接口。"}
  - {id: platinum_front_futures, section: prices, view: core, label_en: "Platinum (NYMEX front month)", label_zh: "铂金（NYMEX近月）", unit: USD/oz,
     fetcher: foreign_futures, series: XPT, frequency: daily, start_date: 2015-01-01, source_authority: public_wrapper, source_name: "Sina Finance via AKShare", source_url: "https://finance.sina.com.cn/futuremarket/",
     caveat_en: "Completed sessions only, from a public wrapper.", caveat_zh: "仅保留已收盘交易日，来自公开封装接口。"}
  - {id: palladium_front_futures, section: prices, view: core, label_en: "Palladium (NYMEX front month)", label_zh: "钯金（NYMEX近月）", unit: USD/oz,
     fetcher: foreign_futures, series: XPD, frequency: daily, start_date: 2015-01-01, source_authority: public_wrapper, source_name: "Sina Finance via AKShare", source_url: "https://finance.sina.com.cn/futuremarket/",
     caveat_en: "Completed sessions only, from a public wrapper.", caveat_zh: "仅保留已收盘交易日，来自公开封装接口。"}
  - {id: copper_front_futures, section: prices, label_en: "Copper (COMEX front month, for the gold/copper ratio)", label_zh: "铜（COMEX近月，用于金铜比）", unit: US cents/lb,
     fetcher: foreign_futures, series: HG, frequency: daily, start_date: 2015-01-01, source_authority: public_wrapper, source_name: "Sina Finance via AKShare", source_url: "https://finance.sina.com.cn/futuremarket/",
     caveat_en: "Quoted in US cents per pound.", caveat_zh: "以美分/磅计价。"}
  - {id: gold_monthly_imf, section: prices, label_en: "Gold (IMF monthly average)", label_zh: "黄金（IMF月均价）", unit: USD/oz,
     fetcher: imf_sdmx, dataflow: "IMF.RES,PCPS", series: G001.PGOLD.USD.M, frequency: monthly, start_date: 2000-01-01, source_authority: official_mirror, source_name: "IMF Primary Commodity Prices", source_url: "https://data.imf.org/?sk=PCPS",
     caveat_en: "Monthly average of the London price as compiled by the IMF.", caveat_zh: "IMF编制的伦敦金价月均值。"}
  - {id: silver_monthly_imf, section: prices, label_en: "Silver (IMF monthly average)", label_zh: "白银（IMF月均价）", unit: USD/oz,
     fetcher: imf_sdmx, dataflow: "IMF.RES,PCPS", series: G001.PSILVER.USD.M, frequency: monthly, start_date: 2000-01-01, source_authority: official_mirror, source_name: "IMF Primary Commodity Prices", source_url: "https://data.imf.org/?sk=PCPS",
     caveat_en: "Monthly average as compiled by the IMF.", caveat_zh: "IMF编制的月均价。"}
  - {id: platinum_monthly_imf, section: prices, label_en: "Platinum (IMF monthly average)", label_zh: "铂金（IMF月均价）", unit: USD/oz,
     fetcher: imf_sdmx, dataflow: "IMF.RES,PCPS", series: G001.PPLAT.USD.M, frequency: monthly, start_date: 2000-01-01, source_authority: official_mirror, source_name: "IMF Primary Commodity Prices", source_url: "https://data.imf.org/?sk=PCPS",
     caveat_en: "Monthly average as compiled by the IMF.", caveat_zh: "IMF编制的月均价。"}
  - {id: palladium_monthly_imf, section: prices, label_en: "Palladium (IMF monthly average)", label_zh: "钯金（IMF月均价）", unit: USD/oz,
     fetcher: imf_sdmx, dataflow: "IMF.RES,PCPS", series: G001.PPALLA.USD.M, frequency: monthly, start_date: 2000-01-01, source_authority: official_mirror, source_name: "IMF Primary Commodity Prices", source_url: "https://data.imf.org/?sk=PCPS",
     caveat_en: "Monthly average as compiled by the IMF.", caveat_zh: "IMF编制的月均价。"}
  - {id: gold_yoy, section: prices, label_en: "Gold YoY (IMF monthly average)", label_zh: "黄金同比（IMF月均价）", unit: "% y/y",
     derivation: derived, op: yoy_pct, inputs: [gold_monthly_imf], frequency: monthly,
     caveat_en: "Year-on-year change of the IMF monthly average.", caveat_zh: "IMF月均价的同比变动。"}

  # ------------------------------------------------------------ ratios
  - {id: gold_silver_ratio, section: ratios, view: core, label_en: "Gold / Silver Ratio", label_zh: "金银比", unit: ratio,
     derivation: derived, op: ratio, inputs: [gold_front_futures, silver_front_futures], frequency: daily,
     caveat_en: "Ounces of silver per ounce of gold; rises in risk-off and industrial slowdowns.", caveat_zh: "一盎司黄金可换的白银盎司数；避险与工业放缓时上升。"}
  - {id: gold_platinum_ratio, section: ratios, label_en: "Gold / Platinum Ratio", label_zh: "金铂比", unit: ratio,
     derivation: derived, op: ratio, inputs: [gold_front_futures, platinum_front_futures], frequency: daily,
     caveat_en: "Monetary metal versus an autocatalyst metal.", caveat_zh: "货币金属相对汽车催化剂金属。"}
  - {id: gold_oil_ratio, section: ratios, view: core, label_en: "Gold / Brent Ratio", label_zh: "金油比", unit: bbl per oz,
     derivation: derived, op: ratio, inputs: [gold_front_futures, "ENERGY:brent_spot"], frequency: daily,
     caveat_en: "Barrels of Brent per ounce of gold (Brent from the Energy page, EIA spot).", caveat_zh: "一盎司黄金可换的布伦特桶数（布伦特取自能源页EIA现货）。"}
  - {id: gold_copper_ratio, section: ratios, view: core, label_en: "Gold / Copper Ratio", label_zh: "金铜比", unit: lb per oz,
     derivation: derived, op: ratio, factor: 100, inputs: [gold_front_futures, copper_front_futures], frequency: daily,
     caveat_en: "Pounds of copper per ounce of gold (copper converted from cents); falls when growth expectations improve.", caveat_zh: "一盎司黄金可换的铜磅数（铜由美分换算）；增长预期改善时下降。"}
  - {id: gold_eur, section: ratios, label_en: "Gold in EUR", label_zh: "欧元计价金价", unit: EUR/oz,
     derivation: derived, op: ratio, inputs: [gold_front_futures, "EA:eur_usd"], frequency: daily,
     caveat_en: "COMEX gold divided by the ECB EUR/USD reference rate on matching days.", caveat_zh: "COMEX金价除以同日欧央行EUR/USD参考汇率。"}
  - {id: gold_jpy, section: ratios, label_en: "Gold in JPY", label_zh: "日元计价金价", unit: JPY/oz,
     derivation: derived, op: product, inputs: [gold_front_futures, "JP:usd_jpy"], frequency: daily,
     caveat_en: "COMEX gold times USD/JPY on matching days.", caveat_zh: "COMEX金价乘以同日USD/JPY。"}
  - {id: gold_cny, section: ratios, view: core, label_en: "Gold in CNY", label_zh: "人民币计价金价", unit: CNY/oz,
     derivation: derived, op: product, inputs: [gold_front_futures, "CN:usd_cny_midpoint"], frequency: daily,
     caveat_en: "COMEX gold times the USD/CNY central parity on matching days.", caveat_zh: "COMEX金价乘以同日人民币中间价。"}
  - {id: gold_inr, section: ratios, label_en: "Gold in INR", label_zh: "卢比计价金价", unit: INR/oz,
     derivation: derived, op: product, inputs: [gold_front_futures, "IN:usd_inr"], frequency: daily,
     caveat_en: "COMEX gold times USD/INR (Fed H.10) on matching days; excludes Indian import duty.", caveat_zh: "COMEX金价乘以同日USD/INR（美联储H.10）；不含印度进口关税。"}

  # ------------------------------------------------------------ macro_drivers
  - {id: us_real_yield_10y, section: macro_drivers, view: core, label_en: "US 10-Year Real Yield (TIPS)", label_zh: "美国10年期实际利率（TIPS）", unit: "%",
     fetcher: fred, series: DFII10, frequency: daily, start_date: 2015-01-01,
     source_name: Federal Reserve H.15 via FRED, source_url: "https://fred.stlouisfed.org/series/DFII10",
     caveat_en: "Market yield on 10-year inflation-indexed Treasuries.", caveat_zh: "10年期通胀保值国债市场收益率。"}
  - {id: broad_dollar, section: macro_drivers, view: core, label_en: "Broad Trade-Weighted Dollar", label_zh: "广义贸易加权美元指数", unit: "index (Jan 2006 = 100)",
     fetcher: fred, series: DTWEXBGS, frequency: daily, start_date: 2015-01-01,
     source_name: Federal Reserve H.10 via FRED, source_url: "https://fred.stlouisfed.org/series/DTWEXBGS",
     caveat_en: "Nominal broad dollar index against goods and services trading partners.", caveat_zh: "对商品与服务贸易伙伴的名义广义美元指数。"}
  - {id: us_5y5y_forward, section: macro_drivers, label_en: "US 5-Year, 5-Year Forward Inflation Expectation", label_zh: "美国5年后5年远期通胀预期", unit: "%",
     fetcher: fred, series: T5YIFR, frequency: daily, start_date: 2015-01-01,
     source_name: Federal Reserve via FRED, source_url: "https://fred.stlouisfed.org/series/T5YIFR",
     caveat_en: "Long-horizon inflation compensation.", caveat_zh: "长期通胀补偿。"}
  - {id: gvz, section: macro_drivers, label_en: "CBOE Gold Volatility Index (GVZ)", label_zh: "黄金波动率指数GVZ", unit: index,
     fetcher: fred, series: GVZCLS, frequency: daily, start_date: 2015-01-01,
     source_name: CBOE via FRED, source_url: "https://fred.stlouisfed.org/series/GVZCLS",
     caveat_en: "30-day implied volatility of GLD options.", caveat_zh: "基于GLD期权的30天隐含波动率。"}

  # ------------------------------------------------------------ official_sector
  - {id: cb_gold_chn, section: official_sector, view: core, holder: "China (PBoC)", label_en: "Official Gold Holdings — China (PBoC)", label_zh: "官方黄金储备 — 中国（人民银行）", unit: tonnes,
     fetcher: imf_sdmx, dataflow: "IMF.STA,IL", series: "CHN.RGV_REVS.FTO.M", scale: 32150.7466, frequency: monthly, start_date: 2000-01-01,
     source_authority: official_mirror, source_name: "IMF International Liquidity", source_url: "https://data.imf.org/?sk=IL",
     caveat_en: "Monetary gold in fine troy ounces reported to the IMF, converted to tonnes (÷ 32,150.7466).", caveat_zh: "向IMF报告的货币黄金（金衡盎司），换算为吨（÷32,150.7466）。"}
