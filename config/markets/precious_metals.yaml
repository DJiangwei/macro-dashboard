     source_name: "Shanghai Gold Exchange via AKShare", source_url: "https://www.sge.com.cn/sjzx/jzj",
     caveat_en: "The SGE's yuan-denominated gold fixing, morning auction.", caveat_zh: "上海黄金交易所人民币黄金定价，早盘集中定价。"}
