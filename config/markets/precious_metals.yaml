data_gaps:
  - section: prices
    item_en: LBMA gold and silver prices
    item_zh: LBMA金银定价
    status_en: LBMA auction prices are licensed (IBA); the IMF monthly averages and COMEX futures are used instead.
    status_zh: LBMA拍卖价格为授权数据（IBA）；以IMF月均价与COMEX期货代替。
  - section: official_sector
    item_en: Gold ETF holdings and World Gold Council demand data
    item_zh: 黄金ETF持仓与世界黄金协会需求数据
    status_en: No reliable free machine-readable source (SPDR returns a non-CSV page; WGC requires registration).
    status_zh: 没有可靠的免费机读来源（SPDR返回非CSV页面；WGC需要注册）。
  - section: regional_premium
    item_en: India gold premium/discount
    item_zh: 印度黄金溢价/折价
    status_en: No free source for Indian dealer premiums.
    status_zh: 印度经销商溢价没有免费来源。
  - section: prices
    item_en: COMEX and SHFE vault inventories, PGM mine supply (South Africa, Russia)
    item_zh: COMEX与上期所库存、铂族金属矿产供给（南非、俄罗斯）
    status_en: To be sourced; Russian palladium output has no free source.
    status_zh: 待接入；俄罗斯钯产量没有免费来源。
