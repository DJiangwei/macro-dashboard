  # ------------------------------------------------------------ arbitrage
  - {id: comex_copper, section: arbitrage, label_en: "Copper (COMEX front month)", label_zh: "铜（COMEX近月）", unit: US cents/lb,
     fetcher: foreign_futures, series: HG, frequency: daily, start_date: 2015-01-01, source_authority: public_wrapper, source_name: "Sina Finance via AKShare", source_url: "https://finance.sina.com.cn/futuremarket/",
     caveat_en: "Quoted in US cents per pound.", caveat_zh: "以美分/磅计价。"}
  - {id: comex_lme_copper_spread, section: arbitrage, view: core, label_en: "COMEX – LME Copper Spread", label_zh: "COMEX–LME铜价差", unit: USD/t,
     derivation: derived, op: linear, weights: [22.0462262, -1], inputs: [comex_copper, lme_copper_3m], frequency: daily,
     caveat_en: "COMEX (cents/lb × 22.0462 = USD/t) minus LME 3-month. US tariff expectations drive this spread.", caveat_zh: "COMEX（美分/磅×22.0462=美元/吨）减LME三个月。美国关税预期驱动该价差。"}
  - {id: lme_copper_cny_vat, section: arbitrage, label_en: "LME Copper in CNY incl. 13% VAT (import parity)", label_zh: "伦铜人民币含税价（进口平价）", unit: CNY/t,
     derivation: derived, op: product, factor: 1.13, inputs: [lme_copper_3m, "CN:usd_cny_midpoint"], frequency: daily,
     caveat_en: "LME 3-month × USD/CNY central parity × 1.13; excludes the Yangshan premium, freight and financing.", caveat_zh: "LME三个月价 × 人民币中间价 × 1.13；不含洋山溢价、运费与资金成本。"}
  - {id: copper_import_window, section: arbitrage, view: core, label_en: "SHFE Copper Import Window", label_zh: "上期所铜进口窗口", unit: CNY/t,
     derivation: derived, op: spread, inputs: [shfe_copper, lme_copper_cny_vat], frequency: daily,
     caveat_en: "SHFE main contract minus import parity. Positive values favour imports into China. SHFE and LME close at different times.", caveat_zh: "沪铜主力减进口平价。正值有利于进口。两地收盘时间不同。"}
  - {id: lme_aluminium_cny_vat, section: arbitrage, label_en: "LME Aluminium in CNY incl. 13% VAT (import parity)", label_zh: "伦铝人民币含税价（进口平价）", unit: CNY/t,
     derivation: derived, op: product, factor: 1.13, inputs: [lme_aluminium_3m, "CN:usd_cny_midpoint"], frequency: daily,
     caveat_en: "LME 3-month × USD/CNY central parity × 1.13; excludes premiums, freight and duties.", caveat_zh: "LME三个月价 × 人民币中间价 × 1.13；不含溢价、运费与关税。"}
  - {id: aluminium_import_window, section: arbitrage, label_en: "SHFE Aluminium Import Window", label_zh: "上期所铝进口窗口", unit: CNY/t,
     derivation: derived, op: spread, inputs: [shfe_aluminium, lme_aluminium_cny_vat], frequency: daily,
     caveat_en: "SHFE main contract minus import parity; China is normally an aluminium exporter, so this is usually negative.", caveat_zh: "沪铝主力减进口平价；中国通常是铝出口国，因此通常为负。"}

