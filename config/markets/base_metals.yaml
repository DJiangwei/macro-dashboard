# Base metals page (scope BASE, framework market_base_metals).
#
# Market-first: prices across LME, SHFE/DCE/GFEX and IMF monthly benchmarks,
# cross-market arbitrage, visible inventories, Chinese demand, positioning,
# with macro links as an appendix. Derived series use whitelisted operators;
# `reference` shows another page's series unchanged with its provenance.

name: "Base Metals"
name_zh: "基本金属"
code: "BASE"
iso2: "BASE"
framework: market_base_metals
subtitle_en: "Copper, aluminium, zinc, nickel, lead, tin, iron ore and battery metals as markets: LME and Chinese exchange prices, the SHFE import window and the COMEX–LME copper spread, visible stocks, Chinese demand and positioning. Sources: LME and COMEX via Sina/AKShare, SHFE/DCE/GFEX, IMF, CFTC, BIS and FRED."
subtitle_zh: "以市场为中心的铜、铝、锌、镍、铅、锡、铁矿石与电池金属：LME与中国交易所价格、上期所进口窗口与COMEX–LME铜价差、可见库存、中国需求与持仓。数据来源：LME与COMEX（经新浪/AKShare）、上期所/大商所/广期所、IMF、CFTC、BIS与FRED。"
min_chart_count: 40
core_view_label_en: "Key charts"
core_view_label_zh: "核心图表"

sections:
  lme_prices:
    title_en: "LME Prices"
    title_zh: "LME价格"
    report_logic_en: "Daily LME 3-month prices for the six base metals."
    report_logic_zh: "六种基本金属的LME三个月期日度价格。"
  china_futures:
    title_en: "Chinese Exchanges"
    title_zh: "中国交易所"
    report_logic_en: "SHFE, DCE and GFEX main contracts, including iron ore, rebar, alumina and lithium carbonate."
    report_logic_zh: "上期所、大商所与广期所主力合约，含铁矿石、螺纹钢、氧化铝与碳酸锂。"
  arbitrage:
    title_en: "Cross-Market Arbitrage"
    title_zh: "跨市场套利"
    report_logic_en: "The SHFE import window (Shanghai price minus LME converted at the central parity with 13% VAT) and the tariff-driven COMEX–LME copper spread."
    report_logic_zh: "上期所进口窗口（沪价减按中间价换算并含13%增值税的伦铜价）与关税驱动的COMEX–LME铜价差。"
  inventories:
    title_en: "Visible Inventories"
    title_zh: "可见库存"
    report_logic_en: "SHFE warehouse stocks. LME stock reports are licensed and COMEX copper stocks have no free source yet."
    report_logic_zh: "上期所仓库库存。LME库存报告为授权数据，COMEX铜库存暂无免费来源。"
  monthly_benchmarks:
    title_en: "Monthly Benchmarks & Battery Metals"
    title_zh: "月度基准与电池金属"
    report_logic_en: "IMF monthly averages, including cobalt and lithium, as a verified reference for the daily exchange prices."
    report_logic_zh: "IMF月均价（含钴与锂），作为交易所日度价格的核验基准。"
  china_demand:
    title_en: "Chinese Demand"
    title_zh: "中国需求"
    report_logic_en: "China consumes roughly half of the world's refined base metals; these series are taken unchanged from the China page."
    report_logic_zh: "中国约占全球精炼基本金属消费的一半；以下序列直接取自中国页。"
  positioning:
    title_en: "Positioning (CFTC)"
    title_zh: "持仓（CFTC）"
    report_logic_en: "COMEX copper managed-money net position."
    report_logic_zh: "COMEX铜管理基金净持仓。"
  macro_links:
    title_en: "Macro Links"
    title_zh: "宏观关联"
    report_logic_en: "Copper relative to gold against US yields, and the copper currencies (AUD, CLP, PEN)."
    report_logic_zh: "铜相对黄金与美债收益率，以及铜相关货币（澳元、智利比索、秘鲁索尔）。"

