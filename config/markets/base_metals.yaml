data_gaps:
  - section: lme_prices
    item_en: LME official prices, cash–3M spread and LME warehouse stocks
    item_zh: LME官方价格、现货–三月价差与LME库存
    status_en: Licensed by the LME; the free mirror for LME stocks stopped in July 2026.
    status_zh: 为LME授权数据；LME库存的免费镜像已于2026年7月停更。
  - section: inventories
    item_en: COMEX copper stocks and long SHFE inventory history
    item_zh: COMEX铜库存与上期所长期库存历史
    status_en: No free machine-readable COMEX copper source found; the SHFE source returns about three months.
    status_zh: 未找到免费机读的COMEX铜库存来源；上期所数据源仅返回约三个月。
  - section: china_demand
    item_en: Chinese refined metal output and copper/aluminium trade by product
    item_zh: 中国精炼金属产量与分品种铜铝进出口
    status_en: NBS is not reachable from this environment; customs product detail to be sourced.
    status_zh: 本环境无法访问统计局接口；海关分品种数据待接入。
  - section: monthly_benchmarks
    item_en: Mine supply (Chile, Peru, Indonesian nickel), TC/RC and ICSG balances
    item_zh: 矿山供给（智利、秘鲁、印尼镍）、加工费与ICSG供需平衡
    status_en: To be sourced (Cochilco, INE, MINEM); TC/RC and ICSG are licensed or registration-only.
    status_zh: 待接入（Cochilco、INE、MINEM）；加工费与ICSG为授权或需注册的数据。
