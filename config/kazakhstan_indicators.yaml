name: "Kazakhstan"
name_zh: "哈萨克斯坦"
code: "KZ"
iso2: "KZ"
subtitle_en: "A data-first macro page for Kazakhstan built from the National Bank of Kazakhstan (NBK), IMF SDMX 2.1, IMF DataMapper, World Bank WDI, DBnomics, and Bruegel REER."
subtitle_zh: "基于哈萨克斯坦国家银行(NBK)、IMF SDMX 2.1、IMF DataMapper、世界银行WDI、DBnomics与Bruegel实际有效汇率构建的哈萨克斯坦数据优先宏观页面。"
min_chart_count: 20

sections:
  growth_accounts:
    title_en: "GDP & National Accounts"
    title_zh: "GDP与国民账户"
    report_logic_en: "Official real GDP growth trajectories, household consumption, and investment dynamics from IMF DataMapper and World Bank WDI."
    report_logic_zh: "基于IMF DataMapper与世界银行WDI的实际GDP增速、居民消费与资本形成动态。"
  labour_wages:
    title_en: "Labour Market"
    title_zh: "劳动力市场"
    report_logic_en: "National unemployment rate tracking labour slack across commodity cycles."
    report_logic_zh: "全国失业率跟踪大宗商品周期下的劳动力闲置程度。"
  prices_costs:
    title_en: "Prices & Inflation"
    title_zh: "价格与通胀"
    report_logic_en: "Monthly headline CPI, sequential MoM inflation, and food price dynamics from the IMF SDMX Consumer Price Index database."
    report_logic_zh: "IMF SDMX消费者价格指数数据库提供的月度总体CPI、环比通胀与食品价格动态。"
  external_fx:
    title_en: "External Sector, FX & Reserves"
    title_zh: "外部部门、汇率与外储"
    report_logic_en: "National Bank of Kazakhstan official exchange rates (USD, EUR, RUB, CNY), Bruegel REER/NEER, and quarterly BPM6 Current Account Balance."
    report_logic_zh: "哈萨克斯坦国家银行官方汇率（美元、欧元、卢布、人民币）、Bruegel实际与名义有效汇率，以及季度BPM6经常账户差额。"
  fiscal_sovereign:
    title_en: "Fiscal & Public Debt"
    title_zh: "财政与主权债务"
    report_logic_en: "General government gross debt, fiscal deficit, and primary balance ratios from IMF DataMapper, alongside gross foreign exchange reserves."
    report_logic_zh: "IMF DataMapper提供的广义政府总债务、财政赤字与初级收支比率，配合官方外汇储备总额。"
  monetary_financial:
    title_en: "Monetary, Credit & Commodities"
    title_zh: "货币、信贷与大宗商品"
    report_logic_en: "Central bank policy corridor indicators, broad money growth, domestic private credit depth, and Brent crude benchmark pricing."
    report_logic_zh: "央行政策利率、广义货币增速、国内私营部门信贷深度以及布伦特原油基准价格。"
  stability_structural:
    title_en: "Financial Stability"
    title_zh: "金融稳定与银行体系"
    report_logic_en: "Banking sector regulatory capital adequacy ratio (CAR) and non-performing loan ratio (NPL) from IMF Financial Soundness Indicators."
    report_logic_zh: "IMF金融稳健指标(FSI)提供的银行体系监管资本充足率(CAR)与不良贷款率(NPL)。"

indicators:
  # ==========================================
  # 1. Growth & National Accounts
  # ==========================================
  - id: real_gdp_growth
    section: growth_accounts
    label_en: Real GDP Growth
    label_zh: 实际GDP增速 (IMF)
    unit: "%"
    fetcher: imf_datamapper
    series: NGDP_RPCH/KAZ
    actual_through: 2025
    source_name: IMF DataMapper (WEO)
    source_url: https://www.imf.org/external/datamapper/NGDP_RPCH/KAZ
    frequency: annual
    start_date: 2000-01-01
    caveat_en: Annual percentage change in constant-price gross domestic product.
    caveat_zh: 按不变价格计算的国内生产总值年度变动百分比。

  - id: real_gdp_growth_wb
    section: growth_accounts
    label_en: Real GDP Growth (World Bank)
    label_zh: 实际GDP增速 (世行)
    unit: "%"
    fetcher: world_bank
    series: NY.GDP.MKTP.KD.ZG
    country_iso3: KAZ
    source_name: World Bank WDI
    source_url: https://data.worldbank.org/indicator/NY.GDP.MKTP.KD.ZG?locations=KZ
    frequency: annual
    start_date: 2000-01-01
    caveat_en: Annual percentage growth rate of GDP at market prices based on constant local currency.
    caveat_zh: 基于不变本币市场价格计算的GDP年度增长率。

  - id: consumption_growth
    section: growth_accounts
    label_en: Household Consumption Growth
    label_zh: 居民最终消费支出增速
    unit: "%"
    fetcher: world_bank
    series: NE.CON.PRVT.KD.ZG
    country_iso3: KAZ
    source_name: World Bank WDI
    source_url: https://data.worldbank.org/indicator/NE.CON.PRVT.KD.ZG?locations=KZ
    frequency: annual
    start_date: 2000-01-01
    caveat_en: Annual percentage growth of households and NPISHs final consumption expenditure.
    caveat_zh: 居民与为住户服务的非营利机构最终消费支出的年度增长率。

  - id: investment_growth
    section: growth_accounts
    label_en: Gross Capital Formation Growth
    label_zh: 资本形成总额增速
    unit: "%"
    fetcher: world_bank
    series: NE.GDI.FTOT.KD.ZG
    country_iso3: KAZ
    source_name: World Bank WDI
    source_url: https://data.worldbank.org/indicator/NE.GDI.FTOT.KD.ZG?locations=KZ
    frequency: annual
    start_date: 2000-01-01
    caveat_en: Annual percentage growth of gross fixed capital formation.
    caveat_zh: 固定资本形成总额年度增长率。

  # ==========================================
  # 2. Labour Market
  # ==========================================
  - id: unemployment_rate
    section: labour_wages
    label_en: Unemployment Rate
    label_zh: 失业率
    unit: "%"
    fetcher: world_bank
    series: SL.UEM.TOTL.ZS
    country_iso3: KAZ
    source_name: World Bank / ILO
    source_url: https://data.worldbank.org/indicator/SL.UEM.TOTL.ZS?locations=KZ
    frequency: annual
    start_date: 2000-01-01
    caveat_en: Total unemployment as a percentage of the total labor force (ILO modeled estimate).
    caveat_zh: 占总劳动力百分比的总失业率（国际劳工组织模型估算值）。

  - id: labour_participation_rate
    section: labour_wages
    label_en: Labour Force Participation Rate (Total 15+)
    label_zh: 劳动力参与率 (15岁及以上)
    unit: "% of total population 15+"
    fetcher: world_bank
    country: KAZ
    series: SL.TLF.CACT.ZS
    source_authority: official_secondary
    source_name: World Bank / ILO
    source_url: https://data.worldbank.org/indicator/SL.TLF.CACT.ZS?locations=KZ
    frequency: annual
    start_date: 2000-01-01
    caveat_en: Labour force participation rate for ages 15 and older (modelled ILO estimate via World Bank).
    caveat_zh: 15岁及以上人口的劳动力参与率（世行/国际劳工组织口径）。

  # ==========================================
  # 3. Prices & Inflation
  # ==========================================
  - id: cpi_inflation
    section: prices_costs
    label_en: Headline CPI Inflation YoY
    label_zh: 总体CPI通胀同比
    unit: "% y/y"
    fetcher: imf_sdmx
    dataflow: CPI
    series: KAZ.CPI._T.YOY_PCH_PA_PT.M
    source_name: IMF SDMX / Kazakhstan BNS
    source_url: https://api.imf.org/external/sdmx/2.1/data/CPI/KAZ.CPI._T.YOY_PCH_PA_PT.M
    frequency: monthly
    start_date: 2005-01-01
    caveat_en: Year-on-year percentage change in official Consumer Price Index reported via IMF CPI.
    caveat_zh: 哈萨克斯坦国家统计局向IMF报送的月度消费者物价指数同比变动率。

  - id: cpi_inflation_mom
    section: prices_costs
    label_en: Headline CPI Inflation MoM
    label_zh: 总体CPI通胀环比
    unit: "% m/m"
    fetcher: imf_sdmx
    dataflow: CPI
    series: KAZ.CPI._T.POP_PCH_PA_PT.M
    source_name: IMF SDMX / Kazakhstan BNS
    source_url: https://api.imf.org/external/sdmx/2.1/data/CPI/KAZ.CPI._T.POP_PCH_PA_PT.M
    frequency: monthly
    start_date: 2005-01-01
    caveat_en: Month-on-month percentage change in official Consumer Price Index.
    caveat_zh: 月度消费者物价指数环比变动率。

  - id: cpi_index
    section: prices_costs
    label_en: Headline Consumer Price Index
    label_zh: 总体消费价格指数基数
    unit: "Index"
    fetcher: imf_sdmx
    dataflow: CPI
    series: KAZ.CPI._T.IX.M
    source_name: IMF SDMX / Kazakhstan BNS
    source_url: https://api.imf.org/external/sdmx/2.1/data/CPI/KAZ.CPI._T.IX.M
    frequency: monthly
    start_date: 2005-01-01
    caveat_en: Consumer Price Index (All items) monthly index level.
    caveat_zh: 总体消费者物价指数月度定基指数。

  - id: cpi_inflation_weo
    section: prices_costs
    label_en: Headline Inflation (IMF WEO Cross-Check)
    label_zh: 总体通胀率 (IMF WEO交叉核对)
    unit: "%"
    fetcher: imf_datamapper
    series: PCPIPCH/KAZ
    actual_through: 2025
    source_name: IMF DataMapper (WEO)
    source_url: https://www.imf.org/external/datamapper/PCPIPCH/KAZ
    frequency: annual
    start_date: 2000-01-01
    caveat_en: Annual average consumer price inflation rate from IMF World Economic Outlook.
    caveat_zh: IMF《世界经济展望》提供的年均消费者物价通胀率。

  # ==========================================
  # 4. External Sector, FX & Reserves
  # ==========================================
  - id: usd_kzt
    section: external_fx
    label_en: USD/KZT Official Exchange Rate
    label_zh: 美元兑哈萨克斯坦坚戈官方汇率 (NBK)
    unit: "KZT"
    fetcher: nbk_xml
    currency: USD
    source_name: National Bank of Kazakhstan (NBK)
    source_url: https://nationalbank.kz/rss/rates_all.xml
    frequency: daily
    start_date: 2020-01-01
    caveat_en: Official market exchange rate set by the National Bank of Kazakhstan.
    caveat_zh: 哈萨克斯坦国家银行公布的官方市场基准汇率。

  - id: usd_kzt_ifs
    section: external_fx
    label_en: USD/KZT End-of-Period (IMF IFS)
    label_zh: 美元兑坚戈期末汇率 (IMF IFS)
    unit: "KZT"
    fetcher: dbnomics
    series: IMF/IFS/M.KZ.ENDE_XDC_USD_RATE
    source_name: IMF / DBnomics (IFS)
    source_url: https://db.nomics.world/IMF/IFS/M.KZ.ENDE_XDC_USD_RATE
    frequency: monthly
    start_date: 2000-01-01
    caveat_en: Monthly end-of-period national currency units per US dollar.
    caveat_zh: IMF国际金融统计公布的月末每美元兑坚戈官方汇率。

  - id: eur_kzt
    section: external_fx
    label_en: EUR/KZT Official Exchange Rate
    label_zh: 欧元兑坚戈官方汇率 (NBK)
    unit: "KZT"
    fetcher: nbk_xml
    currency: EUR
    source_name: National Bank of Kazakhstan (NBK)
    source_url: https://nationalbank.kz/rss/rates_all.xml
    frequency: daily
    start_date: 2020-01-01
    caveat_en: Official EUR/KZT exchange rate.
    caveat_zh: 官方欧元兑坚戈汇率。

  - id: rub_kzt
    section: external_fx
    label_en: RUB/KZT Official Exchange Rate
    label_zh: 俄罗斯卢布兑坚戈官方汇率 (NBK)
    unit: "KZT"
    fetcher: nbk_xml
    currency: RUB
    source_name: National Bank of Kazakhstan (NBK)
    source_url: https://nationalbank.kz/rss/rates_all.xml
    frequency: daily
    start_date: 2020-01-01
    caveat_en: Official Russian ruble to tenge rate (critical regional trade linkage).
    caveat_zh: 官方卢布兑坚戈汇率（核心区域贸易货币）。

  - id: cny_kzt
    section: external_fx
    label_en: CNY/KZT Official Exchange Rate
    label_zh: 人民币兑坚戈官方汇率 (NBK)
    unit: "KZT"
    fetcher: nbk_xml
    currency: CNY
    source_name: National Bank of Kazakhstan (NBK)
    source_url: https://nationalbank.kz/rss/rates_all.xml
    frequency: daily
    start_date: 2020-01-01
    caveat_en: Official Chinese yuan to tenge rate.
    caveat_zh: 官方人民币兑坚戈汇率。

  - id: reer
    section: external_fx
    label_en: Real Effective Exchange Rate (120 Partners)
    label_zh: 实际有效汇率 (REER 120国)
    unit: "2007=100"
    fetcher: bruegel_reer
    country: KZ
    series_type: reer_120
    source_name: Bruegel (Darvas REER Dataset)
    source_url: https://www.bruegel.org/publications/datasets/real-effective-exchange-rates-for-178-countries-a-new-database
    frequency: monthly
    start_date: 2005-01-01
    caveat_en: CPI-deflated real effective exchange rate against 120 trading partners.
    caveat_zh: 基于CPI平减的对120个贸易伙伴的实际有效汇率。

  - id: neer
    section: external_fx
    label_en: Nominal Effective Exchange Rate (120 Partners)
    label_zh: 名义有效汇率 (NEER 120国)
    unit: "2007=100"
    fetcher: bruegel_reer
    country: KZ
    series_type: neer_120
    source_name: Bruegel (Darvas REER Dataset)
    source_url: https://www.bruegel.org/publications/datasets/real-effective-exchange-rates-for-178-countries-a-new-database
    frequency: monthly
    start_date: 2005-01-01
    caveat_en: Trade-weighted nominal effective exchange rate against 120 trading partners.
    caveat_zh: 贸易加权名义有效汇率。

  - id: current_account_usd
    section: external_fx
    label_en: Current Account Balance (USD Millions)
    label_zh: 经常账户差额 (百万美元)
    unit: "USD mn"
    fetcher: imf_sdmx
    dataflow: BOP
    series: KAZ.NETCD_T.CAB.USD.Q
    scale: 1000000
    source_name: IMF SDMX / NBK
    source_url: https://api.imf.org/external/sdmx/2.1/data/BOP/KAZ.NETCD_T.CAB.USD.Q
    frequency: quarterly
    start_date: 2005-01-01
    caveat_en: Quarterly BPM6 current account balance in millions of US dollars.
    caveat_zh: BPM6季度经常账户净差额（百万美元）。

  - id: goods_trade_balance
    section: external_fx
    label_en: Goods Trade Balance (USD Millions)
    label_zh: 货物贸易差额 (百万美元)
    unit: "USD mn"
    fetcher: imf_sdmx
    dataflow: BOP
    series: KAZ.NETCD_T.G.USD.Q
    scale: 1000000
    source_name: IMF SDMX / NBK
    source_url: https://api.imf.org/external/sdmx/2.1/data/BOP/KAZ.NETCD_T.G.USD.Q
    frequency: quarterly
    start_date: 2005-01-01
    caveat_en: Net balance of merchandise exports minus imports (BPM6, USD millions).
    caveat_zh: 货物出口减去进口净额（BPM6标准，百万美元）。

  - id: goods_exports
    section: external_fx
    label_en: Goods Exports (BOP Basis, USD Millions)
    label_zh: 货物出口总额 (BOP口径，百万美元)
    unit: "USD mn"
    fetcher: imf_sdmx
    dataflow: BOP
    series: KAZ.CD_T.G.USD.Q
    scale: 1000000
    source_name: IMF SDMX / NBK
    source_url: https://api.imf.org/external/sdmx/2.1/data/BOP/KAZ.CD_T.G.USD.Q
    frequency: quarterly
    start_date: 2005-01-01
    caveat_en: Quarterly BPM6 merchandise exports credit in millions of US dollars.
    caveat_zh: BPM6季度货物出口总额（百万美元）。

  - id: goods_imports
    section: external_fx
    label_en: Goods Imports (BOP Basis, USD Millions)
    label_zh: 货物进口总额 (BOP口径，百万美元)
    unit: "USD mn"
    fetcher: imf_sdmx
    dataflow: BOP
    series: KAZ.DB_T.G.USD.Q
    scale: 1000000
    source_name: IMF SDMX / NBK
    source_url: https://api.imf.org/external/sdmx/2.1/data/BOP/KAZ.DB_T.G.USD.Q
    frequency: quarterly
    start_date: 2005-01-01
    caveat_en: Quarterly BPM6 merchandise imports debit in millions of US dollars.
    caveat_zh: BPM6季度货物进口总额（百万美元）。

  - id: services_balance
    section: external_fx
    label_en: Services Trade Balance (USD Millions)
    label_zh: 服务贸易差额 (百万美元)
    unit: "USD mn"
    fetcher: imf_sdmx
    dataflow: BOP
    series: KAZ.NETCD_T.S.USD.Q
    scale: 1000000
    source_name: IMF SDMX / NBK
    source_url: https://api.imf.org/external/sdmx/2.1/data/BOP/KAZ.NETCD_T.S.USD.Q
    frequency: quarterly
    start_date: 2005-01-01
    caveat_en: Quarterly BPM6 services trade balance in millions of US dollars.
    caveat_zh: BPM6季度服务贸易净差额（百万美元）。

  - id: fdi_net_usd
    section: external_fx
    label_en: Direct Investment Net Balance (FDI, USD Millions)
    label_zh: 直接投资净额 (FDI，百万美元)
    unit: "USD mn"
    fetcher: imf_sdmx
    dataflow: BOP
    series: KAZ.NNAFANIL_T.D_F.USD.Q
    scale: 1000000
    source_name: IMF SDMX / NBK
    source_url: https://api.imf.org/external/sdmx/2.1/data/BOP/KAZ.NNAFANIL_T.D_F.USD.Q
    frequency: quarterly
    start_date: 2005-01-01
    caveat_en: Quarterly BPM6 direct investment net acquisition of financial assets less incurrence of liabilities.
    caveat_zh: BPM6金融账户季度直接投资净额（百万美元）。

  - id: current_account_gdp
    section: external_fx
    label_en: Current Account Balance (% of GDP)
    label_zh: 经常账户占GDP比重
    unit: "% of GDP"
    fetcher: imf_datamapper
    series: BCA_NGDPD/KAZ
    actual_through: 2025
    source_name: IMF DataMapper (WEO)
    source_url: https://www.imf.org/external/datamapper/BCA_NGDPD/KAZ
    frequency: annual
    start_date: 2000-01-01
    caveat_en: Current account balance expressed as a percentage of gross domestic product.
    caveat_zh: 经常账户差额占GDP比重。

  - id: total_reserves_usd
    section: external_fx
    label_en: Total Official Reserves (Including Gold)
    label_zh: 官方储备资产总额 (含黄金)
    unit: "USD bn"
    fetcher: world_bank
    country: KAZ
    series: FI.RES.TOTL.CD
    scale: 1000000000
    source_authority: official_secondary
    source_name: World Bank / NBK
    source_url: https://data.worldbank.org/indicator/FI.RES.TOTL.CD?locations=KZ
    frequency: annual
    start_date: 2000-01-01
    caveat_en: Total official reserves comprising foreign exchange, SDRs, and gold holdings in billions of US dollars.
    caveat_zh: 官方储备资产总额（包含外汇、SDR与黄金，十亿美元，世行口径）。

  # ==========================================
  # 5. Fiscal & Sovereign
  # ==========================================
  - id: government_debt_gdp
    section: fiscal_sovereign
    label_en: General Government Gross Debt (% of GDP)
    label_zh: 广义政府总债务占GDP比重
    unit: "% of GDP"
    fetcher: imf_datamapper
    series: GGXWDG_NGDP/KAZ
    actual_through: 2025
    source_name: IMF DataMapper (WEO)
    source_url: https://www.imf.org/external/datamapper/GGXWDG_NGDP/KAZ
    frequency: annual
    start_date: 2000-01-01
    caveat_en: General government gross debt as a percentage of GDP.
    caveat_zh: 广义政府总债务占GDP比重。

  - id: fiscal_balance_gdp
    section: fiscal_sovereign
    label_en: Fiscal Balance (% of GDP)
    label_zh: 财政净借贷(赤字率)占GDP比重
    unit: "% of GDP"
    fetcher: imf_datamapper
    series: GGXCNL_NGDP/KAZ
    actual_through: 2025
    source_name: IMF DataMapper (WEO)
    source_url: https://www.imf.org/external/datamapper/GGXCNL_NGDP/KAZ
    frequency: annual
    start_date: 2000-01-01
    caveat_en: General government net lending/borrowing as a percentage of GDP.
    caveat_zh: 广义政府净借贷（赤字率）占GDP比重。

  - id: primary_balance_gdp
    section: fiscal_sovereign
    label_en: Primary Net Lending/Borrowing (% of GDP)
    label_zh: 初级财政收支占GDP比重
    unit: "% of GDP"
    fetcher: imf_datamapper
    series: GGXONLB_G01_GDP_PT/KAZ
    actual_through: 2025
    source_name: IMF DataMapper (Fiscal Monitor)
    source_url: https://www.imf.org/external/datamapper/GGXONLB_G01_GDP_PT/KAZ
    frequency: annual
    start_date: 2000-01-01
    caveat_en: Primary net lending/borrowing excluding net interest outlays.
    caveat_zh: 剔除净利息支出的初级财政收支占GDP比重。

  - id: fx_reserves
    section: fiscal_sovereign
    label_en: Foreign Exchange Reserves (USD)
    label_zh: 官方外汇储备总额 (美元)
    unit: "USD"
    fetcher: fred_graph
    series: KAZFAFARUSD
    source_name: IMF / FRED
    source_url: https://fred.stlouisfed.org/series/KAZFAFARUSD
    frequency: annual
    start_date: 2000-01-01
    caveat_en: Total foreign exchange reserves in US dollars reported to the IMF.
    caveat_zh: 报送IMF的官方外汇储备总额。

  # ==========================================
  # 6. Monetary, Credit & Commodities
  # ==========================================
  - id: policy_rate
    section: monetary_financial
    label_en: Monetary Policy-Related Interest Rate
    label_zh: 央行货币政策利率
    unit: "%"
