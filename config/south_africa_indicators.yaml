sections:
  data_quirks:
    title_en: "Data Quirks & Release Discipline"
    title_zh: "数据特性与发布纪律"
    report_logic_en: "South African labour data comes from the quarterly QLFS, whose headline unemployment rate excludes discouraged workers reported separately in the expanded definition. Activity data is monthly but thin, and load-shedding breaks make several production series non-comparable across years. SARB's own web API is preferred for rates and prices because it is the compiling authority."
    report_logic_zh: "南非劳动力数据来自季度QLFS，其官方失业率不含在扩大口径中单独统计的沮丧工人。活动数据为月度但覆盖较薄，限电断点使部分生产序列跨年不可比。利率与价格优先使用SARB自有Web API，因其为编制机构。"
  growth_accounts:
    title_en: "GDP & National Accounts"
    title_zh: "GDP与国民账户"
    report_logic_en: "Stats SA national accounts anchor the macro story: real GDP level, sequential and year-over-year growth, nominal GDP, and fixed investment."
    report_logic_zh: "南非统计局国民账户构成宏观叙事基准：实际GDP水平、环比与同比增速、名义GDP与固定投资。"
  production_cycle:
    title_en: "Production & Business Cycle"
    title_zh: "生产与商业周期"
    report_logic_en: "Manufacturing production, capacity utilisation, and the OECD composite leading indicator read the cycle. South Africa has no monthly total-industry index on a validated public endpoint, so manufacturing carries the cyclical signal."
    report_logic_zh: "制造业生产、产能利用率与OECD综合领先指标用于判断周期。南非在已验证的公开接口上没有月度工业总体指数，因此由制造业承载周期信号。"
  consumption_retail:
    title_en: "Consumption & Retail Demand"
    title_zh: "消费与零售需求"
    report_logic_en: "Retail trade volume is the highest-frequency read on South African household demand, which is squeezed between high unemployment and high real policy rates."
    report_logic_zh: "零售贸易量是观察南非居民需求最高频的指标，而居民需求同时受高失业与高实际政策利率挤压。"
  labour_wages:
    title_en: "Labour Market"
    title_zh: "劳动力市场"
    report_logic_en: "Unemployment is South Africa's central macro and political variable. The headline, working-age, and youth rates plus long-term unemployment describe a structural rather than cyclical problem."
    report_logic_zh: "失业是南非最核心的宏观与政治变量。总体、劳动年龄与青年失业率以及长期失业共同刻画的是结构性而非周期性问题。"
  prices_costs:
    title_en: "Prices & Costs"
    title_zh: "价格与成本"
    report_logic_en: "SARB publishes headline CPI and PPI directly through its web API, which is the compiling-authority path. The IMF CPI series is charted alongside as an independent cross-check."
    report_logic_zh: "SARB通过其Web API直接发布总体CPI与PPI，属编制机构路径。IMF CPI序列并列展示，作为独立交叉校验。"
  housing_property:
    title_en: "Housing & Property Prices"
    title_zh: "住房与房地产价格"
    report_logic_en: "BIS residential property price indices give internationally comparable nominal and real house prices. The real index shows that South African housing has lost value in inflation-adjusted terms for over a decade."
    report_logic_zh: "BIS住宅价格指数提供国际可比的名义与实际房价。实际指数显示南非住房在通胀调整口径下已贬值十余年。"
  external_fx:
    title_en: "External Balance & FX"
    title_zh: "外部平衡与汇率"
    report_logic_en: "Commodity-driven merchandise trade, the current-account ratio, the rand crosses, and effective exchange rates capture the external funding channel that dominates South African risk premia."
    report_logic_zh: "由大宗商品驱动的货物贸易、经常账户比率、兰特汇率与有效汇率共同刻画主导南非风险溢价的外部融资渠道。"
  fiscal_sovereign:
    title_en: "Fiscal & Sovereign"
    title_zh: "财政与主权"
    report_logic_en: "IMF WEO fiscal ratios plus SARB's published benchmark bond yields frame the debt-sustainability question that drives the sovereign rating."
    report_logic_zh: "IMF WEO财政比率与SARB公布的基准国债收益率共同框定驱动主权评级的债务可持续性问题。"
  monetary_financial:
    title_en: "Monetary & Financial Conditions"
    title_zh: "货币与金融条件"
    report_logic_en: "The SARB policy rate, prime lending rate, SABOR and ZARONIA benchmarks, broad money, and BIS credit ratios describe an inflation-targeting regime running deliberately positive real rates."
    report_logic_zh: "SARB政策利率、优惠贷款利率、SABOR与ZARONIA基准、广义货币及BIS信贷比率共同描述一个有意维持正实际利率的通胀目标制。"
  stability_structural:
    title_en: "Financial Stability & Structural Risk"
    title_zh: "金融稳定与结构性风险"
    report_logic_en: "IMF Financial Soundness Indicators give the deposit-taker capital and asset-quality core; BIS total-credit ratios show aggregate leverage, which is moderate by emerging-market standards."
    report_logic_zh: "IMF金融稳健指标提供存款机构资本与资产质量核心指标；BIS总信贷比率反映整体杠杆，按新兴市场标准处于温和水平。"

min_chart_count: 60

indicators:
  # --- growth_accounts -----------------------------------------------------
  - id: real_gdp_growth
    section: growth_accounts
    label_en: "Real GDP Growth, QoQ"
    label_zh: "实际GDP环比"
    unit: "% q/q"
    transform: "pct_change"
    fetcher: fred
    series: "NGDPRSAXDCZAQ"
    source_name: "FRED / OECD (Stats SA)"
    source_url: "https://fred.stlouisfed.org/series/NGDPRSAXDCZAQ"
    frequency: "quarterly"
    start_date: "1995-01-01"
    caveat_en: "Derived quarter-on-quarter growth from the seasonally adjusted real GDP level in rand."
    caveat_zh: "由季调实际兰特GDP水平派生的环比增速。"
  - id: real_gdp_yoy
    section: growth_accounts
    label_en: "Real GDP Growth, YoY"
    label_zh: "实际GDP同比"
    unit: "% y/y"
    transform: "yoy_pct"
    fetcher: fred
    series: "NGDPRSAXDCZAQ"
    source_name: "FRED / OECD (Stats SA)"
    source_url: "https://fred.stlouisfed.org/series/NGDPRSAXDCZAQ"
    frequency: "quarterly"
    start_date: "1995-01-01"
    caveat_en: "Derived year-over-year growth from the seasonally adjusted real GDP level."
    caveat_zh: "由季调实际GDP水平派生的同比增速。"
  - id: real_gdp_level
    section: growth_accounts
    label_en: "Real GDP Level"
    label_zh: "实际GDP水平"
    unit: "ZAR mn"
    fetcher: fred
    series: "NGDPRSAXDCZAQ"
    source_name: "FRED / OECD (Stats SA)"
    source_url: "https://fred.stlouisfed.org/series/NGDPRSAXDCZAQ"
    frequency: "quarterly"
    start_date: "1995-01-01"
    caveat_en: "Seasonally adjusted real GDP in millions of rand; the flat post-2014 level is the clearest picture of South Africa's lost decade."
    caveat_zh: "以百万兰特计的季调实际GDP；2014年后的平坦水平最直观地呈现了南非失去的十年。"
  - id: nominal_gdp_growth
    section: growth_accounts
    label_en: "Nominal GDP Growth"
    label_zh: "名义GDP同比"
    unit: "% y/y"
    transform: "yoy_pct"
    fetcher: fred
    series: "NGDPSAXDCZAQ"
    source_name: "FRED / OECD (Stats SA)"
    source_url: "https://fred.stlouisfed.org/series/NGDPSAXDCZAQ"
    frequency: "quarterly"
    start_date: "1995-01-01"
    caveat_en: "Derived from seasonally adjusted nominal GDP in rand; nominal growth is the denominator that drives the debt-to-GDP path."
    caveat_zh: "由季调名义兰特GDP派生；名义增速是决定债务/GDP路径的分母。"
  - id: gfcf_growth
    section: growth_accounts
    label_en: "Gross Fixed Capital Formation Growth"
    label_zh: "固定资本形成同比"
    unit: "% y/y"
    transform: "yoy_pct"
    fetcher: fred
    series: "NFIRSAXDCZAQ"
    source_name: "FRED / OECD (Stats SA)"
    source_url: "https://fred.stlouisfed.org/series/NFIRSAXDCZAQ"
    frequency: "quarterly"
    start_date: "1995-01-01"
    caveat_en: "Derived from real gross fixed capital formation; South Africa's investment ratio has run well below the National Development Plan target for a decade."
    caveat_zh: "由实际固定资本形成总额派生；南非投资率已连续十年远低于国家发展规划目标。"

  # --- production_cycle ----------------------------------------------------
  - id: manufacturing_production_growth
    section: production_cycle
    label_en: "Manufacturing Production, YoY"
    label_zh: "制造业生产同比"
    unit: "% y/y"
    fetcher: fred
    series: "ZAFPRMNTO01GYSAM"
    source_name: "FRED / OECD (Stats SA)"
    source_url: "https://fred.stlouisfed.org/series/ZAFPRMNTO01GYSAM"
    frequency: "monthly"
    start_date: "1995-01-01"
    caveat_en: "Manufacturing output is the monthly cyclical proxy for South African industry; load-shedding episodes create breaks that are not seasonal."
    caveat_zh: "制造业产出是南非工业的月度周期代理；限电时段造成的断点并非季节性因素。"
  - id: manufacturing_production_mom
    section: production_cycle
    label_en: "Manufacturing Production, MoM"
    label_zh: "制造业生产环比"
    unit: "% m/m"
    fetcher: fred
    series: "ZAFPRMNTO01GPSAM"
    source_name: "FRED / OECD (Stats SA)"
    source_url: "https://fred.stlouisfed.org/series/ZAFPRMNTO01GPSAM"
    frequency: "monthly"
    start_date: "1995-01-01"
    caveat_en: "Seasonally adjusted month-over-month change; noisy at monthly frequency and best read as a three-month average."
    caveat_zh: "季调环比变化；月度频率噪声较大，宜以三个月均值阅读。"
  - id: capacity_utilisation
    section: production_cycle
    label_en: "Capacity Utilisation Balance"
    label_zh: "产能利用率景气差"
    unit: "% balance"
    fetcher: fred
    series: "BSCURT02ZAQ160S"
    source_name: "FRED / OECD Business Tendency Surveys"
    source_url: "https://fred.stlouisfed.org/series/BSCURT02ZAQ160S"
    frequency: "quarterly"
    start_date: "1995-01-01"
    caveat_en: "Survey-based percentage balance for manufacturing capacity utilisation, not a physical utilisation rate."
    caveat_zh: "制造业产能利用率的调查百分比差值，并非物理利用率。"
  - id: composite_leading_indicator
    section: production_cycle
    label_en: "OECD Composite Leading Indicator"
    label_zh: "OECD综合领先指标"
    unit: "index"
    fetcher: fred
    series: "ZAFLOLITOAASTSAM"
    source_name: "FRED / OECD"
    source_url: "https://fred.stlouisfed.org/series/ZAFLOLITOAASTSAM"
    frequency: "monthly"
    start_date: "1995-01-01"
    caveat_en: "Amplitude-adjusted CLI centred on 100; the closest validated public stand-in for the vendor-proprietary business-confidence indices."
    caveat_zh: "振幅调整后的CLI，以100为中枢；是供应商专有企业信心指数最接近的已验证公开替代。"

  # --- consumption_retail --------------------------------------------------
  - id: retail_sales_growth
    section: consumption_retail
    label_en: "Retail Trade Volume, YoY"
    label_zh: "零售贸易量同比"
    unit: "% y/y"
    fetcher: fred
    series: "ZAFSLRTTO01GYSAM"
    source_name: "FRED / OECD (Stats SA)"
    source_url: "https://fred.stlouisfed.org/series/ZAFSLRTTO01GYSAM"
    frequency: "monthly"
    start_date: "1995-01-01"
    caveat_en: "Volume rather than value, so it isolates real household demand from the high domestic inflation base."
    caveat_zh: "为量指标而非值指标，从而把实际居民需求与国内高通胀基数区分开。"
  - id: retail_sales_mom
    section: consumption_retail
    label_en: "Retail Trade Volume, MoM"
    label_zh: "零售贸易量环比"
    unit: "% m/m"
    fetcher: fred
    series: "ZAFSLRTTO01GPSAM"
    source_name: "FRED / OECD (Stats SA)"
    source_url: "https://fred.stlouisfed.org/series/ZAFSLRTTO01GPSAM"
    frequency: "monthly"
    start_date: "1995-01-01"
    caveat_en: "Seasonally adjusted month-over-month change; single months are noisy around festive-season trading."
    caveat_zh: "季调环比变化；节庆消费季前后单月噪声较大。"

  # --- labour_wages --------------------------------------------------------
  - id: unemployment_rate
    section: labour_wages
    label_en: "Unemployment Rate"
    label_zh: "失业率"
    unit: "%"
    fetcher: fred
    series: "LRUNTTTTZAQ156S"
    source_name: "FRED / OECD (Stats SA QLFS)"
    source_url: "https://fred.stlouisfed.org/series/LRUNTTTTZAQ156S"
    frequency: "quarterly"
    start_date: "2008-01-01"
    caveat_en: "Narrow (official) definition, 15 years and over. Stats SA's expanded definition including discouraged work-seekers runs roughly 10pp higher."
    caveat_zh: "15岁及以上的窄口径（官方）定义。南非统计局含沮丧求职者的扩大口径约高出10个百分点。"
  - id: unemployment_rate_15_64
    section: labour_wages
    label_en: "Unemployment Rate, 15-64"
    label_zh: "失业率（15-64岁）"
    unit: "%"
    fetcher: fred
    series: "LRUN64TTZAQ156S"
    source_name: "FRED / OECD (Stats SA QLFS)"
    source_url: "https://fred.stlouisfed.org/series/LRUN64TTZAQ156S"
    frequency: "quarterly"
    start_date: "2008-01-01"
    caveat_en: "Working-age restriction of the narrow definition; tracks the headline rate closely because youth cohorts dominate the unemployed pool."
    caveat_zh: "窄口径在劳动年龄段的限定；因失业人口以青年为主，与总体失业率走势接近。"
  - id: youth_unemployment_rate
    section: labour_wages
    label_en: "Youth Unemployment Rate, 15-24"
    label_zh: "青年失业率（15-24岁）"
    unit: "%"
    fetcher: fred
    series: "LRUN24TTZAQ156S"
    source_name: "FRED / OECD (Stats SA QLFS)"
    source_url: "https://fred.stlouisfed.org/series/LRUN24TTZAQ156S"
    frequency: "quarterly"
    start_date: "2008-01-01"
    caveat_en: "The highest youth unemployment rate in the OECD reporting population; it is the core structural and political constraint on South African policy."
    caveat_zh: "在OECD报送国中最高的青年失业率；这是南非政策面临的核心结构性与政治约束。"
  - id: long_term_unemployment
    section: labour_wages
    label_en: "Long-Term Unemployment"
    label_zh: "长期失业人数"
    unit: "persons"
    fetcher: fred
    series: "LFUTLTTTZAQ647S"
    source_name: "FRED / OECD (Stats SA QLFS)"
    source_url: "https://fred.stlouisfed.org/series/LFUTLTTTZAQ647S"
    frequency: "quarterly"
    start_date: "2008-01-01"
    caveat_en: "Persons unemployed for a year or more. The share of long-term in total unemployment is what makes the South African problem structural rather than cyclical."
    caveat_zh: "失业一年以上的人数。长期失业在总失业中的占比，正是南非问题属结构性而非周期性的原因。"
  - id: manufacturing_employment_growth
    section: labour_wages
    label_en: "Manufacturing Employment Growth"
    label_zh: "制造业就业同比"
    unit: "% y/y"
    transform: "yoy_pct"
    fetcher: fred
    series: "LFEAMNTTZAQ647S"
    source_name: "FRED / OECD (Stats SA QLFS)"
    source_url: "https://fred.stlouisfed.org/series/LFEAMNTTZAQ647S"
    frequency: "quarterly"
    start_date: "2008-01-01"
    caveat_en: "Derived from the manufacturing employment level; the sector's long-run decline is the counterpart to the services and public-sector employment share."
    caveat_zh: "由制造业就业人数派生；该部门的长期萎缩与服务业及公共部门就业占比上升互为对应。"

  # --- prices_costs --------------------------------------------------------
  - id: cpi_inflation
    section: prices_costs
    label_en: "Headline CPI, YoY"
    label_zh: "总体CPI同比"
    unit: "% y/y"
    fetcher: sarb
    source_authority: official_primary
    series: "CPI1000F"
    source_name: "SARB Web API (Stats SA)"
    source_url: "https://www.resbank.co.za/en/home/what-we-do/statistics"
    frequency: "monthly"
    start_date: "2000-01-01"
    caveat_en: "Total all-urban-areas CPI, 12-term percentage change, as published by SARB from Stats SA source data. The SARB inflation target band is 3-6%."
    caveat_zh: "SARB依据南非统计局源数据发布的全城市地区CPI 12期同比。SARB通胀目标区间为3-6%。"
  - id: ppi_inflation
    section: prices_costs
    label_en: "Producer Prices, YoY"
    label_zh: "生产者价格同比"
    unit: "% y/y"
    fetcher: sarb
    source_authority: official_primary
    series: "PPI1000F"
    source_name: "SARB Web API (Stats SA)"
    source_url: "https://www.resbank.co.za/en/home/what-we-do/statistics"
    frequency: "monthly"
    start_date: "2000-01-01"
    caveat_en: "Total producer prices, 12-term percentage change. Leads headline CPI by roughly one to two quarters in food and fuel channels."
    caveat_zh: "总体生产者价格12期同比。在食品与燃料渠道上领先总体CPI约一至两个季度。"
  - id: cpi_inflation_imf
    section: prices_costs
    label_en: "Headline CPI, YoY (IMF cross-check)"
    label_zh: "总体CPI同比（IMF交叉校验）"
    unit: "% y/y"
    fetcher: imf_sdmx
    dataflow: "CPI"
    series: "ZAF.CPI._T.YOY_PCH_PA_PT.M"
    source_name: "IMF SDMX / CPI (Stats SA)"
    source_url: "https://api.imf.org/external/sdmx/2.1/data/CPI/ZAF.CPI._T.YOY_PCH_PA_PT.M"
    frequency: "monthly"
    start_date: "2000-01-01"
    caveat_en: "Independently compiled from the same Stats SA source. Charted deliberately alongside the SARB series so any divergence between the two publication paths is visible."
    caveat_zh: "由IMF依据相同的南非统计局源数据独立汇编。刻意与SARB序列并列展示，以便发现两条发布路径之间的差异。"
  - id: cpi_mom
    section: prices_costs
    label_en: "Headline CPI, MoM"
    label_zh: "总体CPI环比"
    unit: "% m/m"
    fetcher: imf_sdmx
    dataflow: "CPI"
    series: "ZAF.CPI._T.POP_PCH_PA_PT.M"
    source_name: "IMF SDMX / CPI (Stats SA)"
    source_url: "https://api.imf.org/external/sdmx/2.1/data/CPI/ZAF.CPI._T.POP_PCH_PA_PT.M"
    frequency: "monthly"
    start_date: "2000-01-01"
    caveat_en: "Not seasonally adjusted; month-over-month prints carry an administered-price seasonal pattern from the annual electricity and fuel levy resets."
    caveat_zh: "未季调；受电价与燃油税年度调整影响，环比读数带有管制价格的季节性形态。"
  - id: cpi_index
    section: prices_costs
    label_en: "Headline CPI Index"
    label_zh: "总体CPI指数"
    unit: "index"
    fetcher: imf_sdmx
    dataflow: "CPI"
    series: "ZAF.CPI._T.IX.M"
    source_name: "IMF SDMX / CPI (Stats SA)"
    source_url: "https://api.imf.org/external/sdmx/2.1/data/CPI/ZAF.CPI._T.IX.M"
    frequency: "monthly"
    start_date: "2000-01-01"
    caveat_en: "Price level rather than a rate; the cumulative slope is what erodes the real house-price and real-wage series."
    caveat_zh: "为价格水平而非增速；其累计斜率正是侵蚀实际房价与实际工资序列的因素。"

  # --- housing_property ----------------------------------------------------
  - id: house_price_index
    section: housing_property
    label_en: "Residential Property Prices"
    label_zh: "住宅价格指数"
    unit: "index"
    fetcher: fred
    series: "QZAN628BIS"
    source_name: "FRED / BIS"
    source_url: "https://fred.stlouisfed.org/series/QZAN628BIS"
    frequency: "quarterly"
    start_date: "1995-01-01"
    caveat_en: "BIS nominal residential property price index, 2010=100; sourced from bank mortgage-valuation data rather than a deeds-registry transaction index."
    caveat_zh: "BIS名义住宅价格指数（2010=100）；来源为银行按揭估值数据，而非产权登记成交指数。"
  - id: real_house_price_index
    section: housing_property
    label_en: "Real Residential Property Prices"
    label_zh: "实际住宅价格指数"
    unit: "index"
    fetcher: fred
    series: "QZAR628BIS"
    source_name: "FRED / BIS"
    source_url: "https://fred.stlouisfed.org/series/QZAR628BIS"
    frequency: "quarterly"
    start_date: "1995-01-01"
    caveat_en: "CPI-deflated house prices. The sustained decline since 2008 means South African housing has been a negative real asset for most of a generation."
    caveat_zh: "经CPI平减的房价。自2008年以来的持续下滑意味着南非住房在近一代人时间内多数时候是负实际收益资产。"
  - id: house_price_growth
    section: housing_property
    label_en: "House Price Growth, YoY"
    label_zh: "房价同比"
    unit: "% y/y"
    transform: "yoy_pct"
    fetcher: fred
    series: "QZAN628BIS"
    source_name: "FRED / BIS"
    source_url: "https://fred.stlouisfed.org/series/QZAN628BIS"
    frequency: "quarterly"
    start_date: "1995-01-01"
    caveat_en: "Derived year-over-year growth from the BIS nominal residential price index; compare against headline CPI to read the real trend."
    caveat_zh: "由BIS名义住宅价格指数派生的同比增速；与总体CPI对照可读出实际趋势。"

  # --- external_fx ---------------------------------------------------------
  - id: goods_exports
