    caveat_en: "Exchange-rate converted to US dollars. Platinum-group metals, gold, coal, and iron ore dominate, so the series tracks commodity prices closely."
    caveat_zh: "按汇率折算为美元。铂族金属、黄金、煤炭与铁矿石占主导，因此该序列与大宗商品价格高度相关。"
  - id: goods_imports
    section: external_fx
    label_en: "Goods Imports"
    label_zh: "货物进口"
    unit: "USD bn"
    scale: 1000000000
    fetcher: fred
