    caveat_zh: "含利息的净贷出/净借入。偿债成本已成为南非国库预算中增长最快的科目。"
  - id: primary_balance_gdp
    section: fiscal_sovereign
    label_en: "General Government Primary Balance"
    label_zh: "广义政府基本差额"
    unit: "% of GDP"
    fetcher: imf_datamapper
    series: "GGXONLB_G01_GDP_PT"
    country_iso3: "ZAF"
    source_name: "IMF Fiscal Monitor DataMapper"
    source_url: "https://www.imf.org/external/datamapper/GGXONLB_G01_GDP_PT@FM/ZAF"
    frequency: "annual"
    actual_through: 2025
    caveat_en: "Balance excluding interest. The National Treasury's consolidation strategy is anchored on sustaining a primary surplus."
    caveat_zh: "剔除利息的差额。南非国库的财政整顿战略以维持基本盈余为锚。"
  - id: sovereign_yield_10y
    section: fiscal_sovereign
    label_en: "R2030 Benchmark Bond Yield"
    label_zh: "R2030基准国债收益率"
    unit: "%"
    fetcher: sarb
    source_authority: official_primary
    series: "MMRD708A"
    source_name: "SARB Web API"
    source_url: "https://www.resbank.co.za/en/home/what-we-do/statistics"
    frequency: "daily"
    start_date: "2015-01-01"
    caveat_en: "Closing yield on the 8.00% 2030 government bond, SARB's published medium-tenor benchmark. Not a constant-maturity 10-year series, so its tenor shortens over time."
    caveat_zh: "8.00% 2030年国债的收盘收益率，为SARB公布的中期基准。并非固定期限10年序列，其剩余期限随时间缩短。"
  - id: sovereign_yield_long
    section: fiscal_sovereign
    label_en: "R209 Long Bond Yield"
    label_zh: "R209长期国债收益率"
    unit: "%"
    fetcher: sarb
    source_authority: official_primary
    series: "MMRD709A"
    source_name: "SARB Web API"
    source_url: "https://www.resbank.co.za/en/home/what-we-do/statistics"
    frequency: "daily"
    start_date: "2015-01-01"
    caveat_en: "Closing yield on the 6.25% 2036 government bond. The spread over R2030 is the public read on term premium and fiscal risk."
    caveat_zh: "6.25% 2036年国债的收盘收益率。与R2030之差是观察期限溢价与财政风险的公开读数。"

  # --- monetary_financial --------------------------------------------------
  - id: policy_rate
    section: monetary_financial
    label_en: "SARB Policy Rate"
    label_zh: "南非央行政策利率"
    unit: "%"
    fetcher: sarb
    source_authority: official_primary
    series: "MMRD002A"
    source_name: "SARB Web API"
    source_url: "https://www.resbank.co.za/en/home/what-we-do/monetary-policy"
    frequency: "daily"
    start_date: "2015-01-01"
    caveat_en: "The repo rate set by the Monetary Policy Committee. Published daily, so the series is a step function that changes only on MPC decision dates."
    caveat_zh: "由货币政策委员会设定的回购利率。按日发布，因此序列为阶梯函数，仅在议息日变动。"
  - id: prime_lending_rate
    section: monetary_financial
    label_en: "Prime Lending Rate"
    label_zh: "优惠贷款利率"
    unit: "%"
    fetcher: sarb
    source_authority: official_primary
    series: "MMRD000A"
    source_name: "SARB Web API"
    source_url: "https://www.resbank.co.za/en/home/what-we-do/statistics"
    frequency: "daily"
    start_date: "2015-01-01"
    caveat_en: "Commercial bank prime rate, conventionally the policy rate plus 350bp. Most South African household and SME lending is priced off this benchmark."
    caveat_zh: "商业银行优惠利率，惯例为政策利率加350个基点。南非多数居民与中小企业贷款以此为定价基准。"
  - id: sabor_rate
    section: monetary_financial
    label_en: "SABOR Overnight Rate"
    label_zh: "SABOR隔夜利率"
    unit: "%"
    fetcher: sarb
    source_authority: official_primary
    series: "MMRD851A"
    source_name: "SARB Web API"
    source_url: "https://www.resbank.co.za/en/home/what-we-do/statistics"
    frequency: "daily"
    start_date: "2015-01-01"
    caveat_en: "South African Benchmark Overnight Rate. Its spread to the policy rate is the money-market liquidity signal."
    caveat_zh: "南非基准隔夜利率。与政策利率之差是货币市场流动性信号。"
  - id: zaronia_rate
    section: monetary_financial
    label_en: "ZARONIA Overnight Rate"
    label_zh: "ZARONIA隔夜利率"
    unit: "%"
    fetcher: sarb
    source_authority: official_primary
    series: "MMRD855A"
    source_name: "SARB Web API"
    source_url: "https://www.resbank.co.za/en/home/what-we-do/statistics"
    frequency: "daily"
    start_date: "2021-01-01"
    caveat_en: "The reformed transaction-based overnight benchmark that is replacing JIBAR. History starts in the 2020s, so it is short by design."
    caveat_zh: "以真实交易为基础、用于替代JIBAR的改革后隔夜基准。历史自2020年代开始，序列本身较短。"
  - id: interbank_3m
    section: monetary_financial
    label_en: "3-Month Interbank Rate (JIBAR)"
    label_zh: "3个月银行间利率（JIBAR）"
    unit: "%"
    fetcher: fred
    series: "IR3TIB01ZAM156N"
    source_name: "FRED / OECD"
    source_url: "https://fred.stlouisfed.org/series/IR3TIB01ZAM156N"
    frequency: "monthly"
    start_date: "1995-01-01"
    caveat_en: "The spread over the policy rate shows how much tightening or easing the money market has priced in ahead of MPC meetings."
    caveat_zh: "与政策利率之差反映货币市场在议息会议前已定价的紧缩或宽松幅度。"
  - id: broad_money_growth
    section: monetary_financial
    label_en: "Broad Money (M3) Growth"
    label_zh: "广义货币M3同比"
    unit: "% y/y"
    fetcher: fred
    series: "ZAFMABMM301GYSAM"
    source_name: "FRED / OECD (SARB)"
    source_url: "https://fred.stlouisfed.org/series/ZAFMABMM301GYSAM"
    frequency: "monthly"
    start_date: "1995-01-01"
    caveat_en: "M3 growth running near nominal GDP growth is the standard sign that credit is neither amplifying nor draining the cycle."
    caveat_zh: "M3增速接近名义GDP增速，是信贷既未放大也未抽离周期的常规信号。"
  - id: private_credit_gdp
    section: monetary_financial
    label_en: "Credit to Private Non-Financial Sector"
    label_zh: "私人非金融部门信贷"
    unit: "% of GDP"
    fetcher: fred
    series: "QZAPAM770A"
    source_name: "FRED / BIS"
    source_url: "https://fred.stlouisfed.org/series/QZAPAM770A"
    frequency: "quarterly"
    start_date: "1995-01-01"
    caveat_en: "BIS total credit to the private non-financial sector, adjusted for breaks; a stock ratio rather than a flow."
    caveat_zh: "BIS对私人非金融部门的总信贷（已作断点调整）；为存量比率而非流量。"
  - id: household_credit_gdp
    section: monetary_financial
    label_en: "Household Credit"
    label_zh: "居民部门信贷"
    unit: "% of GDP"
    fetcher: fred
    series: "QZAHAM770A"
    source_name: "FRED / BIS"
    source_url: "https://fred.stlouisfed.org/series/QZAHAM770A"
    frequency: "quarterly"
    start_date: "1995-01-01"
    caveat_en: "Household and NPISH credit, adjusted for breaks; South African household leverage has fallen steadily since the 2008 peak."
    caveat_zh: "居民与为居民服务的非营利机构信贷（已作断点调整）；南非居民杠杆自2008年峰值以来持续下降。"
  - id: bank_credit_gdp
    section: monetary_financial
    label_en: "Bank Credit to Private Sector"
    label_zh: "银行对私人部门信贷"
    unit: "% of GDP"
    fetcher: fred
    series: "QZAPBM770A"
    source_name: "FRED / BIS"
    source_url: "https://fred.stlouisfed.org/series/QZAPBM770A"
    frequency: "quarterly"
    start_date: "1995-01-01"
    caveat_en: "The bank-only subset of private credit; South Africa's banking system is concentrated in five large institutions."
    caveat_zh: "私人信贷中仅银行部分；南非银行体系集中于五家大型机构。"

  # --- stability_structural ------------------------------------------------
  - id: bank_capital_ratio
    section: stability_structural
    label_en: "Regulatory Capital to Risk-Weighted Assets"
    label_zh: "监管资本充足率"
    unit: "%"
    fetcher: imf_sdmx
    dataflow: "FSIC"
    series: "ZAF.S12CFSI.FSI688_CFSI_PT.Q"
    source_name: "IMF SDMX / Financial Soundness Indicators"
    source_url: "https://api.imf.org/external/sdmx/2.1/data/FSIC/ZAF.S12CFSI.FSI688_CFSI_PT.Q"
    frequency: "quarterly"
    start_date: "2008-01-01"
    caveat_en: "Deposit-taker aggregate reported to the IMF; national regulatory definitions differ, so cross-country levels are indicative rather than exact."
    caveat_zh: "报送IMF的存款机构合计口径；各国监管定义不同，跨国水平比较仅供参考。"
  - id: bank_npl_ratio
    section: stability_structural
    label_en: "Non-Performing Loans to Total Gross Loans"
    label_zh: "不良贷款率"
    unit: "%"
    fetcher: imf_sdmx
    dataflow: "FSIC"
    series: "ZAF.S12CFSI.AQ12_CFSI_PT.Q"
    source_name: "IMF SDMX / Financial Soundness Indicators"
    source_url: "https://api.imf.org/external/sdmx/2.1/data/FSIC/ZAF.S12CFSI.AQ12_CFSI_PT.Q"
    frequency: "quarterly"
    start_date: "2008-01-01"
    caveat_en: "Deposit-taker aggregate. The post-2020 rise reflects the interaction of high prime lending rates with stagnant household income."
    caveat_zh: "存款机构合计口径。2020年后的上升反映了高优惠贷款利率与停滞的居民收入之间的相互作用。"
  - id: total_credit_gdp
    section: stability_structural
    label_en: "Total Credit to Non-Financial Sector"
    label_zh: "非金融部门总信贷"
    unit: "% of GDP"
    fetcher: fred
    series: "QZACAM770A"
    source_name: "FRED / BIS"
    source_url: "https://fred.stlouisfed.org/series/QZACAM770A"
    frequency: "quarterly"
    start_date: "1995-01-01"
    caveat_en: "Includes general government, so this is the aggregate economy-wide leverage stock; moderate by developed-market standards but rising through the government channel."
    caveat_zh: "包含广义政府，因此是全经济杠杆存量；按发达市场标准处于温和水平，但正通过政府渠道上升。"

data_gaps:
  - section: prices_costs
    item_en: "Core CPI excluding food and energy, and the services/goods split"
    item_zh: "剔除食品与能源的核心CPI，以及服务/商品拆分"
    status_en: "Stats SA publishes core CPI in its P0141 release as PDF and Excel without a documented stable API; the IMF CPI dataset carries no COICOP breakdown for South Africa."
    status_zh: "南非统计局在P0141发布中以PDF与Excel形式公布核心CPI，无有文档的稳定API；IMF CPI数据集不含南非的COICOP分项。"
  - section: labour_wages
    item_en: "Expanded unemployment rate, vacancies, and earnings"
    item_zh: "扩大口径失业率、职位空缺与薪酬"
    status_en: "The expanded QLFS definition and the Quarterly Employment Statistics earnings series are published as Stats SA releases without a validated machine-readable endpoint."
    status_zh: "扩大口径QLFS定义与季度就业统计薪酬序列以南非统计局发布物形式公布，尚无经验证的机读接口。"
  - section: production_cycle
    item_en: "Total industry production, mining production, and the BER/PMI business surveys"
    item_zh: "工业总体生产、采矿业生产以及BER/PMI企业调查"
    status_en: "No monthly total-industry or mining index validated on a key-free public endpoint; BER business confidence and the Absa PMI are vendor-controlled."
    status_zh: "尚未在无密钥公开接口上验证月度工业总体或采矿业指数；BER企业信心与Absa PMI由供应商控制。"
  - section: monetary_financial
    item_en: "FTSE/JSE All Share index and equity valuation"
    item_zh: "富时/约翰内斯堡全股指数与股票估值"
    status_en: "JSE index levels are licensed through the exchange and its data vendors; no redistributable public series validated."
    status_zh: "JSE指数水平通过交易所及其数据供应商授权；尚未验证可再分发的公开序列。"
  - section: monetary_financial
    item_en: "Eskom load-shedding stages and electricity availability factor"
    item_zh: "Eskom限电等级与发电可用率"
    status_en: "Published through Eskom's data portal and dashboards without a documented stable API contract; this is the single largest South Africa-specific supply-side variable still missing."
    status_zh: "通过Eskom数据门户与看板发布，无有文档的稳定API契约；这是南非特有供给侧变量中仍缺失的最重要一项。"
  - section: external_fx
    item_en: "Gross reserves level, and sovereign risk spread"
    item_zh: "总储备存量与主权风险利差"
    status_en: "IMF BOP now supplies capital-flow detail (current account components, financial account and its direct/portfolio/other investment sub-categories, and the reserve-asset transaction flow); SARB's own reserves level series and BoP detail remain in the Quarterly Bulletin series set, which the public web API does not expose. The stock/level of the SARB's gross gold and foreign-exchange reserves is therefore still missing (only the quarterly transaction flow is charted); CDS and EMBI spreads remain vendor-controlled."
    status_zh: "IMF国际收支数据现已提供资本流动明细（经常账户各分项、金融账户及其直接/证券/其他投资子类，以及储备资产交易流量）；SARB自有储备存量序列与国际收支明细仍位于季度公报序列集，公开Web API未暴露。因此SARB黄金与外汇总储备的存量水平仍然缺失（本页仅展示季度交易流量）；CDS与EMBI利差仍由供应商控制。"
  - section: fiscal_sovereign
    item_en: "National Treasury monthly revenue and expenditure execution"
    item_zh: "国库月度收支执行"
    status_en: "Section 32 monthly statements are published as PDF and Excel attachments without a stable programmatic endpoint."
    status_zh: "第32条月度报表以PDF与Excel附件形式发布，无稳定的程序化接口。"

cross_checks:
  - concept: headline_inflation
    primary: cpi_inflation          # SARB, compiling authority
    secondary: cpi_inflation_imf    # IMF SDMX, independent path
    tolerance: 0.15
    label_en: "SARB vs IMF headline CPI"
