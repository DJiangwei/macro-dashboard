        - {date: '2026-05-21', value: 2}
  cb_forward_guidance:
    source: Curated central-bank communication tracker
    unit: hawk/dove score
    quality_status: low_confidence
    quality_note: Manual policy-communication score from central-bank decisions, minutes, press conferences, and inflation reports. Scale is -2 clearly dovish, -1 dovish, 0 balanced/data-dependent, +1 hawkish, +2 clearly hawkish.
    postscript: Manual communication score, not a statistical API series or rate forecast. Revise after policy meetings, minutes, inflation reports, or explicit forward-guidance changes.
    references:
      - https://www.mnb.hu/en/monetary-policy/the-monetary-council/press-releases
      - https://nbp.pl/en/monetary-policy/monetary-policy-council/press-releases/
