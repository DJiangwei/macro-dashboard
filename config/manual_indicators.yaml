    source: National Bank of Romania Annual Report snapshot
    unit: '% assets'
    quality_status: watch
    quality_note: Official NBR annual-report market share of credit institutions with majority foreign capital, including branches of foreign credit institutions, in Romanian banking-sector net assets.
    postscript: Manual official snapshot maintained because the harmonised World Bank GFDD series lacks recent Romania coverage and the ECB SSI feed exposes foreign branch/subsidiary assets without a matching Romania banking-sector total-assets denominator.
