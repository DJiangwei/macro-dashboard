        - {date: '2025-12-31', value: 12.00}
        - {date: '2026-05-21', value: 12.00}
  edp_status:
    source: European Commission / Council EDP tracker
    unit: policy-risk score
    quality_status: watch
    quality_note: Manual Excessive Deficit Procedure status score. 0 = no open EDP; 1 = EDP open with regular correction path; 2 = EDP open with non-effective-action or revised heightened-risk path.
    references:
      - https://www.consilium.europa.eu/en/policies/excessive-deficit-procedure/timeline-excessive-deficit-procedure/
      - https://economy-finance.ec.europa.eu/economic-and-fiscal-governance/stability-and-growth-pact/corrective-arm-excessive-deficit-procedure/excessive-deficit-procedures-overview/hungary_en
      - https://economy-finance.ec.europa.eu/economic-and-fiscal-governance/stability-and-growth-pact/corrective-arm-excessive-deficit-procedure/excessive-deficit-procedures-overview/poland_en
      - https://economy-finance.ec.europa.eu/economic-and-fiscal-governance/stability-and-growth-pact/corrective-arm-excessive-deficit-procedure/excessive-deficit-procedures-overview/romania_en
