version: 1
manual_indicators:
  avg_debt_maturity:
    source: Government Debt Management Agency of Hungary snapshot
    unit: years
    quality_status: watch
    quality_note: Official AKK Average Time to Maturity snapshots for central government debt. End-2025 is preliminary and the slide uses 90-day average values.
    postscript: Official AKK snapshot maintained manually because the current Eurostat remaining-maturity query does not cover Hungary; confirm against the latest AKK debt-management material before trading.
    references:
      - https://akk.hu/download?path=68127569-a0fc-4493-98f0-a71cb073c15b.pdf
    observations:
      HU:
        - {date: '2024-12-31', value: 5.8}
        - {date: '2025-12-31', value: 5.5}
  sovereign_rating:
    source: Curated rating-agency tracker
    unit: notch score
    quality_status: watch
    quality_note: Manual average of major-agency long-term foreign-currency sovereign ratings, mapped to a 21-notch scale where AAA/Aaa=21 and BBB-/Baa3=12. Update after S&P, Moody's, Fitch, or Scope sovereign actions.
    references:
      - https://www.spglobal.com/ratings/en/regulatory/article/sovereign-ratings-list-s101674535
      - https://www.cnb.cz/en/about_cnb/international-relations/rating-agencies/
      - https://www.gov.pl/web/finance/fitch-rating-agency-affirmed-polands-credit-rating11
    observations:
      HU:
        - {date: '2024-12-31', value: 12.33}
        - {date: '2025-12-31', value: 12.33}
        - {date: '2026-05-21', value: 12.33}
      PL:
        - {date: '2024-12-31', value: 15.33}
        - {date: '2025-12-31', value: 15.33}
        - {date: '2026-05-21', value: 15.33}
      CZ:
        - {date: '2024-12-31', value: 18.00}
        - {date: '2025-12-31', value: 18.00}
        - {date: '2026-05-21', value: 18.00}
